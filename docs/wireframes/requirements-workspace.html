<title>Requirements</title>
<style>
  :root{
    --paper:#eef0f3; --surface:#fff; --surface-2:#f7f8fa; --ink:#16171c; --ink-2:#43454d; --ink-3:#71737c;
    --line:#e2e4e9; --line-2:#d0d2d9; --brand:#d23b2e;
    /* Brandolini's wall, mapped onto the token system. Hotspot is magenta, not
       red, so it never competes with --brand on the interactive accents. */
    --evt:#e07b1f; --cmd:#2f6fd0; --act:#a9711a; --pol:#8a53c0; --vw:#10876e; --hot:#c2317a;
    /* branch colours, for the map canvas — they organise without meaning anything */
    --b0:#2f6fd0; --b1:#10876e; --b2:#a9711a; --b3:#8a53c0; --b4:#c2317a; --b5:#3d7f8a;
    --shadow:0 1px 2px rgba(16,17,22,.06); --radius:9px;
    --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --paper:#0e0f12;--surface:#17191e;--surface-2:#1d1f25;--ink:#f1f2f4;--ink-2:#bcbfc7;--ink-3:#8b8e97;
    --line:#282a31;--line-2:#363942;--brand:#f0685c;
    --evt:#f0a04a;--cmd:#6fa4ee;--act:#d2a24f;--pol:#b98cec;--vw:#2fb89b;--hot:#ec6aa8;
    --b0:#6fa4ee;--b1:#2fb89b;--b2:#d2a24f;--b3:#b98cec;--b4:#ec6aa8;--b5:#63b3c2;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }}
  :root[data-theme="light"]{--paper:#eef0f3;--surface:#fff;--surface-2:#f7f8fa;--ink:#16171c;--ink-2:#43454d;--ink-3:#71737c;--line:#e2e4e9;--line-2:#d0d2d9;--brand:#d23b2e;--evt:#e07b1f;--cmd:#2f6fd0;--act:#a9711a;--pol:#8a53c0;--vw:#10876e;--hot:#c2317a;--b0:#2f6fd0;--b1:#10876e;--b2:#a9711a;--b3:#8a53c0;--b4:#c2317a;--b5:#3d7f8a;--shadow:0 1px 2px rgba(16,17,22,.06)}
  :root[data-theme="dark"]{--paper:#0e0f12;--surface:#17191e;--surface-2:#1d1f25;--ink:#f1f2f4;--ink-2:#bcbfc7;--ink-3:#8b8e97;--line:#282a31;--line-2:#363942;--brand:#f0685c;--evt:#f0a04a;--cmd:#6fa4ee;--act:#d2a24f;--pol:#b98cec;--vw:#2fb89b;--hot:#ec6aa8;--b0:#6fa4ee;--b1:#2fb89b;--b2:#d2a24f;--b3:#b98cec;--b4:#ec6aa8;--b5:#63b3c2;--shadow:0 1px 2px rgba(0,0,0,.4)}

  *{box-sizing:border-box}
  body{margin:0;height:100vh;overflow:hidden;background:var(--paper);color:var(--ink);
    font-family:var(--font);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  mark{background:color-mix(in srgb,var(--brand) 22%,transparent);color:inherit;border-radius:2px;padding:0 .1em}

  #app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100vh}
  #top{display:flex;align-items:center;gap:10px;padding:0 14px;height:50px;background:var(--surface);
    border-bottom:1px solid var(--line);flex:none}
  .brand{display:flex;align-items:center;gap:8px;flex:none}
  /* the shell's mark, then the tool's name — no wordmark, the logo says it */
  .vsmark{width:15px;height:15px;flex:none;color:var(--ink)}
  .brand b{font-weight:700;letter-spacing:-.01em;line-height:1.2}
  .brand .eyebrow{font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-3);font-weight:700;line-height:1.2}
  .spacer{flex:1}
  /* this stage is a design, not a built tool — the bar should admit that */
  .wip{flex:none;font:700 9.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
    color:#b0761a;background:color-mix(in srgb,#b0761a 12%,transparent);
    border:1px solid color-mix(in srgb,#b0761a 34%,transparent);
    border-radius:999px;padding:4px 8px;white-space:nowrap}
  @media (prefers-color-scheme:dark){.wip{color:#d29a3f;
    background:color-mix(in srgb,#d29a3f 14%,transparent);
    border-color:color-mix(in srgb,#d29a3f 34%,transparent)}}
  .btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:7px;
    border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:.8rem;white-space:nowrap}
  .btn:hover{background:var(--surface-2)}
  .btn[disabled]{opacity:.45;pointer-events:none}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{background:color-mix(in srgb,var(--brand) 88%,#000)}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;color:var(--ink-3);
    font-family:var(--mono);letter-spacing:.04em}
  .live .d{width:7px;height:7px;border-radius:50%;background:var(--vw)}
  kbd{font-family:var(--mono);font-size:.63rem;font-weight:600;background:var(--surface-2);
    border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:.05rem .3rem;color:var(--ink-2)}

  /* ── the stepper. Describe and Method don't disappear when you reach the
        canvas — the prose becomes the left pane, so the step is still there. ── */
  #steps{display:flex;align-items:center;gap:2px;margin-left:6px}
  #steps button{display:inline-flex;align-items:center;gap:.35rem;height:26px;padding:0 .5rem;
    border-radius:6px;font-size:.75rem;font-weight:600;color:var(--ink-3)}
  #steps button:hover{background:var(--surface-2);color:var(--ink-2)}
  #steps button.on{color:var(--ink);background:var(--surface-2)}
  #steps button i{width:16px;height:16px;border-radius:50%;border:1px solid var(--line-2);
    font-family:var(--mono);font-size:.58rem;font-style:normal;font-weight:700;
    display:grid;place-items:center;color:var(--ink-3);flex:none}
  #steps button.on i{background:var(--brand);border-color:var(--brand);color:#fff}
  #steps button.done i{background:var(--ink-3);border-color:var(--ink-3);color:var(--surface)}
  #steps .sep{color:var(--line-2);font-size:.7rem}

  /* ── step 1 · describe ─────────────────────────────────────────────────────── */
  #describe{overflow:auto;display:grid;align-content:start;justify-items:center;padding:3.2rem 1.5rem 2rem}
  .sheet{width:100%;max-width:760px;display:grid;gap:1rem}
  .sheet h1{margin:0;font-size:1.4rem;letter-spacing:-.02em;font-weight:700}
  .sheet .lede{margin:0;color:var(--ink-2);font-size:.92rem;max-width:56ch}
  .sheet textarea{width:100%;min-height:300px;resize:vertical;padding:.9rem 1rem;border-radius:var(--radius);
    border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:inherit;line-height:1.7;
    box-shadow:var(--shadow)}
  .sheet textarea:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 14%,transparent)}
  .nudges{display:grid;gap:.3rem;margin:0;padding:0;list-style:none}
  .nudges li{font-size:.8rem;color:var(--ink-3);display:flex;gap:.5rem}
  .nudges li::before{content:"·";color:var(--ink-3);font-weight:700}
  .foot{display:flex;align-items:center;gap:.75rem}
  .foot .note{font-size:.78rem;color:var(--ink-3)}

  /* ── step 2 · method ───────────────────────────────────────────────────────── */
  #method{overflow:auto;display:grid;align-content:start;justify-items:center;padding:3.2rem 1.5rem 2rem}
  .read{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;font-size:.78rem;color:var(--ink-3);
    font-family:var(--mono)}
  .read b{color:var(--ink-2);font-weight:700}
  .picks{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
  @media (max-width:800px){ .picks{grid-template-columns:1fr} }
  .pick{position:relative;text-align:left;display:grid;gap:.5rem;align-content:start;
    padding:1rem 1.05rem;border-radius:var(--radius);border:1px solid var(--line-2);
    background:var(--surface);box-shadow:var(--shadow)}
  .pick:hover{border-color:var(--ink-3)}
  .pick.on{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 14%,transparent)}
  .pick .tag{position:absolute;top:-9px;left:1rem;font-family:var(--mono);font-size:.58rem;
    letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:#fff;background:var(--brand);
    border-radius:20px;padding:.12rem .5rem;display:none}
  .pick.rec .tag{display:block}
  .pick h2{margin:0;font-size:.95rem;font-weight:700}
  .pick .what{margin:0;font-size:.8rem;color:var(--ink-2)}
  .pick .why{margin:0;font-size:.8rem;color:var(--ink);border-left:2px solid var(--brand);
    padding-left:.6rem;background:color-mix(in srgb,var(--brand) 5%,transparent);border-radius:0 4px 4px 0;
    padding:.35rem .6rem}
  .pick.alt .why{border-left-color:var(--line-2);background:var(--surface-2);color:var(--ink-2)}
  .pick .mini{display:flex;gap:3px;align-items:flex-end;height:34px}
  .pick .mini i{border-radius:2px;background:var(--c);opacity:.85}
  .pick .keeps{font-size:.72rem;color:var(--ink-3);font-family:var(--mono)}

  /* ── step 3 · the workspace ────────────────────────────────────────────────── */
  #work{display:grid;grid-template-columns:340px minmax(0,1fr);min-height:0}
  @media (max-width:1000px){ #work{grid-template-columns:minmax(0,1fr)} #lang{display:none} }

  /* left column is the language: raw prose on top, the agreed terms below it.
     Right column is the behaviour. That split is the whole layout argument. */
  #lang{display:grid;grid-template-rows:auto minmax(0,1fr) auto minmax(0,300px);
    border-right:1px solid var(--line);background:var(--surface);min-height:0}
  #lang.folded{grid-template-rows:auto 0 auto minmax(0,1fr)}
  .ph{display:flex;align-items:center;gap:.5rem;padding:.55rem .85rem;border-bottom:1px solid var(--line);
    flex:none}
  .ph b{font-size:.82rem;font-weight:700}
  .ph .c{font-size:.7rem;color:var(--ink-3);margin-left:auto;font-family:var(--mono)}
  .ph button.mini{width:22px;height:22px;border:1px solid var(--line-2);border-radius:5px;color:var(--ink-3);
    display:grid;place-items:center;font-size:.7rem;flex:none}
  .ph button.mini:hover{border-color:var(--brand);color:var(--brand)}
  #lang.folded #prose{overflow:hidden}
  #lang.folded .fold{transform:rotate(-90deg)}

  #prose{overflow:auto;padding:.5rem 0 1rem}
  .para{display:grid;grid-template-columns:34px minmax(0,1fr);align-items:start;gap:.35rem;
    padding:.3rem .85rem .3rem .5rem;border-left:2px solid transparent}
  .para:hover{background:var(--surface-2)}
  .para.lit{background:color-mix(in srgb,var(--brand) 7%,var(--surface));border-left-color:var(--brand)}
  .para .n{font-family:var(--mono);font-size:.62rem;font-weight:700;color:var(--ink-3);
    background:var(--surface-2);border:1px solid var(--line);border-radius:20px;
    padding:.08rem 0;text-align:center;margin-top:.22rem;cursor:pointer;user-select:none}
  .para.bare .n{color:var(--brand);border-color:color-mix(in srgb,var(--brand) 45%,var(--line));
    border-style:dashed;background:none}
  .para .t{font-size:.85rem;line-height:1.6;outline:0;color:var(--ink-2);cursor:text;white-space:pre-wrap}
  .para.lit .t{color:var(--ink)}

  /* ── the Ubiquitous Language panel ─────────────────────────────────────────── */
  #terms{overflow:auto;padding:.35rem 0 1.5rem}
  .term{position:relative;padding:.4rem .85rem .45rem;border-left:2px solid transparent;display:grid;gap:.1rem}
  .term:hover{background:var(--surface-2)}
  .term.lit{background:color-mix(in srgb,var(--brand) 7%,var(--surface));border-left-color:var(--brand)}
  .term .row{display:flex;align-items:baseline;gap:.4rem}
  .term .w{font-size:.82rem;font-weight:700;outline:0;cursor:text}
  .term .u{font-family:var(--mono);font-size:.6rem;color:var(--ink-3);margin-left:auto;flex:none}
  .term .u.zero{color:var(--brand)}
  .term .d{font-size:.76rem;color:var(--ink-2);outline:0;cursor:text;line-height:1.45}
  .term .d:empty::before{content:"what does it mean?";color:var(--brand);opacity:.75;font-style:italic}
  .term .aka{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.1rem}
  .term .aka span{font-size:.62rem;font-family:var(--mono);color:var(--ink-3);text-decoration:line-through;
    background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:0 .34rem}
  .term.prop{border-left-color:var(--line-2);border-left-style:dashed}
  .term.prop .w{color:var(--ink-2);border-bottom:1px dashed var(--line-2)}
  .term .rail{position:absolute;top:.3rem;right:.5rem;display:none;gap:3px}
  .term:hover .rail{display:flex}
  .term .rail button{width:19px;height:19px;border-radius:5px;border:1px solid var(--line-2);
    background:var(--surface);color:var(--ink-3);font-size:.62rem;display:grid;place-items:center}
  .term .rail button:hover{border-color:var(--brand);color:var(--brand)}
  .term .rail button.del:hover{background:var(--brand);border-color:var(--brand);color:#fff}
  .term .rail button.ok{border-color:var(--vw);color:var(--vw)}
  .term .rail button.ok:hover{background:var(--vw);border-color:var(--vw);color:#fff}
  .term .merge{display:flex;align-items:center;gap:.35rem;margin-top:.25rem;font-size:.72rem;color:var(--ink-3)}
  .term .merge select{font:inherit;font-size:.72rem;padding:.1rem .2rem;border:1px solid var(--line-2);
    border-radius:5px;background:var(--surface);color:var(--ink)}
  .addterm{margin:.4rem .85rem 0;border:1px dashed var(--line-2);border-radius:7px;color:var(--ink-3);
    font-size:.72rem;font-weight:600;padding:.28rem;width:calc(100% - 1.7rem)}
  .addterm:hover{border-color:var(--brand);color:var(--brand)}

  /* ── right: the canvas ─────────────────────────────────────────────────────── */
  #right{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0}
  #bar{display:flex;align-items:center;gap:.75rem;padding:.42rem .9rem;background:var(--surface);
    border-bottom:1px solid var(--line);flex-wrap:wrap;font-size:.73rem;color:var(--ink-3)}
  #bar .sw{display:inline-flex;align-items:center;gap:.3rem;color:var(--ink-2);font-weight:600}
  #bar .sw i{width:9px;height:9px;border-radius:2px;background:var(--c);flex:none}
  #bar .hint{margin-left:auto;color:var(--ink-3);font-weight:400}

  #scroll{overflow:auto;background:var(--surface-2);position:relative}
  svg.links{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:1}
  svg.links path{fill:none}
  svg.links path.pol{stroke:var(--pol);stroke-width:1.5;stroke-dasharray:5 4;marker-end:url(#ap)}
  svg.links path.vw{stroke:var(--vw);stroke-width:1.5;marker-end:url(#av)}
  svg.links path.vwd{stroke:var(--vw);stroke-width:1.5;stroke-dasharray:2 3;marker-end:url(#av)}
  svg.links path.tree{stroke:var(--c);stroke-width:1.6}
  svg.links path.rel{stroke:var(--ink-3);stroke-width:1.2;stroke-dasharray:4 3;marker-end:url(#ar)}
  svg.links text{font-family:var(--mono);font-size:8.5px;fill:var(--ink-3);paint-order:stroke;
    stroke:var(--surface-2);stroke-width:3px}

  /* — storm — time axis: guides only. A storm has no step numbers; order is the meaning. */
  #grid{position:relative;display:grid;align-items:start;
    grid-template-columns:var(--lanew) repeat(var(--cols),var(--colw));width:max-content;min-width:100%;
    --lanew:124px; --colw:246px}
  .axis{grid-row:1;height:26px;border-bottom:1px solid var(--line);background:var(--surface);
    position:sticky;top:0;z-index:4;display:flex;align-items:center}
  .axis.lbl{position:sticky;left:0;z-index:6;padding-left:.85rem;font-family:var(--mono);
    font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
  .axis.col{border-left:1px dashed var(--line-2);justify-content:center}
  .axis.col .arrow{width:100%;height:1px;background:linear-gradient(90deg,transparent,var(--line-2))}

  .lane{position:sticky;left:0;z-index:3;background:var(--surface);border-right:1px solid var(--line);
    border-top:1px solid var(--line);padding:.7rem .6rem .7rem .85rem;min-height:76px;
    display:grid;align-content:start;gap:.2rem}
  .lane b{font-size:.8rem;font-weight:700;outline:0;cursor:text;line-height:1.3}
  .cell{border-top:1px solid var(--line);border-left:1px dashed var(--line-2);
    padding:.55rem .45rem;display:grid;gap:.4rem;align-content:start;min-height:76px;z-index:2}
  .cell.drop{background:color-mix(in srgb,var(--brand) 8%,transparent);
    box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--brand) 40%,transparent)}
  .unit{display:flex;align-items:stretch;gap:.28rem}
  .unit .to{align-self:center;color:var(--ink-3);font-size:.7rem;flex:none}

  .card{position:relative;background:var(--surface);border:1px solid var(--line-2);
    border-left:3px solid var(--c);border-radius:7px;box-shadow:var(--shadow);
    padding:.3rem .42rem;min-width:0;flex:1;display:grid;gap:.1rem;cursor:grab;user-select:none}
  .card:hover{box-shadow:0 3px 12px rgba(0,0,0,.10);z-index:8}
  .card.sel{border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 38%,transparent);z-index:8}
  .card.dim{opacity:.34}
  .card.moving{opacity:.5;cursor:grabbing}
  .card .k{font-family:var(--mono);font-size:.53rem;letter-spacing:.1em;text-transform:uppercase;
    font-weight:700;color:var(--c)}
  .card .t{font-size:.78rem;font-weight:600;line-height:1.32;outline:0;cursor:text;
    white-space:pre-wrap;overflow-wrap:anywhere}
  .card.cmd{--c:var(--cmd)} .card.evt{--c:var(--evt)} .card.pol{--c:var(--pol)}
  .card.vw{--c:var(--vw)}   .card.hot{--c:var(--hot)}
  .card.pol .t,.card.hot .t{font-weight:500}
  .card.hot{background:color-mix(in srgb,var(--hot) 7%,var(--surface))}

  /* the actor rides on the command, exactly where Vernon puts the small yellow
     sticky — which makes "no actor" a visible empty slot, not a missing card */
  .who{display:inline-flex;align-items:center;gap:.22rem;font-size:.63rem;font-weight:700;
    color:var(--act);width:max-content;max-width:100%;outline:0;cursor:text}
  .who::before{content:"◍";font-size:.6rem}
  .who.none{color:var(--brand);opacity:.8;font-weight:600;font-style:italic}
  .who.none::before{content:"◌"}

  /* a finding is a dot on the card — the canvas is our own surface, so the mark
     belongs on it rather than in a panel down the side */
  .card .flag,.node .flag{position:absolute;top:-4px;right:-4px;width:11px;height:11px;border-radius:50%;
    background:var(--brand);box-shadow:0 0 0 2px var(--surface);display:none}
  .card.flagged .flag,.node.flagged .flag{display:block}
  .card.cue,.node.cue{box-shadow:0 0 0 2px var(--brand),0 6px 18px rgba(0,0,0,.16)}
  .card.hit,.node.hit{box-shadow:0 0 0 2px var(--vw),0 6px 18px rgba(0,0,0,.12)}
  .asks{display:inline-flex;align-items:center;gap:.2rem;font-family:var(--mono);font-size:.56rem;
    font-weight:700;color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,transparent);
    border-radius:20px;padding:0 .3rem;width:max-content}

  /* the rail floats above the card, not beside it — beside it would sit on top
     of the paired event card and the arrow between them */
  .rail{position:absolute;bottom:100%;right:0;padding-bottom:4px;display:none;
    align-items:center;gap:3px;z-index:9}
  .card:hover .rail,.card.sel .rail,.node:hover .rail,.node.sel .rail{display:flex}
  .rail button{width:18px;height:18px;border-radius:50%;border:1px solid var(--line-2);
    background:var(--surface);color:var(--ink-3);font-size:.62rem;line-height:1;
    display:grid;place-items:center;box-shadow:var(--shadow);flex:none}
  .rail button:hover{border-color:var(--brand);color:var(--brand)}
  .rail button.del:hover{background:var(--brand);border-color:var(--brand);color:#fff}
  .add{border:1px dashed var(--line-2);border-radius:7px;color:var(--ink-3);font-size:.7rem;
    font-weight:600;padding:.24rem;opacity:0;transition:opacity .1s}
  .cell:hover .add{opacity:1}
  .add:hover{border-color:var(--brand);color:var(--brand)}

  /* — map — */
  #canvas{position:relative;width:max-content;min-width:100%;min-height:100%}
  .node{position:absolute;width:186px;background:var(--surface);border:1px solid var(--line-2);
    border-left:3px solid var(--c);border-radius:7px;box-shadow:var(--shadow);padding:.32rem .45rem;
    display:grid;gap:.1rem;cursor:grab;user-select:none;z-index:2}
  .node:hover{box-shadow:0 3px 12px rgba(0,0,0,.10);z-index:8}
  .node.sel{border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 38%,transparent);z-index:8}
  .node.dim{opacity:.34}

<script>
/* ─────────────────────────────────────────────────────────────────────────────
   Stage 1, as one page in three states: describe → method → brainstorm.

   The two wizard steps don't vanish when the canvas arrives — the prose you
   typed becomes the left pane, so nothing is consumed and thrown away. The
   left column is the *language* (raw prose above, agreed terms below); the
   right column is the *behaviour*. Only that right column belongs to the
   method, which is what makes a third method cheap to add: prose, terms,
   findings, editing and the bridge loop are all shared.

   Horizontal is time on the storm, and vertical is the thing it's about — so
   the layout is a grid and no graph-layout engine is needed.
   ───────────────────────────────────────────────────────────────────────────── */

const RAW =
`Hiring managers open a role and see everyone who applied, newest first.
They can search by name and filter by stage, then move a candidate forward or reject them with a reason.
Recruiters need to bulk-move candidates after a screening day — a dozen at a time, not one by one.
Interviewers get a link to a candidate and leave a scorecard without seeing anyone else's until they've submitted theirs.
Everything a candidate did should be visible on one timeline: applied, screened, interviewed, offered.`;

const DOC = {
  feature: 'hiring',
  step: 'describe',           /* describe | method | work */
  method: 'storm',            /* storm | map — the discriminator a new method extends */
  raw: RAW,
  prose: RAW.split('\n').filter(s => s.trim()),

  /* what Claude read out of the prose — the basis of the recommendation, shown
     rather than asserted, so an obviously wrong read is arguable */
  read: { paras: 5, actors: 4, ordered: 9, rules: 3, nouns: 6 },
  recommend: 'storm',

  /* the Ubiquitous Language — top-level, not under a method, so it survives a
     method switch and so every later stage can read it from one place */
  language: [
    { id:'t1', term:'Role',       def:'A position being hired for. Owns one pipeline.', aka:[] },
    { id:'t2', term:'Candidate',  def:'A person who applied. One person, across every role they applied to.', aka:['Applicant'] },
    { id:'t3', term:'Application',def:'One Candidate against one Role. The thing that moves through stages — not the Candidate.', aka:[] },
    { id:'t4', term:'Stage',      def:'Where an Application sits: applied, screened, interviewed, offered.', aka:[] },
    { id:'t5', term:'Scorecard',  def:'One Interviewer’s written assessment of one Candidate.', aka:[] },
    { id:'t6', term:'Panel',      def:'The group of Interviewers assigned to a Candidate.', aka:[] },
    { id:'t7', term:'Screening day', def:'', aka:[], proposed:true },
  ],
  retired: [],                 /* terms removed while cards still used the word */

  storm: {
    cols: 6,
    lanes: [
      { id:'role', name:'Role' },
      { id:'appl', name:'Application' },
      { id:'intv', name:'Interview' },
      { id:'card', name:'Scorecard' },
    ],
    /* type: cmd | evt | pol | vw | hot · lane + t place it · src is the paragraph */
    cards: [
      { id:'c1', type:'cmd', text:'Publish role',           lane:'role', t:0, who:'Hiring manager', src:0 },
      { id:'e1', type:'evt', text:'Role published',         lane:'role', t:0, src:0 },
      { id:'v1', type:'vw',  text:'Role pipeline — every application, newest first', lane:'role', t:1, src:0 },
      { id:'e2', type:'evt', text:'Candidate applied',      lane:'appl', t:1, src:0 },
      { id:'h1', type:'hot', text:'Can a rejected candidate re-apply to the same role?', lane:'appl', t:1, src:1 },
      { id:'c2', type:'cmd', text:'Move candidate forward', lane:'appl', t:2, who:'Hiring manager', src:1 },
      { id:'e3', type:'evt', text:'Candidate advanced',     lane:'appl', t:2, src:1 },
      { id:'c3', type:'cmd', text:'Reject candidate',       lane:'appl', t:2, who:'Hiring manager', src:1 },
      { id:'e4', type:'evt', text:'Candidate rejected',     lane:'appl', t:2, src:1 },
      { id:'c4', type:'cmd', text:'Bulk-move candidates',   lane:'appl', t:3, who:'', src:2 },
      { id:'e5', type:'evt', text:'Candidates advanced in bulk', lane:'appl', t:3, src:2 },
      { id:'p1', type:'pol', text:'whenever a candidate reaches Interview, then schedule the interviews', lane:'intv', t:3, src:1 },
      { id:'c5', type:'cmd', text:'Schedule interview',     lane:'intv', t:4, who:'Recruiter', src:3 },
      { id:'e6', type:'evt', text:'Interview scheduled',    lane:'intv', t:4, src:3 },
      { id:'v2', type:'vw',  text:'Candidate link — one candidate, no one else', lane:'intv', t:5, src:3 },
      { id:'c6', type:'cmd', text:'Submit scorecard',       lane:'card', t:5, who:'Interviewer', src:3 },
      { id:'e7', type:'evt', text:'Scorecard submitted',    lane:'card', t:5, src:3 },
      { id:'p2', type:'pol', text:'whenever every scorecard is in, then reveal them all', lane:'card', t:5, src:3 },
    ],
    /* causes cmd→evt · reacts evt→pol · triggers pol→cmd · shows evt→vw · informs vw→cmd */
    links: [
      { from:'c1', to:'e1', kind:'causes' },   { from:'c2', to:'e3', kind:'causes' },
      { from:'c3', to:'e4', kind:'causes' },   { from:'c4', to:'e5', kind:'causes' },
      { from:'c5', to:'e6', kind:'causes' },   { from:'c6', to:'e7', kind:'causes' },
      { from:'e1', to:'v1', kind:'shows'  },   { from:'e2', to:'v1', kind:'shows'  },
      { from:'v1', to:'c2', kind:'informs'},   { from:'v1', to:'c3', kind:'informs'},
      { from:'e3', to:'p1', kind:'reacts' },   { from:'e5', to:'p1', kind:'reacts' },
      { from:'p1', to:'c5', kind:'triggers'},  { from:'e6', to:'v2', kind:'shows'  },
      { from:'v2', to:'c6', kind:'informs'},   { from:'e7', to:'p2', kind:'reacts' },
    ],
  },

  /* the parked v6 concept map, carried over as the second method — hierarchy is
     the tree, and relationships are separate labelled links on top of it */
  map: {
    nodes: [
      { id:'n0', text:'Hiring',      parent:null, src:0 },
      { id:'n1', text:'Roles',       parent:'n0', src:0 },
      { id:'n11',text:'Publishing',  parent:'n1', src:0 },
      { id:'n12',text:'Pipeline view',parent:'n1', src:0 },
      { id:'n2', text:'Candidates',  parent:'n0', src:0 },
      { id:'n21',text:'Applying',    parent:'n2', src:0 },
      { id:'n22',text:'Search & filter', parent:'n2', src:1 },
      { id:'n23',text:'Bulk actions',parent:'n2', src:2 },
      { id:'n3', text:'Interviews',  parent:'n0', src:3 },
      { id:'n31',text:'Scheduling',  parent:'n3', src:3 },
      { id:'n32',text:'Scorecards',  parent:'n3', src:3 },
      { id:'n33',text:'Blind until submitted', parent:'n32', src:3 },
      { id:'n4', text:'Decisions',   parent:'n0', src:1 },
      { id:'n41',text:'Advance or reject', parent:'n4', src:1 },
      { id:'n42',text:'Reason required', parent:'n41', src:1 },
      { id:'n5', text:'Reporting',   parent:'n0', src:4 },
    ],
    links: [
      { from:'n2', to:'n3', label:'assessed by' },
      { from:'n3', to:'n4', label:'feeds' },
      { from:'n1', to:'n2', label:'attracts' },
    ],
  },
};

const KIND = { cmd:'Command', evt:'Event', pol:'Policy', vw:'View', hot:'Hotspot' };
const CYCLE = ['cmd','evt','pol','vw','hot'];

/* The method registry. A method owns the canvas and its own checks — nothing
   else. Adding a third means adding an entry here, not touching the workspace. */
const METHODS = {
  storm: {
    name: 'Event Storming',
    kicker: 'DDD',
    what: 'Business processes and workflows. What happens, in the order it happens, with the commands that cause it and the rules that react.',
    why:  'Your description is a process — four actors, nine steps in a clear order, three rules that fire on a change. A storm keeps that order, and its events become the acceptance criteria downstream.',
    alt:  'Pick this if you would rather map the shape of the product than its flow.',
    mini: [[6,'var(--cmd)'],[14,'var(--evt)'],[9,'var(--cmd)'],[20,'var(--evt)'],[12,'var(--pol)'],[26,'var(--evt)'],[16,'var(--vw)']],
    render: renderStorm, checks: stormChecks, texts: stormTexts,
  },
  map: {
    name: 'Mind Map',
    kicker: 'concepts',
    what: 'Broad ideas and early concepts. Branches for the areas the product has, with labelled links where they relate.',
    why:  'Your description is exploratory — areas and ideas rather than an ordered flow. A map gets the shape out before the sequence matters.',
    alt:  'Pick this if the order of things is not settled yet, or you are still arguing scope.',
    mini: [[26,'var(--brand)'],[16,'var(--b0)'],[16,'var(--b1)'],[16,'var(--b2)'],[10,'var(--b3)']],
    render: renderMap, checks: mapChecks, texts: mapTexts,
  },
};

const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rxe = s => String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
let uid = 0;
const nid = p => p + (++uid) + Date.now().toString(36);

let sel = null, cue = null, litTerm = null, litPara = null, showWho = true, dirty = false, say = null;
/* a card is dimmed when you are reading one paragraph — the pairing goes both
   ways, so an unmined paragraph and an unsourced card are both visible */
const dimmed = c => litPara != null && c.src !== litPara;
const S = () => DOC.storm, M = () => DOC.map;
const byId  = id => S().cards.find(c => c.id === id);
const out   = (id, k) => S().links.filter(l => l.from === id && l.kind === k);
const into  = (id, k) => S().links.filter(l => l.to   === id && l.kind === k);
const kids  = id => M().nodes.filter(n => n.parent === id);
const nById = id => M().nodes.find(n => n.id === id);
const touched = () => { dirty = true; $('#send').disabled = false; };

/* ── the language, and how a change to it moves through the artifact ────────── */

/* Every text the terms apply to, as accessors — so rename works the same on
   both canvases and on the prose, and a new method only adds one function. */
function stormTexts(){
  const t = [];
  for (const c of S().cards) {
    t.push({ get:()=>c.text, set:v=>c.text=v, id:c.id });
    if (c.type === 'cmd') t.push({ get:()=>c.who||'', set:v=>c.who=v, id:c.id });
  }
  for (const l of S().lanes) t.push({ get:()=>l.name, set:v=>l.name=v, id:null });
  return t;
}
function mapTexts(){
  return M().nodes.map(n => ({ get:()=>n.text, set:v=>n.text=v, id:n.id }));
}
function allTexts(){
  const t = DOC.prose.map((_, i) => ({ get:()=>DOC.prose[i], set:v=>DOC.prose[i]=v, id:null, para:i }));
  return t.concat(METHODS[DOC.method].texts());
}

/* Word-boundary, plural-tolerant, keeps the original capitalisation, and fixes
   the article in front of what it replaced — "a candidate" → "an applicant".
   Only the adjacent article, never the rest of the sentence, so "a unique role"
   is left alone. Deliberately naive past that: the round trip has Claude in it,
   so the page does the mechanical 90% and says how much it changed. */
const wordRe = w => new RegExp('\\b' + rxe(w) + '(s|es)?\\b', 'gi');
const swapRe = w => new RegExp('(\\b[Aa]n?\\s+)?\\b' + rxe(w) + '(s|es)?\\b', 'g' + 'i');
function swap(s, from, to){
  return s.replace(swapRe(from), (m, art, tail) => {
    const cap = m.replace(/^\s*[Aa]n?\s+/, '')[0];
    const up = cap === cap.toUpperCase() && cap !== cap.toLowerCase();
    const w = up ? to[0].toUpperCase() + to.slice(1) : to[0].toLowerCase() + to.slice(1);
    let a = '';
    if (art) {
      const A = /^[Aa]/.test(art.trim()) && art.trim()[0] === 'A' ? 'A' : 'a';
      a = A + (/^[aeiou]/i.test(w) ? 'n' : '') + art.match(/\s+$/)[0];
    }
    return a + w + (tail || '');
  });
}
function usesOf(t){
  const words = [t.term].concat(t.aka || []).filter(Boolean);
  let n = 0, ids = new Set();
  for (const x of allTexts()) {
    const s = x.get() || '';
    for (const w of words) {
      const m = s.match(wordRe(w));
      if (m) { n += m.length; if (x.id) ids.add(x.id); }
    }
  }
  return { n, ids };
}
function rename(t, to){
  const from = t.term;
  if (!to.trim() || to === from) { render(); return; }
  let n = 0, hit = new Set();
  for (const x of allTexts()) {
    const s = x.get() || '';
    const m = s.match(wordRe(from));
    if (!m) continue;
    n += m.length; if (x.id) hit.add(x.id);
    x.set(swap(s, from, to));
  }
  t.term = to.trim();
  flash(hit);
  announce(n ? `${from} → ${t.term} · rewritten in ${n} place${n===1?'':'s'}`
             : `${from} → ${t.term} · nothing else said it`);
  touched();
}
function merge(t, intoId){
  const tgt = DOC.language.find(x => x.id === intoId);
  if (!tgt || tgt === t) { render(); return; }
  let n = 0, hit = new Set();
  for (const x of allTexts()) {
    const s = x.get() || '';
    const m = s.match(wordRe(t.term));
    if (!m) continue;
    n += m.length; if (x.id) hit.add(x.id);
    x.set(swap(s, t.term, tgt.term));
  }
  tgt.aka = Array.from(new Set((tgt.aka || []).concat(t.term, t.aka || [])));
  if (!tgt.def && t.def) tgt.def = t.def;
  DOC.language = DOC.language.filter(x => x !== t);
  flash(hit);
  announce(`${t.term} merged into ${tgt.term} · ${n} place${n===1?'':'s'} rewritten, kept as also-known-as`);
  touched();
}
function drop(t){
  const u = usesOf(t);
  DOC.language = DOC.language.filter(x => x !== t);
  /* Removing a term does not rewrite the canvas — "not a domain term" is not
     the same as "wrong word". The lingering use becomes a finding instead. */
  if (u.n && !t.proposed) DOC.retired.push({ term:t.term });
  announce(u.n && !t.proposed
    ? `${t.term} removed · ${u.n} place${u.n===1?'':'s'} still say it`
    : `${t.term} removed`);
  touched();
}
function announce(m){ say = m; render(); setTimeout(() => { if (say === m) { say = null; render(); } }, 4200); }
function flash(ids){
  setTimeout(() => {
    ids.forEach(id => { const el = document.querySelector(`[data-id="${id}"]`); if (el) el.classList.add('cue'); });
    setTimeout(() => $$('.cue').forEach(e => e.classList.remove('cue')), 900);
  }, 30);
}

/* ── the checks ─────────────────────────────────────────────────────────────── */
function langChecks(add){
  for (const t of DOC.language) {
    if (t.proposed) {
      add('proposed', `<em>${esc(t.term)}</em> — pulled out of what you wrote. A term, or just a word?`, null, null, t.id);
      continue;
    }
    if (!usesOf(t).n)
      add('unused term', `<em>${esc(t.term)}</em> — defined, then never used. Real, or left over?`, null, null, t.id);
    if (!String(t.def || '').trim())
      add('no definition', `<em>${esc(t.term)}</em> — no definition, so nobody can disagree with it.`, null, null, t.id);
  }
  for (const r of DOC.retired) {
    const n = allTexts().reduce((a, x) => a + ((x.get() || '').match(wordRe(r.term)) || []).length, 0);
    if (n) add('dropped word', `<em>${esc(r.term)}</em> — not a term any more, but ${n} place${n===1?'':'s'} still say it.`);
  }
}
function stormChecks(add){
  for (const c of S().cards.filter(c => c.type === 'cmd')) {
    if (!out(c.id, 'causes').length)
      add('no outcome', `<em>${esc(c.text)}</em> — the command runs and nothing changes. Missing event, or it's really a query.`, c.id);
    if (!c.who && !into(c.id, 'triggers').length)
      add('no actor', `<em>${esc(c.text)}</em> — nobody is named. Who does this, or what schedule fires it?`, c.id);
    /* A command only needs something on screen when it acts on what already
       exists — creating the first of a thing needs no view, and a command a
       policy fires needs no human looking at anything. */
    const actsOnExisting = S().cards.some(x => x.type === 'evt' && x.lane === c.lane && x.t < c.t);
    if (actsOnExisting && !into(c.id, 'triggers').length && !into(c.id, 'informs').length)
      add('no view', `<em>${esc(c.text)}</em> — nothing on screen to pick from. A screen is missing.`, c.id);
  }
  for (const e of S().cards.filter(c => c.type === 'evt')) {
    if (!into(e.id, 'causes').length)
      add('no cause', `<em>${esc(e.text)}</em> — nothing causes it. Either it arrives from outside, or the flow has a hole.`, e.id);
    if (!out(e.id, 'reacts').length && !out(e.id, 'shows').length)
      add('dead end', `<em>${esc(e.text)}</em> — nothing reacts to it and no view shows it. Why does it happen?`, e.id);
  }
  for (const l of S().lanes) {
    if (!S().cards.some(c => c.lane === l.id && c.type === 'evt'))
      add('thin row', `<em>${esc(l.name)}</em> — nothing ever happens to it. Not its own thing.`,
        S().cards.find(c => c.lane === l.id)?.id);
  }
  for (const h of S().cards.filter(c => c.type === 'hot')) add('open question', `<em>${esc(h.text)}</em>`, h.id);
}
function mapChecks(add){
  for (const n of kids(M().nodes.find(x => !x.parent)?.id)) {
    if (!kids(n.id).length)
      add('thin branch', `<em>${esc(n.text)}</em> — a heading with nothing under it. Not an area yet.`, n.id);
  }
  /* a chain of only-children is a list someone indented, not a hierarchy */
  for (const n of M().nodes) {
    let d = 0, cur = n;
    while (kids(cur.id).length === 1) { cur = kids(cur.id)[0]; d++; }
    if (d >= 3) add('a list, not a branch', `<em>${esc(n.text)}</em> — three levels, one child each. Flatten it.`, n.id);
  }
  if (!M().links.length)
    add('no relationships', 'Nothing relates to anything — a map with only hierarchy is an outline.');
}
function findings(){
  const f = [];
  const add = (why, msg, card, para, term) => f.push({ why, msg, card, para, term });
  METHODS[DOC.method].checks(add);
  /* asks are the user talking to Claude — same strip, so nothing is buried */
  for (const c of (DOC.method === 'storm' ? S().cards : M().nodes))
    for (const a of (c.asks || []))
      add('asked', `<em>${esc(c.text)}</em> — ${esc(a)}`, c.id);
  const items = DOC.method === 'storm' ? S().cards : M().nodes;
  DOC.prose.forEach((p, i) => {
    if (p.trim() && !items.some(c => c.src === i))
      add('not modelled', `Paragraph ${i + 1} produced nothing — <em>${esc(p.slice(0, 54))}…</em>`, null, i);
  });
  langChecks(add);
  return f;
}

/* ── chrome ─────────────────────────────────────────────────────────────────── */
const STEPS = [['describe','Describe'],['method','Method'],['work','Brainstorm']];
function renderSteps(){
  const at = STEPS.findIndex(s => s[0] === DOC.step);
  $('#steps').innerHTML = STEPS.map(([k, label], i) =>
    `${i ? '<span class="sep">›</span>' : ''}<button data-step="${k}"
       class="${k === DOC.step ? 'on' : ''} ${i < at ? 'done' : ''}"><i>${i < at ? '✓' : i + 1}</i>${label}</button>`
  ).join('');
  const P = { describe:'Read this', method:'Start brainstorming', work:'Send to Claude' }[DOC.step];
  $('#send').textContent = DOC.step === 'work' ? P : P + ' →';
  $('#send').disabled = DOC.step === 'work' && !dirty;
  $('#tools').innerHTML = DOC.step !== 'work' ? '' :
    `<button class="btn" id="switch" title="Prose and language carry over">Switch method</button>
     <button class="btn" id="fold2">${showWho ? 'Collapse actors' : 'Show actors'}</button>
     <button class="btn" id="handoff">Hand off</button>`;
}

/* ── step 1 · describe ──────────────────────────────────────────────────────── */
function renderDescribe(){
  $('#stage').id = 'stage';
  $('#stage').innerHTML = `<div id="describe"><div class="sheet">
    <h1>What do you need built?</h1>
    <p class="lede">However it comes out. Half-formed, out of order, contradicting
      itself — that is what the next two steps are for.</p>
    <textarea id="raw" spellcheck="false" placeholder="Start anywhere…">${esc(DOC.raw)}</textarea>
    <ul class="nudges">
      <li>Who uses it, and what do they do?</li>
      <li>What has to happen, and in what order?</li>
      <li>What rules, limits or approvals matter?</li>
      <li>Paste notes, a thread, a transcript — unstructured is fine.</li>
    </ul>
    <div class="foot"><span class="note">Nothing is thrown away — what you write here
      stays beside the canvas, and every card traces back to the line that produced it.</span></div>
  </div></div>`;
  $('#raw').addEventListener('input', e => {
    DOC.raw = e.target.value;
    DOC.prose = DOC.raw.split('\n').filter(s => s.trim());
  });
}

/* ── step 2 · method ────────────────────────────────────────────────────────── */

function hl(s){
  if (!litTerm) return esc(s);
  const t = DOC.language.find(x => x.id === litTerm);
  if (!t) return esc(s);
  let o = esc(s);
  for (const w of [t.term].concat(t.aka || []).filter(Boolean))
    o = o.replace(wordRe(w), m => `<mark>${m}</mark>`);
  return o;
}

function renderProse(){
  const items = DOC.method === 'storm' ? S().cards : M().nodes;
  const lit = sel ? items.find(c => c.id === sel)?.src : null;
  $('#prose').innerHTML = DOC.prose.map((p, i) => {
    const n = items.filter(c => c.src === i).length;
    return `<div class="para ${n ? '' : 'bare'} ${lit === i || litPara === i ? 'lit' : ''}" data-p="${i}">
      <div class="n" title="${n ? n + (n === 1 ? ' card' : ' cards') : 'nothing modelled from this yet'}">${n || '—'}</div>
      <div class="t" contenteditable="plaintext-only" spellcheck="false">${hl(p)}</div>
    </div>`;
  }).join('');
  const bare = DOC.prose.filter((p, i) => p.trim() && !items.some(c => c.src === i)).length;
  $('#cov').textContent = bare ? `${bare} not modelled` : 'all modelled';
  $$('#prose .para').forEach(el => {
    const i = +el.dataset.p;
    el.querySelector('.n').onclick = () => { litPara = litPara === i ? null : i; sel = null; render(); };
    el.querySelector('.t').onblur = e => {
      const v = e.target.textContent.trim();
      if (v !== DOC.prose[i]) { DOC.prose[i] = v; DOC.raw = DOC.prose.join('\n'); touched(); render(); }
    };
  });
}

function renderTerms(){
  const merging = renderTerms.merging;
  $('#terms').innerHTML = DOC.language.map(t => {
    const u = usesOf(t);
    return `<div class="term ${t.proposed ? 'prop' : ''} ${litTerm === t.id ? 'lit' : ''}" data-t="${t.id}">
      <div class="rail">
        ${t.proposed ? '<button class="ok" data-a="keep" title="It is a term">✓</button>' :
                       '<button data-a="merge" title="Merge into another term">⊕</button>'}
        <button class="del" data-a="del" title="${t.proposed ? 'Not a term' : 'Remove'}">×</button>
      </div>
      <div class="row">
        <span class="w" contenteditable="plaintext-only" spellcheck="false">${esc(t.term)}</span>
        <span class="u ${u.n ? '' : 'zero'}">${u.n ? u.n + '×' : 'unused'}</span>
      </div>
      <div class="d" contenteditable="plaintext-only" spellcheck="false">${esc(t.def || '')}</div>
      ${(t.aka || []).length ? `<div class="aka">${t.aka.map(a => `<span>${esc(a)}</span>`).join('')}</div>` : ''}
      ${merging === t.id ? `<div class="merge">into<select>
        <option value=""></option>
        ${DOC.language.filter(x => x !== t).map(x => `<option value="${x.id}">${esc(x.term)}</option>`).join('')}
      </select></div>` : ''}
    </div>`;
  }).join('') + `<button class="addterm" id="addterm">+ term</button>`;

  $('#tc').textContent = `${DOC.language.filter(t => !t.proposed).length} agreed` +
    (DOC.language.some(t => t.proposed) ? ` · ${DOC.language.filter(t => t.proposed).length} proposed` : '');

  $$('#terms .term').forEach(el => {
    const t = DOC.language.find(x => x.id === el.dataset.t);
    el.onmouseenter = () => { if (litTerm !== t.id) { litTerm = t.id; paint(); } };
    el.onmouseleave = () => { if (litTerm === t.id) { litTerm = null; paint(); } };
    el.querySelector('.w').onblur = e => rename(t, e.target.textContent);
    el.querySelector('.w').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } };
    el.querySelector('.d').onblur = e => {
      const v = e.target.textContent.trim();
      if (v !== (t.def || '')) { t.def = v; touched(); render(); }
    };
    el.querySelectorAll('.rail button').forEach(b => b.onclick = ev => {
      ev.stopPropagation();
      const a = b.dataset.a;
      if (a === 'del')   return drop(t), render();
      if (a === 'keep')  { delete t.proposed; touched(); return render(); }
      if (a === 'merge') { renderTerms.merging = renderTerms.merging === t.id ? null : t.id; return render(); }
    });
    const s = el.querySelector('select');
    if (s) { s.onchange = () => { renderTerms.merging = null; merge(t, s.value); render(); }; s.focus(); }
  });
  $('#addterm').onclick = () => {
    DOC.language.push({ id:nid('t'), term:'New term', def:'', aka:[] });
    touched(); render();
    const last = $$('#terms .term .w').pop(); if (last) { last.focus();
      const r = document.createRange(); r.selectNodeContents(last);
      const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }
  };
}

/* light every card a hovered term appears in, without a full re-render */
function paint(){
  const t = DOC.language.find(x => x.id === litTerm);
  const ids = t ? usesOf(t).ids : new Set();
  $$('.card,.node').forEach(el => el.classList.toggle('hit', ids.has(el.dataset.id)));
  $$('#terms .term').forEach(el => el.classList.toggle('lit', el.dataset.t === litTerm));
  renderProse();
  if (DOC.method === 'storm') $$('#grid .card .t').forEach(el => {
    const c = byId(el.closest('.card').dataset.id); if (c) el.innerHTML = hl(c.text);
  });
  else $$('#canvas .node .t').forEach(el => {
    const n = nById(el.closest('.node').dataset.id); if (n) el.innerHTML = hl(n.text);
  });
}

/* ── canvas · storm ─────────────────────────────────────────────────────────── */
function cardHTML(c, flagged){
  const who = c.type !== 'cmd' ? '' :
    showWho ? `<div class="who ${c.who ? '' : 'none'}" contenteditable="plaintext-only"
                    spellcheck="false">${esc(c.who || 'who?')}</div>` : '';
  return `<div class="card ${c.type} ${sel === c.id ? 'sel' : ''} ${cue === c.id ? 'cue' : ''}
       ${flagged ? 'flagged' : ''} ${dimmed(c) ? 'dim' : ''}" data-id="${c.id}" draggable="true">
    <span class="flag"></span>
    <div class="rail">
      <button data-a="expand" title="Ask Claude to expand this">+</button>
      <button data-a="explain" title="Ask Claude to explain this">?</button>
      <button data-a="type" title="Change type">⇄</button>
      <button class="del" data-a="del" title="Delete">×</button>
    </div>
    <div class="k">${KIND[c.type]}</div>
    <div class="t" contenteditable="plaintext-only" spellcheck="false">${hl(c.text)}</div>
    ${who}${(c.asks || []).length ? `<span class="asks">? ${c.asks.length}</span>` : ''}
  </div>`;
}
function renderStorm(){
  const f = findings();
  const flagged = new Set(f.map(x => x.card).filter(Boolean));
  const st = S(), cols = st.cols;
  let h = `<div id="grid" style="--cols:${cols}">
    <div class="axis lbl">time →</div>
    ${Array.from({length:cols}, () => '<div class="axis col"><span class="arrow"></span></div>').join('')}`;
  for (const l of st.lanes) {
    h += `<div class="lane" data-lane="${l.id}"><b contenteditable="plaintext-only"
            spellcheck="false">${esc(l.name)}</b></div>`;
    for (let t = 0; t < cols; t++) {
      const here = st.cards.filter(c => c.lane === l.id && c.t === t);
      const paired = new Set();
      const units = [];
      for (const c of here) {
        if (c.type !== 'cmd') continue;
        const ev = out(c.id, 'causes').map(x => byId(x.to)).find(e => e && e.lane === l.id && e.t === t);
        if (ev) { paired.add(ev.id); units.push([c, ev]); } else units.push([c]);
      }
      for (const c of here) if (c.type !== 'cmd' && !paired.has(c.id)) units.push([c]);
      h += `<div class="cell" data-lane="${l.id}" data-t="${t}">
        ${units.map(u => `<div class="unit">${u.map((c, i) =>
          (i ? '<span class="to">→</span>' : '') + cardHTML(c, flagged.has(c.id))).join('')}</div>`).join('')}
        <button class="add" data-lane="${l.id}" data-t="${t}">+</button></div>`;
    }
  }
  h += `<svg class="links" id="svg"><defs>
      <marker id="ap" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M0 0 L8 4 L0 8 z" fill="var(--pol)"/></marker>
      <marker id="av" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M0 0 L8 4 L0 8 z" fill="var(--vw)"/></marker>
    </defs></svg></div>`;
  $('#scroll').innerHTML = h;
  $('#bar').innerHTML =
    `<span class="sw" style="--c:var(--cmd)"><i></i>Command</span>
     <span class="sw" style="--c:var(--evt)"><i></i>Event</span>
     <span class="sw" style="--c:var(--act)"><i></i>Actor</span>
     <span class="sw" style="--c:var(--pol)"><i></i>Policy</span>
     <span class="sw" style="--c:var(--vw)"><i></i>View</span>
     <span class="sw" style="--c:var(--hot)"><i></i>Hotspot</span>
     <span class="hint">rows are the thing it is about · drag a card to move it in time ·
       <kbd>+</kbd> expand · <kbd>?</kbd> explain · <kbd>⌫</kbd> delete</span>`;
  wireCards(); drawStormLinks();
}
function drawStormLinks(){
  const svg = $('#svg'), grid = $('#grid'); if (!svg || !grid) return;
  const g = grid.getBoundingClientRect();
  svg.setAttribute('width', grid.scrollWidth); svg.setAttribute('height', grid.scrollHeight);
  const box = id => { const el = grid.querySelector(`.card[data-id="${id}"]`); if (!el) return null;
    const r = el.getBoundingClientRect();
    return { l:r.left - g.left, r:r.right - g.left, t:r.top - g.top, b:r.bottom - g.top,
             cy:r.top - g.top + r.height / 2 }; };
  const cls = { reacts:'pol', triggers:'pol', shows:'vw', informs:'vwd' };
  const paths = S().links.filter(l => cls[l.kind]).map(l => {
    const a = box(l.from), b = box(l.to); if (!a || !b) return '';
    const fwd = b.l >= a.r - 8;
    const x1 = fwd ? a.r : a.l, x2 = fwd ? b.l : b.r;
    const d = fwd
      ? `M${x1} ${a.cy} C${x1 + Math.max(30,(x2 - x1) / 2)} ${a.cy} ${x2 - Math.max(30,(x2 - x1) / 2)} ${b.cy} ${x2} ${b.cy}`
      : `M${x1} ${a.cy} C${x1 - 54} ${a.cy + 34} ${x2 + 54} ${b.cy + 34} ${x2} ${b.cy}`;
    return `<path class="${cls[l.kind]}" d="${d}"/>`;
  });
  svg.insertAdjacentHTML('beforeend', paths.join(''));
}

/* ── canvas · map ───────────────────────────────────────────────────────────── */
const NW = 186, NGAP = 58, ROWH = 46;
function layout(){
  const root = M().nodes.find(n => !n.parent); if (!root) return;
  let row = 0;
  const depth = n => { let d = 0, c = n; while (c.parent) { c = nById(c.parent); if (!c) break; d++; } return d; };
  (function place(n){
    const k = kids(n.id);
    if (!k.length) { n._y = row++; return; }
    k.forEach(place);
    n._y = (k[0]._y + k[k.length - 1]._y) / 2;
  })(root);
  for (const n of M().nodes) { n._d = depth(n); n._x = n._d * (NW + NGAP) + 20; n._py = n._y * ROWH + 26; }
}
function renderMap(){
  layout();
  const f = findings();
  const flagged = new Set(f.map(x => x.card).filter(Boolean));
  const branch = n => { let c = n; while (c.parent && nById(c.parent)?.parent) c = nById(c.parent);
    const top = kids(M().nodes.find(x => !x.parent).id); const i = top.findIndex(x => x.id === c.id);
    return i < 0 ? 0 : i % 6; };
  const nodes = M().nodes.map(n => {
    const b = n.parent ? branch(n) : null;
    const k = kids(n.id).length;
    return `<div class="node ${n.parent ? 'b' + n._d : 'root'} ${sel === n.id ? 'sel' : ''}
        ${cue === n.id ? 'cue' : ''} ${flagged.has(n.id) ? 'flagged' : ''} ${dimmed(n) ? 'dim' : ''}"
        data-id="${n.id}" draggable="true"
        style="left:${n._x}px;top:${n._py}px;${b === null ? '' : `--c:var(--b${b})`}">
      <span class="flag"></span>
      <div class="rail">
        <button data-a="expand" title="Ask Claude to expand this">+</button>
        <button data-a="explain" title="Ask Claude to explain this">?</button>
        <button data-a="kid" title="Add a child">↳</button>
        <button class="del" data-a="del" title="Delete">×</button>
      </div>
      <div class="t" contenteditable="plaintext-only" spellcheck="false">${hl(n.text)}</div>
      ${k ? `<div class="kids">${k}</div>` : ''}
      ${(n.asks || []).length ? `<span class="asks">? ${n.asks.length}</span>` : ''}
    </div>`;
  }).join('');
  const W = Math.max(...M().nodes.map(n => n._x)) + NW + 40;
  const H = Math.max(...M().nodes.map(n => n._py)) + 90;
  const tree = M().nodes.filter(n => n.parent).map(n => {
    const p = nById(n.parent); if (!p) return '';
    const x1 = p._x + NW, y1 = p._py + 18, x2 = n._x, y2 = n._py + 18, mx = (x1 + x2) / 2;
    return `<path class="tree" style="--c:var(--b${branch(n)})" d="M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}"/>`;
  }).join('');
  const rel = M().links.map(l => {
    const a = nById(l.from), b = nById(l.to); if (!a || !b) return '';
    const x1 = a._x + NW / 2, y1 = a._py + 36, x2 = b._x + NW / 2, y2 = b._py;
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2 + 22;
    return `<path class="rel" d="M${x1} ${y1} Q${mx} ${my} ${x2} ${y2}"/>
            <text x="${mx}" y="${my - 3}" text-anchor="middle">${esc(l.label)}</text>`;
  }).join('');
  $('#scroll').innerHTML = `<div id="canvas" style="width:${W}px;height:${H}px">
    <svg class="links" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"><defs>
      <marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M0 0 L8 4 L0 8 z" fill="var(--ink-3)"/></marker>
    </defs>${tree}${rel}</svg>${nodes}</div>`;
  $('#bar').innerHTML =
    `<span class="sw" style="--c:var(--brand)"><i></i>Root</span>
     <span class="sw" style="--c:var(--b0)"><i></i>Branch</span>
     <span class="sw" style="--c:var(--ink-3)"><i></i>Relationship</span>
     <span class="hint">colour marks the branch · hierarchy is the tree, relationships are the
       labelled links · <kbd>↳</kbd> child · <kbd>⌫</kbd> delete</span>`;
  wireCards();
}

/* ── shared card behaviour ──────────────────────────────────────────────────── */
function wireCards(){
  const items = DOC.method === 'storm' ? S().cards : M().nodes;
  const find = id => items.find(c => c.id === id);
  $$('.card,.node').forEach(el => {
    const c = find(el.dataset.id); if (!c) return;
    el.onclick = e => {
      if (e.target.closest('.rail') || e.target.isContentEditable) return;
      sel = sel === c.id ? null : c.id; render();
    };
    el.querySelector('.t').onblur = e => {
      const v = e.target.textContent.trim();
      if (v && v !== c.text) { c.text = v; touched(); render(); }
      else e.target.innerHTML = hl(c.text);
    };
    const who = el.querySelector('.who');
    if (who) who.onblur = e => {
      const v = e.target.textContent.trim();
      if (v !== (c.who || '') && v !== 'who?') { c.who = v; touched(); render(); }
    };
    el.querySelectorAll('.rail button').forEach(b => b.onclick = ev => {
      ev.stopPropagation();
      const a = b.dataset.a;
      if (a === 'del') {
        if (DOC.method === 'storm') {
          DOC.storm.cards = S().cards.filter(x => x.id !== c.id);
          DOC.storm.links = S().links.filter(l => l.from !== c.id && l.to !== c.id);
        } else {
          const doomed = new Set([c.id]);
          let grew = true;
          while (grew) { grew = false;
            for (const n of M().nodes) if (n.parent && doomed.has(n.parent) && !doomed.has(n.id)) { doomed.add(n.id); grew = true; } }
          DOC.map.nodes = M().nodes.filter(n => !doomed.has(n.id));
          DOC.map.links = M().links.filter(l => !doomed.has(l.from) && !doomed.has(l.to));
        }
      }
      else if (a === 'type') { c.type = CYCLE[(CYCLE.indexOf(c.type) + 1) % CYCLE.length]; }
      else if (a === 'kid')  { DOC.map.nodes.push({ id:nid('n'), text:'New', parent:c.id, src:c.src }); }
      /* an ask is a note with a preset question — the mechanism the spec page
         already uses, so "expand this" needs no chat panel on the page */
      else if (a === 'expand')  { (c.asks = c.asks || []).push('expand this'); }
      else if (a === 'explain') { (c.asks = c.asks || []).push('why is this here?'); }
      touched(); render();
    });
    el.ondragstart = e => { e.dataTransfer.setData('text/plain', c.id); el.classList.add('moving'); };
    el.ondragend = () => el.classList.remove('moving');
  });
  if (DOC.method === 'storm') $$('#grid .cell').forEach(cell => {
    cell.ondragover = e => { e.preventDefault(); cell.classList.add('drop'); };
    cell.ondragleave = () => cell.classList.remove('drop');
    cell.ondrop = e => {
      e.preventDefault(); cell.classList.remove('drop');
      const c = byId(e.dataTransfer.getData('text/plain')); if (!c) return;
      c.lane = cell.dataset.lane; c.t = +cell.dataset.t; touched(); render();
    };
    cell.querySelector('.add').onclick = () => {
      DOC.storm.cards.push({ id:nid('e'), type:'evt', text:'Something happened',
        lane:cell.dataset.lane, t:+cell.dataset.t, src:0 });
      touched(); render();
    };
  });
  if (DOC.method === 'map') {
    const cv = $('#canvas');
    if (cv) {
      cv.ondragover = e => e.preventDefault();
      cv.ondrop = e => {
        const n = nById(e.dataTransfer.getData('text/plain')); if (!n) return;
        const el = document.elementFromPoint(e.clientX, e.clientY)?.closest('.node');
        const tgt = el && el.dataset.id !== n.id ? nById(el.dataset.id) : null;
        if (!tgt) return;
        let c = tgt; while (c) { if (c.id === n.id) return; c = c.parent ? nById(c.parent) : null; }
        n.parent = tgt.id; touched(); render();
      };
    }
  }
  document.onkeydown = e => {
    if (e.target.isContentEditable || e.target.tagName === 'TEXTAREA') return;
    if ((e.key === 'Backspace' || e.key === 'Delete') && sel) {
      const el = document.querySelector(`[data-id="${sel}"] .rail .del`); if (el) el.click();
    }
  };
}

/* ── findings strip ─────────────────────────────────────────────────────────── */
let at = 0;
function renderChecks(){
  const f = findings();
  const strip = $('#checks'); if (!strip) return;
  if (say) {
    strip.className = 'said';
    $('#cnt').textContent = '✓';
    $('#msg').innerHTML = esc(say);
    $('#why').textContent = ''; return;
  }
  strip.className = f.length ? '' : 'clean';
  if (!f.length) {
    $('#cnt').textContent = 'Nothing left to settle';
    $('#msg').innerHTML = ''; $('#why').textContent = ''; return;
  }
  at = Math.min(at, f.length - 1);
  const lang = f.filter(x => x.term).length;
  $('#cnt').innerHTML = `<b>${f.length}</b> to settle
    <em>${at + 1}/${f.length}${lang ? ` · ${lang} language` : ''}</em>`;
  $('#msg').innerHTML = f[at].msg;
  $('#why').textContent = f[at].why;
  const step = d => {
    at = (at + d + f.length) % f.length;
    const x = f[at];
    cue = x.card || null; litTerm = x.term || null;
    render();
    const el = x.card ? document.querySelector(`[data-id="${x.card}"]`)
             : x.term ? document.querySelector(`[data-t="${x.term}"]`)
             : x.para != null ? document.querySelector(`.para[data-p="${x.para}"]`) : null;
    if (el) el.scrollIntoView({ block:'center', inline:'center', behavior:'smooth' });
    setTimeout(() => { cue = null; }, 1400);
  };
  $('#prev').onclick = () => step(-1);
  $('#next').onclick = () => step(1);
}

/* ── the loop ───────────────────────────────────────────────────────────────── */
function render(){
  renderSteps();
  if (DOC.step === 'describe') renderDescribe();
  else if (DOC.step === 'method') renderMethod();
  else renderWork();
  $$('#steps button').forEach(b => b.onclick = () => { DOC.step = b.dataset.step; dirty = false; render(); });
  if (DOC.step === 'work') {
    const sw = $('#switch'), fo = $('#fold2'), ho = $('#handoff');
    if (sw) sw.onclick = () => {
      DOC.method = DOC.method === 'storm' ? 'map' : 'storm';
      announce(`${METHODS[DOC.method].name} · prose and ${DOC.language.length} terms carried over`);
    };
    if (fo) fo.onclick = () => { showWho = !showWho; render(); };
    if (ho) ho.onclick = () => announce('Handed to /vstack:wireframe · specs/requirements.md written with the language table');
  }
  $('#send').onclick = () => {
    if (DOC.step === 'describe') { DOC.step = 'method'; return render(); }
    if (DOC.step === 'method')   { DOC.step = 'work'; dirty = false; return render(); }
    dirty = false; announce('Sent — Claude has it');
  };
}
render();
addEventListener('resize', () => { if (DOC.step === 'work' && DOC.method === 'storm') drawStormLinks(); });
</script>
