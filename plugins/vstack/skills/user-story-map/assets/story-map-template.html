<title>User Story Map · Visual Stack</title>
<!--
  Interactive user story map. Drag story cards between cells to re-slice work
  across phases. Self-contained (no external resources) so it works as an Artifact.

  TO USE: served by lib/json-bridge.mjs the map lives in a JSON file beside the
  page and this file needs no editing at all. To publish an Artifact instead,
  copy it and replace the title element and the script#data block below with
  the real content — written as names, not tags, so that anything scanning this
  file for the real block doesn't match this sentence. Everything else is the
  engine. Schema:
    { title,                                       // the product/initiative name only — no "Story Map" suffix
      lang,                                        // optional: "en" (default) or "zh" — initial UI language; users can toggle
      tags:       ["AI"],                          // cross-cutting themes; stories reference them by name
      activities: [{ id, name }],                  // backbone columns (the journey, left→right)
      phases:     [{ id, name, goal }],            // release swimlanes (rows, top→bottom = order)
      stories:    [{ id, activity, phase, text, tags: ["AI"], status }] }
  status: "open" (default) | "progress" | "review" | "done" — the card's left
  border accent is coloured by status. Order in each array is the display/rank
  order (users can re-drag it). Cell tints are auto-assigned per phase; ids
  must be unique strings.
-->
<style>
/* vstack:shell tokens */
/* One palette for every vstack page. Roles, not colours: a page asks for
   --surface, not for white, so light and dark are the same stylesheet.

   Page-specific hues (the story map's phase bands, the board's new/have/touch,
   the spec's priorities) stay in the page, below this block — they mean
   something only there. Everything here is shared, and is the reason a board
   and a spec look like the same product.

   Three states, in this order: the OS preference, then an explicit choice.
   `data-theme` absent means auto. */
:root{
  --paper:#eef0f3; --surface:#ffffff; --surface-2:#f7f8fa;
  --ink:#16171c; --ink-2:#43454d; --ink-3:#71737c;
  --line:#e2e4e9; --line-2:#d0d2d9;
  --brand:#d23b2e; --brand-soft:#fdefed; --brand-line:#f3b3ac;
  --ok:#10876e; --ok-soft:#e9f9f2;
  --shadow:0 1px 2px rgba(16,17,22,.06);
  --shadow-pop:0 1px 2px rgba(16,17,22,.06),0 8px 24px rgba(16,17,22,.10);
  --window-shadow:0 2px 6px rgba(16,17,22,.10),0 18px 48px rgba(16,17,22,.16);
  --radius:9px;
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0e0f12; --surface:#17191e; --surface-2:#1d1f25;
  --ink:#f1f2f4; --ink-2:#bcbfc7; --ink-3:#8b8e97;
  --line:#282a31; --line-2:#363942;
  --brand:#f0685c; --brand-soft:rgba(240,104,92,.14); --brand-line:rgba(240,104,92,.38);
  --ok:#2fb89b; --ok-soft:rgba(47,184,155,.14);
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-pop:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.5);
  --window-shadow:0 2px 6px rgba(0,0,0,.5),0 18px 48px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme=light]{
  --paper:#eef0f3; --surface:#ffffff; --surface-2:#f7f8fa;
  --ink:#16171c; --ink-2:#43454d; --ink-3:#71737c;
  --line:#e2e4e9; --line-2:#d0d2d9;
  --brand:#d23b2e; --brand-soft:#fdefed; --brand-line:#f3b3ac;
  --ok:#10876e; --ok-soft:#e9f9f2;
  --shadow:0 1px 2px rgba(16,17,22,.06);
  --shadow-pop:0 1px 2px rgba(16,17,22,.06),0 8px 24px rgba(16,17,22,.10);
  --window-shadow:0 2px 6px rgba(16,17,22,.10),0 18px 48px rgba(16,17,22,.16);
  color-scheme:light;
}
:root[data-theme=dark]{
  --paper:#0e0f12; --surface:#17191e; --surface-2:#1d1f25;
  --ink:#f1f2f4; --ink-2:#bcbfc7; --ink-3:#8b8e97;
  --line:#282a31; --line-2:#363942;
  --brand:#f0685c; --brand-soft:rgba(240,104,92,.14); --brand-line:rgba(240,104,92,.38);
  --ok:#2fb89b; --ok-soft:rgba(47,184,155,.14);
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-pop:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.5);
  --window-shadow:0 2px 6px rgba(0,0,0,.5),0 18px 48px rgba(0,0,0,.6);
  color-scheme:dark;
}
/* /vstack:shell tokens */
  :root{
    /* the phase bands — six hues that cycle, and how strongly a cell is tinted */
    --p0:#d23b2e; --p1:#b0761a; --p2:#10876e; --p3:#4a5fce; --p4:#8a53c0; --p5:#0f7f9c; --band:8%;
  }
  @media (prefers-color-scheme:dark){:root{
    --p0:#ef6a5e;--p1:#d29a3f;--p2:#2fb89b;--p3:#7d90ee;--p4:#b98cec;--p5:#3fb6d6;--band:15%;
  }}
  :root[data-theme="light"]{--p0:#d23b2e;--p1:#b0761a;--p2:#10876e;--p3:#4a5fce;--p4:#8a53c0;--p5:#0f7f9c;--band:8%}
  :root[data-theme="dark"]{--p0:#ef6a5e;--p1:#d29a3f;--p2:#2fb89b;--p3:#7d90ee;--p4:#b98cec;--p5:#3fb6d6;--band:15%}

  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:13px/1.5 var(--font);
    -webkit-font-smoothing:antialiased}
  /* the spec sheet, literally: the content sits on a surface panel with the
     same gutters and base size, so the two stages read as one product rather
     than a document and a dashboard */
  .wrap{max-width:1600px;margin:0 auto;min-height:100vh;background:var(--surface);
    border-left:1px solid var(--line);border-right:1px solid var(--line);
    padding:clamp(1.2rem,3vw,2.2rem) clamp(1.4rem,4vw,3rem) 3rem}

/* vstack:shell css */
/* The chrome every vstack page wears: the top bar and the controls that sit in
   it. Page layout stays in the page — some of these are app shells that fill
   the viewport, some are documents that scroll — but the bar, the buttons and
   the segmented controls are the same object everywhere. */
/* The shell hides its own controls with `hidden` — the link dot when there is
   no link, the primary action on a page that doesn't send. A class that sets
   `display` outranks the browser's default [hidden] rule, and .btn/.linkdot
   both do, so state this here rather than trusting each page's reset. */
[hidden]{display:none!important}
/* Above anything the page floats at its edges. The bar makes a stacking context,
   so a menu opening out of it can never rise past a sibling with a higher
   z-index — which is how the comments handle came to sit on top of the settings
   menu. Raising the bar raises everything it opens. */
.vs-topbar{display:flex;align-items:center;gap:10px;padding:0 12px;height:46px;
  background:var(--surface);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:50}
.vs-topbar .brand{display:flex;align-items:center;gap:8px;min-width:0}
.vslink{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:inherit}
.vsmark{width:15px;height:15px;flex:none;color:var(--ink)}
.vslink:hover .vsmark{opacity:.8}
/* The tool's name, in the place the wordmark used to take. */
.brand b{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:280px}
.brand .eyebrow{font:600 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);white-space:nowrap}
.spacer{flex:1}
.sep{width:1px;height:20px;background:var(--line);flex:none}

/* Says the tool itself is unfinished — not that something is running. A page
   still being built should admit it in the chrome, not in a footnote. */
.wip{flex:none;font:700 9.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:#b0761a;background:color-mix(in srgb,#b0761a 12%,transparent);
  border:1px solid color-mix(in srgb,#b0761a 34%,transparent);
  border-radius:999px;padding:4px 8px;white-space:nowrap}
@media (prefers-color-scheme:dark){.wip{color:#d29a3f;background:color-mix(in srgb,#d29a3f 14%,transparent);
  border-color:color-mix(in srgb,#d29a3f 34%,transparent)}}
:root[data-theme=dark] .wip{color:#d29a3f;background:color-mix(in srgb,#d29a3f 14%,transparent);
  border-color:color-mix(in srgb,#d29a3f 34%,transparent)}
:root[data-theme=light] .wip{color:#b0761a;background:color-mix(in srgb,#b0761a 12%,transparent);
  border-color:color-mix(in srgb,#b0761a 34%,transparent)}

/* A switch is on or off. A segmented control is a choice between alternatives —
   using one to mean the other is why "Highlight new" read as two buttons. */
.switch{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px 0 9px;
  border:1px solid var(--line-2);border-radius:7px;background:var(--surface);color:var(--ink-2);
  font:inherit;font-weight:550;white-space:nowrap;cursor:pointer;flex:none}
.switch:hover{background:var(--surface-2);color:var(--ink)}
.switch .track{width:26px;height:15px;border-radius:999px;background:var(--line-2);
  position:relative;flex:none;transition:background .14s}
.switch .knob{position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;
  background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.35);transition:transform .14s}
/* On is the same "this one is selected" the segmented control uses. The brand
   red is the primary action — a view option wearing it read as the thing to
   press; solid black read like one too. */
.switch[aria-checked=true]{color:var(--ink);border-color:var(--line-2)}
/* The same near-black the segmented controls use when selected — on is on,
   whichever control is saying it. */
.switch[aria-checked=true] .track{background:var(--ink-2)}
.switch[aria-checked=true] .knob{transform:translateX(11px)}

/* buttons — one shape, three sizes of intent */
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:7px;
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:550;
  white-space:nowrap;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.primary[disabled]{opacity:.45;cursor:default;filter:none;pointer-events:none}
.btn[disabled]{opacity:.45;cursor:default;pointer-events:none}
.btn.sm{height:25px;padding:0 9px;font-size:11.5px}

/* A primary action with a ▾ beside it. The workspace and the story map both
   have one and they were built twice; same markup, same metrics, here. */
.split{display:inline-flex;position:relative;flex:none}
.split > .btn:first-child{border-radius:7px 0 0 7px}
.split > .caret{border-radius:0 7px 7px 0;width:28px;padding:0 8px;justify-content:center;
  border-left:1px solid color-mix(in srgb,#fff 28%,transparent)}

/* segmented control — modes, sizes, language, theme */
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden;
  background:var(--surface);flex:none}
.seg button{height:30px;padding:0 12px;font-weight:550;color:var(--ink-2);display:inline-flex;
  align-items:center;gap:6px;border:0;border-right:1px solid var(--line-2);background:none;
  cursor:pointer;font:inherit;font-weight:550}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--surface-2)}
/* Selected is near-black rather than black: dark enough to find at a glance,
   one step off the ink the page's own words are set in, so the bar never
   out-blacks the content. --ink-2 flips with the theme, so in dark mode this is
   the same step down from white. */
.seg button[aria-pressed=true]{background:var(--ink-2);color:var(--surface);font-weight:650}
.seg.sm button{height:25px;padding:0 9px;font-size:11.5px}
#langSwitch button,#themeSwitch button{padding:0 9px;font-size:11.5px;font-weight:600}
#themeSwitch button{padding:0 8px}
#themeSwitch svg{width:13px;height:13px;display:block}

/* ── settings: how you like the page, out of the way ── */
.cogwrap{position:relative;flex:none}
.cog{width:30px;height:30px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface);
  color:var(--ink-2);display:grid;place-items:center;cursor:pointer}
.cog:hover,.cog[aria-expanded=true]{background:var(--surface-2);color:var(--ink)}
.cog svg{width:15px;height:15px;display:block}
.cogmenu{position:absolute;top:36px;right:0;z-index:60;background:var(--surface);
  border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow-pop);padding:9px;
  display:grid;gap:9px;min-width:210px}
.cogmenu[hidden]{display:none}
.cogmenu .row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.cogmenu .lbl{font-size:12px;color:var(--ink-2);white-space:nowrap}

/* the live link, stated rather than implied */
.linkdot{display:inline-flex;align-items:center;gap:6px;font:600 10.5px/1 var(--mono);
  letter-spacing:.03em;color:var(--ink-3);white-space:nowrap}
.linkdot::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink-3);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--ink-3) 18%,transparent)}
.linkdot.on{color:var(--ok)}
.linkdot.on::before{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
/* Up, but nobody is waiting to read what you send. Amber rather than green,
   because the page works and the round will not — the same distinction the
   WIP tag makes. */
.linkdot.idle{color:#b0761a}
.linkdot.idle::before{background:#b0761a;box-shadow:0 0 0 3px color-mix(in srgb,#b0761a 22%,transparent)}
@media (prefers-color-scheme:dark){.linkdot.idle{color:#d29a3f}
  .linkdot.idle::before{background:#d29a3f;box-shadow:0 0 0 3px color-mix(in srgb,#d29a3f 22%,transparent)}}
:root[data-theme=dark] .linkdot.idle{color:#d29a3f}
:root[data-theme=dark] .linkdot.idle::before{background:#d29a3f;
  box-shadow:0 0 0 3px color-mix(in srgb,#d29a3f 22%,transparent)}

/* floating banners — the page talking back, never blocking the work */
.banner{position:fixed;left:50%;top:58px;transform:translateX(-50%);z-index:38;display:none;
  align-items:center;gap:10px;padding:8px 10px 8px 14px;border-radius:10px;box-shadow:var(--shadow-pop);
  font-size:12.5px;white-space:nowrap;max-width:calc(100% - 24px)}
.banner.on{display:flex}
.banner.dark{background:var(--ink);color:var(--surface)}
.banner.dark .btn{background:color-mix(in srgb,var(--surface) 16%,transparent);
  border-color:transparent;color:var(--surface)}
.banner.dark .btn:hover{background:color-mix(in srgb,var(--surface) 28%,transparent)}
.banner.good{background:var(--ok-soft);border:1px solid var(--ok);color:var(--ink)}
.banner.good .tick{color:var(--ok);font-weight:700}

/* ── "there is a newer one" ──
   One line under the bar, in the workmanlike amber the WIP tag uses: it is
   information, not an alarm, and it goes away for good on ×. */
.vs-update{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:7px 12px;font-size:12px;color:var(--ink-2);
  background:color-mix(in srgb,#b0761a 8%,var(--surface));
  border-bottom:1px solid color-mix(in srgb,#b0761a 26%,transparent)}
.vs-update .v{font:700 9.5px/1 var(--mono);letter-spacing:.06em;color:#8a5c06;
  background:color-mix(in srgb,#b0761a 16%,transparent);border-radius:999px;padding:4px 7px;flex:none}
.vs-update .t{flex:1;min-width:0}
.vs-update button{font:inherit;font-size:11.5px;font-weight:600;color:var(--ink-2);
  border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:3px 8px;flex:none}
.vs-update button:hover{color:var(--ink);background:var(--surface-2)}
.vs-update .no{width:24px;padding:0;font-size:14px;line-height:1}
.vs-update-how{flex-basis:100%;margin:2px 0 0;font-size:11.5px;color:var(--ink-3)}
.vs-update-how[hidden]{display:none}
.vs-update-how p{margin:0 0 4px}
.vs-update-how pre{margin:0 0 4px;padding:7px 9px;border-radius:7px;overflow-x:auto;
  font:500 11px/1.6 var(--mono);color:var(--ink);background:var(--surface);border:1px solid var(--line)}
.vs-update-how .auto{margin:0 0 4px}
.vs-update-how a{color:var(--ink-2)}
@media (prefers-color-scheme:dark){.vs-update .v{color:#e2b567}}
:root[data-theme=dark] .vs-update .v{color:#e2b567}

@media (max-width:720px){
  .brand .eyebrow,.wip{display:none}
  .vs-topbar{gap:8px;padding:0 8px}
}
/* /vstack:shell css */

  header{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem}
  /* The header holds one block; it has to span the row for the bulk button's
     margin-left:auto to have an edge to sit against. */
  header > div{flex:1;min-width:0}
  header .eyebrow{font:700 10.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;
    color:var(--brand);margin:0 0 .55rem;display:inline-flex;align-items:center;gap:.5rem}
  header .eyebrow::before{content:"";width:1.4rem;height:2px;background:var(--brand);border-radius:2px}
  h1{font-size:clamp(1.3rem,3vw,1.7rem);line-height:1.12;letter-spacing:-.02em;font-weight:750;
    margin:0 0 .3rem;text-wrap:balance}
  /* Buttons are the shell's, exactly as the workspace has them — the only
     addition is the pressed state Select needs, which no other page has. */
  .btn.on{background:color-mix(in srgb,var(--brand) 12%,var(--surface));border-color:var(--brand);color:var(--brand)}
  .btn.on:hover{background:color-mix(in srgb,var(--brand) 18%,var(--surface));color:var(--brand)}
  .selmode .card,.selmode .card [contenteditable]{cursor:pointer}
  .selmode .card .ctrls{display:none}
  .selmode .card::after{content:"";position:absolute;top:4px;right:4px;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--surface)}
  .selmode .card.sel::after{content:"✓";width:14px;height:14px;border:0;background:var(--brand);color:#fff;font-size:.6rem;line-height:14px;text-align:center}
  .btn svg{width:15px;height:15px}
  .menu{position:absolute;top:calc(100% + 4px);right:0;z-index:70;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:.25rem;min-width:150px}
  .menu[hidden]{display:none}
  .menu button{display:flex;align-items:center;gap:.45rem;width:100%;text-align:left;border:0;background:none;font:inherit;font-size:.74rem;color:var(--ink-2);padding:.35rem .5rem;border-radius:6px;cursor:pointer;white-space:nowrap}
  .menu button:hover{background:var(--surface-2);color:var(--ink)}
  .menu button:disabled{opacity:.6;cursor:default;pointer-events:none}
  /* armed = asked once, waiting to be meant */
  .menu button.armed{background:var(--brand-soft);color:var(--brand);font-weight:650}

  .tag{display:inline-flex;align-items:center;gap:.25rem;font-family:var(--mono);font-size:.54rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--tc,var(--ink-3));background:color-mix(in srgb,var(--tc,var(--ink-3)) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--tc,var(--ink-3)) 30%,transparent);padding:.05rem .3rem;border-radius:4px}
  .tag .d{width:5px;height:5px;border-radius:50%;background:var(--tc,var(--ink-3))}
  .t0{--tc:var(--p4)}.t1{--tc:var(--p5)}.t2{--tc:var(--p1)}.t3{--tc:var(--p2)}.t4{--tc:var(--p3)}.t5{--tc:var(--p0)}

  /* Title and legend share a baseline — the legend reads as a footnote to the
     title rather than a second thing floating beside it. The button is not text,
     so it centres instead; a baseline is a line of type, not a box edge. */
  .trow{display:flex;align-items:baseline;gap:1.2rem;flex-wrap:wrap}
  .trow #selmode{margin-left:auto;align-self:center}
  .kbd{font:500 10px/1 var(--mono);opacity:.65}
  .trow h1{margin:0}
  .legend{display:flex;flex-wrap:wrap;align-items:center;gap:.8rem;font-size:.68rem;color:var(--ink-3)}
  .legend .lt{font-family:var(--mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase}
  .legend .li{display:inline-flex;align-items:center;gap:.35rem}
  .legend .sw,.st-opt .sw{width:10px;height:10px;border-radius:3px;background:var(--stc);flex:none}

  .scroll{overflow:auto;max-height:80vh;margin-top:1rem;border:1px solid var(--line-2);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);scrollbar-width:thin}
  .map{display:grid}
  .cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}

  .corner{position:sticky;top:0;left:0;z-index:30;background:var(--surface-2);border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2);padding:.6rem .7rem;display:flex;align-items:flex-end}
  .corner span{font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}

  .act{position:sticky;top:0;z-index:20;background:var(--surface-2);border-bottom:1px solid var(--line-2);padding:1.1rem .5rem .45rem;min-width:0;cursor:grab}
  .act .an{font-size:.76rem;font-weight:700;letter-spacing:-.01em;line-height:1.15;outline:none;border-radius:4px}
  .act .actls{display:flex;align-items:center;gap:.3rem}
  .x-act{margin-left:auto;opacity:0;border:0;background:none;color:var(--ink-3);cursor:pointer;font-size:.9rem;line-height:1;padding:0 .2rem}
  .act:hover .x-act{opacity:.7}

<script>
/* vstack:shell js */
/* The behaviour behind the top bar: theme, language, the link dot, and the
   page's own name. Everything else — what the page does — is the page's.

   Nothing here touches the network or the document beyond the bar, so a page
   works identically served, opened off disk, or published as an Artifact. */
window.VSShell = (function () {
  const $ = s => document.querySelector(s);
  const KEY = { theme: 'vstack:theme', lang: 'vstack:lang', seen: 'vstack:update-seen' };
  const store = {
    get (k, d) { try { return localStorage.getItem(k) ?? d } catch { return d } },
    set (k, v) { try { localStorage.setItem(k, v) } catch {} },
  };

  /* ── theme: auto (whatever the OS says) / light / dark ──
     Auto is the absence of an override, so the page keeps following the system
     if it changes while open — and an Artifact viewer's own toggle still wins
     the same way it does on a page that never had this control. */
  let theme = store.get(KEY.theme, 'auto');
  function applyTheme () {
    if (theme === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', theme);
    document.querySelectorAll('#themeSwitch button').forEach(b => {
      b.setAttribute('aria-pressed', String(b.dataset.themeSet === theme));
    });
  }
  function setTheme (next) {
    theme = ['auto', 'light', 'dark'].includes(next) ? next : 'auto';
    store.set(KEY.theme, theme);
    applyTheme();
  }

  /* ── language: chrome only. Page content stays as authored. ── */
  const storedLang = store.get(KEY.lang, null);
  let lang = storedLang === 'zh' ? 'zh' : 'en';
  const langListeners = [];
  function applyLang () {
    // zh-CN, not zh: the specific tag is what picks the right font and
    // line-breaking for simplified Chinese.
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    document.querySelectorAll('#langSwitch button').forEach(b => {
      b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
    });
    langListeners.forEach(fn => { try { fn(lang) } catch {} });
  }
  function setLang (next) {
    lang = next === 'zh' ? 'zh' : 'en';
    store.set(KEY.lang, lang);
    applyLang();
  }

  /* ── the live link, said out loud ── */
  /* Three states, not two. "The page reached its server" and "an agent session
     is waiting to read what you send" are different facts, and only the second
     is the one anyone actually wants to know. `watching` undefined means the
     page has no way to tell, and the dot behaves as it always did. Host name
     comes from window.__VSTACK_HOST__ (contracts/host.md). */
  let linked = null, linkLabels = null, watching;
  function paintLink () {
    const el = $('#linkDot');
    if (!el || linked === null) return;
    el.hidden = false;
    const idle = linked && watching === false;
    el.classList.toggle('on', linked && !idle);
    el.classList.toggle('idle', !!idle);
    const agent = window.__VSTACK_HOST__?.name || 'agent';
    el.textContent = !linked ? (linkLabels?.off ?? 'LINK LOST')
      : idle ? (linkLabels?.idle ?? 'UNLINKED')
      : (linkLabels?.on ?? `LINKED TO ${String(agent).toUpperCase()}`);
    el.title = !linked ? (linkLabels?.offTitle ?? '')
      : idle ? (linkLabels?.idleTitle ?? '') : '';
  }
  function setLink (up, labels, isWatching) {
    linked = !!up;
    if (labels) linkLabels = labels;
    if (isWatching !== undefined) watching = isWatching;
    paintLink();
  }
  /** The server saying who is listening now, without the page repeating itself. */
  function setWatching (isWatching) {
    if (watching === isWatching) return;
    watching = isWatching;
    paintLink();
  }
  const hideLink = () => { const el = $('#linkDot'); if (el) el.hidden = true };

  function name (pageName, eyebrow) {
    const n = $('#pageName'); const e = $('#pageEyebrow');
    if (n && pageName != null) n.textContent = pageName;
    if (e && eyebrow != null) e.textContent = eyebrow;
  }

  /** Mark the tool itself as unfinished. `false` takes it off again. */
  function wip (on, label) {
    const el = $('#wip');
    if (!el) return;
    el.hidden = !on;
    el.textContent = label || 'Work in progress';
  }

  /* ── a newer Visual Stack than this one ──
     The server looked it up before serving this page and left the answer on
     `window.__VSTACK_UPDATE__`; nothing here reaches the network. Dismissal is
     remembered per version, so saying "not now" to 4.2 stays said, and 4.3
     asks once. */
  function updateNotice () {
    const info = window.__VSTACK_UPDATE__;
    // Dismissal is per release: saying "not now" to this one stays said, and
    // the next one asks once.
    if (!info?.title || store.get(KEY.seen, '') === info.title) return;
    const bar = document.createElement('div');
    bar.className = 'vs-update';
    bar.innerHTML =
      `<span class="v">${esc(info.pill || 'new')}</span>` +
      `<span class="t">${esc(info.title)}</span>` +
      `<button class="how">How</button><button class="no" aria-label="Dismiss">×</button>`;
    const how = document.createElement('div');
    how.className = 'vs-update-how';
    how.hidden = true;
    const lead = info.howLead || 'To update:';
    how.innerHTML = `<p>${esc(lead)}</p><pre>${esc((info.install || []).join('\n'))}</pre>` +
      (info.auto ? `<p class="auto">${esc(info.auto)}</p>` : '') +
      (info.url ? `<a href="${esc(info.url)}" target="_blank" rel="noopener">What changed</a>` : '');
    bar.appendChild(how);
    bar.querySelector('.how').onclick = () => { how.hidden = !how.hidden };
    bar.querySelector('.no').onclick = () => { store.set(KEY.seen, info.title); bar.remove() };
    const top = $('.vs-topbar');
    if (top) top.insertAdjacentElement('afterend', bar);
  }
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  /* The cog: one button for the two choices nobody makes twice. */
  function wireSettings () {
    const btn = $('#settingsBtn'), menu = $('#settingsMenu');
    if (!btn || !menu) return;
    const open = on => { menu.hidden = !on; btn.setAttribute('aria-expanded', String(on)) };
    btn.addEventListener('click', e => { e.stopPropagation(); open(menu.hidden) });
    menu.addEventListener('click', e => e.stopPropagation());
    document.addEventListener('click', () => open(false));
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !menu.hidden) open(false) });
  }

  function init (opts = {}) {
    document.querySelectorAll('#themeSwitch button').forEach(b => {
      b.addEventListener('click', () => setTheme(b.dataset.themeSet));
    });
    document.querySelectorAll('#langSwitch button').forEach(b => {
      b.addEventListener('click', () => setLang(b.dataset.lang));
    });
    if (opts.onLang) langListeners.push(opts.onLang);
    // `defaultLang` is what the artifact was authored in — it opens that way
    // once, and after that the reader's own choice is the one that sticks.
    if (opts.defaultLang && !storedLang) lang = opts.defaultLang === 'zh' ? 'zh' : 'en';
    if (opts.lang) { lang = opts.lang === 'zh' ? 'zh' : 'en'; store.set(KEY.lang, lang) }
    // Not every page sends something back — the form doesn't — so the primary
    // action stays out of the bar unless a page asks for it.
    const send = $('#send');
    if (send && opts.send) send.hidden = false;
    if (opts.wip) wip(true, typeof opts.wip === 'string' ? opts.wip : undefined);
    name(opts.name, opts.eyebrow);
    wireSettings();
    applyTheme();
    applyLang();
    updateNotice();
    return api;
  }

  const api = {
    init, setTheme, setLang, setLink, setWatching, hideLink, name, wip,
    get theme () { return theme },
    get lang () { return lang },
    onLang (fn) { langListeners.push(fn) },
  };
  return api;
})();

/* ── the scrubber ──
   An ordered set of states and a handle that moves between them: versions on
   the spec and the review workspace, release phases on phase-preview. The
   page says what the stops are and what showing one does; this owns the track,
   the ticks, the drag, and the caption.

     VSScrub.mount({ onPick: id => showThat(id) })
     VSScrub.set({ items: [{ id, cap, label, sub }], active: id })

   `cap` is the label under the tick (v3, P2), `label` names the stop, and
   `sub` is the line beneath it — both are escaped here, so a page never has to
   remember to. */
window.VSScrub = (function () {
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  let items = [];
  let active = null;
  let onPick = () => {};
  let wired = false;

  const index = () => Math.max(0, items.findIndex(i => i.id === active));
  const pct = i => items.length < 2 ? 100 : (i / (items.length - 1)) * 100;

  function pickAt (clientX) {
    const track = $('#tlTrack');
    if (!track || !items.length) return null;
    const r = track.getBoundingClientRect();
    return items[Math.round(clamp((clientX - r.left) / r.width, 0, 1) * (items.length - 1))]?.id;
  }
  function pick (id) {
    if (id == null || id === active) return;
    active = id;
    paint();
    onPick(id);
  }
  const step = d => { const n = items[index() + d]; if (n) pick(n.id) };

  function paint () {
    const track = $('#tlTrack');
    if (!track) return;
    const i = index();
    track.querySelectorAll('.tick').forEach(t => t.remove());
    items.forEach((it, k) => {
      const t = document.createElement('div');
      t.className = 'tick' + (k <= i ? ' past' : '');
      t.style.left = pct(k) + '%';
      t.innerHTML = `<span class="cap">${esc(it.cap)}</span>`;
      if (it.label) t.title = it.label;
      t.onclick = e => { e.stopPropagation(); pick(it.id) };
      track.appendChild(t);
    });
    $('#tlHandle').style.left = pct(i) + '%';
    $('#tlFill').style.width = pct(i) + '%';
    const cur = items[i];
    $('#tlMeta').innerHTML = cur
      ? `<div class="row"><b>${esc(cur.cap)}</b> <span class="lab">${esc(cur.label)}</span></div>` +
        `<div class="row">${esc(cur.sub)}</div>`
      : '';
    $('#tlPrev').disabled = i === 0;
    $('#tlNext').disabled = i >= items.length - 1;
  }

  function mount (opts = {}) {
    if (opts.onPick) onPick = opts.onPick;
    if (wired || !$('#tlTrack')) return api;
    wired = true;
    $('#tlPrev').onclick = () => step(-1);
    $('#tlNext').onclick = () => step(1);
    $('#tlHandle').addEventListener('pointerdown', e => {
      e.preventDefault();
      const mv = ev => pick(pickAt(ev.clientX));
      const up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up) };
      addEventListener('pointermove', mv); addEventListener('pointerup', up);
    });
    $('#tlTrack').addEventListener('pointerdown', e => {
      if (e.target.closest('#tlHandle, .tick')) return;
      pick(pickAt(e.clientX));
    });
    return api;
  }

  const api = {
    mount,
    set ({ items: list, active: a }) {
      if (list) items = list;
      if (a !== undefined) active = a;
      if (active == null && items.length) active = items[items.length - 1].id;
      paint();
      return api;
    },
    get active () { return active },
    get items () { return items },
  };
  return api;
})();
/* /vstack:shell js */
</script>

      tApproved:"已定稿——地图不再修改", tApproveFail:"无法连接 Claude——尚未定稿",

      linkOn:"已连接 Claude", linkOff:"连接已断开",

      tSent:"已发送给 Claude", tSendFail:"无法连接 Claude——请改为复制 JSON",
      pushMsg:"Claude 更新了此地图", refresh:"刷新", dismiss:"忽略",
      grip:"拖动以移动",
      selModeBtn:"批量操作", selModeTitle:"批量操作——点击任意卡片进行选择",
      bbCount:n=>`已选 ${n} 项`, bbStatus:"状态", bbTag:"标签", bbDelete:"删除", bbClear:"清除选择",
      stLabel:{open:"待办",progress:"进行中",review:"审查中",done:"已完成"},
      legend:"状态",
      confirmHint:"再次点击以确认",
      addStory:"＋ 故事", newStory:"新故事",
      newPhaseName:n=>"阶段 "+n, newPhaseGoal:"新阶段——描述目标",
      newActName:"新活动",
      tagTitle:"标签 / 主题", del:"删除", removeAct:"删除活动", removePhase:"删除阶段",
      delTagEverywhere:"在整张地图中删除此标签",
      tmEmpty:"还没有标签。", tmNew:"新标签…", tmAdd:"添加", tmOpen:"＋ 标签", tmCancel:"不添加标签",
      ioImport:"粘贴地图 JSON", ioCopy:"地图 JSON（请复制）", cancel:"取消", loadBtn:"加载",
      tCopied:"已复制 JSON", tMoved:n=>"已移至 "+n, tReordered:"已重新排序",
      tActReordered:"活动已重新排序", tPhReordered:"阶段已重新排序", tLoaded:"已加载",
      badJson:"这看起来不是有效的故事地图 JSON（需要 activities、phases、stories）。"
    }
  };
  // the shell owns the choice; a map authored in Chinese sets the first one
  let lang = VSShell.lang;
  if(!I18N[lang]) lang = "en";
  const T = (k,...a)=>{ const v=I18N[lang][k]; return typeof v==="function"?v(...a):v; };
  function applyLang(){
    $("eyebrow").textContent=T("eyebrow");
    // the workspace's shape: the act, then the shortcut that performs it
    $("export").innerHTML = esc(BRIDGE ? T("send") : T("copy")) + ` <span class="kbd">${esc(T("kbd"))}</span>`;
    $("export").title = BRIDGE ? T("sendTitle") : "";
    $("copy").textContent=T("copy");
    $("pb-msg").textContent=T("pushMsg"); $("pb-apply").textContent=T("refresh"); $("pb-dismiss").textContent=T("dismiss");
    if(BRIDGE) setLink(linkUp);
    $("export-more").setAttribute("aria-label",T("moreExport"));
    $("approve").textContent = approveArmed ? T("approveSure") : T("approve");
    $("io-cancel").textContent=T("cancel"); $("io-ok").textContent=T("loadBtn");
    $("tm-new").placeholder=T("tmNew"); $("tm-add").textContent=T("tmAdd");
    $("tm-open").textContent=T("tmOpen"); $("tm-cancel").title=T("tmCancel");
    $("legend").innerHTML = `<span class="lt">${esc(T("legend"))}</span>` +
      STATUSES.map(s=>`<span class="li st-${s}"><span class="sw"></span>${esc(T("stLabel")[s])}</span>`).join("");
    $("bb-status").textContent=T("bbStatus"); $("bb-tag").textContent=T("bbTag");
    $("bb-del").textContent=T("bbDelete"); $("bb-clear").title=T("bbClear");
    $("selmode").textContent=T("selModeBtn"); $("selmode").title=T("selModeTitle");
    if(sel.size) $("bb-count").textContent=T("bbCount",sel.size);
  }

  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function normalize(o){
    o.tags = Array.isArray(o.tags) ? o.tags.filter(t=>typeof t==="string") : [];
    (o.stories||[]).forEach(s=>{
      if(!Array.isArray(s.tags)) s.tags = [];
      if(s.ai && !s.tags.length) s.tags = ["AI"];   // legacy ai:true maps
      delete s.ai;
      s.tags.forEach(t=>{ if(!o.tags.includes(t)) o.tags.push(t); });
      if(!STATUSES.includes(s.status)) s.status = "open";
    });
    return o;
  }
  function load(){ try{ const s=localStorage.getItem(KEY); return s?JSON.parse(s):null; }catch(e){ return null; } }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
  function uid(p){ return p + Math.random().toString(36).slice(2,8); }
  const $ = (id)=>document.getElementById(id);
  let toastT;
  function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),1600); }

  // FLIP: snapshot positions before a DOM change, animate the deltas after it.
  // Cells and cards are both tracked; a card riding inside a moving cell only
  // animates the residual delta, so nothing double-moves.
  const canAnimate = typeof Element!=="undefined" && !!Element.prototype.animate;
  const reduceMotion = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  const FLIP_SEL = "[data-card],[data-act],[data-phase],[data-drop-act],[data-fill-phase]";
  function flipKey(el){
    if(el.dataset.card) return "c"+el.dataset.card;
    if(el.dataset.act) return "a"+el.dataset.act;
    if(el.dataset.phase) return "p"+el.dataset.phase;
    if(el.dataset.dropAct) return "s"+el.dataset.dropPhase+"|"+el.dataset.dropAct;
    return "f"+el.dataset.fillPhase;
  }
  function snapshot(){
    if(reduceMotion || !canAnimate) return null;
    const m = new Map();
    document.querySelectorAll(FLIP_SEL).forEach(el=>m.set(flipKey(el),el.getBoundingClientRect()));
    return m.size?m:null;
  }
  function playFlip(prev){
    if(!prev) return;
    const deltas = new Map();
    document.querySelectorAll(FLIP_SEL).forEach(el=>{
      const r0 = prev.get(flipKey(el));
      if(!r0){ if(el.dataset.card) el.animate([{opacity:0,transform:"scale(.9)"},{opacity:1,transform:"none"}],{duration:160,easing:"ease-out"}); return; }
      const r1 = el.getBoundingClientRect();
      const dx = r0.left-r1.left, dy = r0.top-r1.top;
      if(dx||dy) deltas.set(el,{dx,dy});
    });
    deltas.forEach((d,el)=>{
      let dx=d.dx, dy=d.dy;
      if(el.dataset.card){
        const pc = el.closest(".stories"), pd = pc && deltas.get(pc);
        if(pd){ dx-=pd.dx; dy-=pd.dy; }
      }
      if(dx||dy) el.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:"none"}],{duration:220,easing:"cubic-bezier(.2,.8,.2,1)"});
    });
  }
  function withFlip(mutate){ const prev=snapshot(); mutate(); playFlip(prev); }

  function render(){
    const sc = document.querySelector(".scroll");
    const sl = sc.scrollLeft, st = sc.scrollTop;
    const prevRects = snapshot();
    $("title").textContent = state.title||"";
    const map = $("map");
    const acts = state.activities, phases = state.phases;
    map.style.gridTemplateColumns = `100px repeat(${acts.length}, minmax(132px,1fr)) 84px`;

    let h = `<div class="cell corner"><span>${T("corner")}</span></div>`;
    acts.forEach(a=>{
      // The activity is its name. A second line explaining it turned the
      // backbone into prose, and the stories under it already say what it means.
      h += `<div class="cell act" draggable="true" data-act="${a.id}">
        <span class="hdl hdl-h" title="${T("grip")}">⠿ ⠿</span>
        <div class="actls"><span class="an" contenteditable spellcheck="false" data-edit="act-name" data-id="${a.id}">${esc(a.name)}</span>
        <button class="x-act" data-del-act="${a.id}" title="${T("removeAct")}">×</button></div></div>`;
    });
    h += `<div class="cell addact"><button class="addhdr" id="add-activity" title="${T("addActTitle")}">${T("addActivity")}</button></div>`;
    phases.forEach((p,pi)=>{
      const pc = "p"+(pi%6);
      h += `<div class="cell rail ${pc}" draggable="true" data-phase="${p.id}">
        <span class="hdl hdl-v" title="${T("grip")}">⠿</span>
        <span class="pn" contenteditable spellcheck="false" data-edit="ph-name" data-id="${p.id}">${esc(p.name)}</span>
        <span class="bar"></span>
        <span class="pg" contenteditable spellcheck="false" data-edit="ph-goal" data-id="${p.id}">${esc(p.goal||"")}</span>
        <button class="x-phase" data-del-phase="${p.id}" title="${T("removePhase")}">×</button></div>`;
      acts.forEach(a=>{
        const cards = state.stories.filter(s=>s.phase===p.id && s.activity===a.id);
        h += `<div class="cell stories ${pc}" data-drop-phase="${p.id}" data-drop-act="${a.id}">`;
        cards.forEach(s=>{ h += cardHtml(s); });
        h += `<button class="addcard" data-add="${p.id}|${a.id}">${T("addStory")}</button></div>`;
      });
      h += `<div class="cell fillp ${pc}" data-fill-phase="${p.id}"></div>`;
    });
    h += `<div class="cell addphase"><button class="addhdr" id="add-phase" title="${T("addPhaseTitle")}">${T("addPhase")}</button></div><div class="cell filler" style="grid-column:2 / -1"></div>`;
    map.innerHTML = h;
    wire();
    sc.scrollLeft = sl; sc.scrollTop = st;
    playFlip(prevRects);
    updateBulk();
  }

  function updateBulk(){
    [...sel].forEach(id=>{ if(!state.stories.some(s=>s.id===id)) sel.delete(id); });
    $("bulkbar").hidden = !(selMode || sel.size);
    $("bb-count").textContent = T("bbCount",sel.size);
    ["bb-status","bb-tag","bb-del"].forEach(id=>$(id).disabled = sel.size===0);
    $("selmode").classList.toggle("on",selMode);
    document.body.classList.toggle("selmode",selMode);
  }
  function toggleSel(id){ sel.has(id)?sel.delete(id):sel.add(id); render(); }

  function tagClass(t){ const i = state.tags.indexOf(t); return "t" + ((i<0?0:i)%6); }
  function tagPill(t){ return `<span class="tag ${tagClass(t)}"><span class="d"></span>${esc(t)}</span>`; }
  function cardHtml(s){
    const pills = s.tags.map(tagPill).join("");
    const on = sel.has(s.id);
    return `<div class="card st-${s.status}${on?" sel":""}" draggable="true" data-card="${s.id}">
      <div class="ctrls">
        <span class="grip" title="${T("grip")}">⠿</span>
        <button class="stbtn" data-status="${s.id}" title="${esc(T("stLabel")[s.status])}">●</button>
        <button data-tag="${s.id}" title="${T("tagTitle")}">⌗</button>
        <button data-del="${s.id}" title="${T("del")}">×</button>
      </div>
      <p contenteditable spellcheck="false" data-edit="card" data-id="${s.id}">${esc(s.text)}</p>
      ${pills?`<span class="tags">${pills}</span>`:""}
    </div>`;
  }
  function esc(t){ return String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

  // Live drag & drop — the real elements move in the DOM while dragging, so
  // cards, columns and rows slide out of the way; releasing commits DOM order
  // to state, Escape (or an invalid release) snaps everything back.
  let dragId=null, dragAct=null, dragPhase=null, dragFrom=null, dragDirty=false;
  const sel = new Set();   // multi-selected story ids (session-only, not exported)
  let selMode = false;     // toggled by the Select button: clicking a card selects it
  function editing(el){ const f=document.activeElement; return f && el.contains(f) && f.isContentEditable; }
  function clearDragState(){ dragId=dragAct=dragPhase=dragFrom=null; dragDirty=false; document.querySelectorAll(".dragging").forEach(c=>c.classList.remove("dragging")); }

  function liveMoveCard(cell,e){
    const el=document.querySelector(`.card[data-card="${dragId}"]`); if(!el) return;
    let ref=cell.querySelector(".addcard");
    for(const c of cell.querySelectorAll(".card")){
      if(c===el) continue;
      const r=c.getBoundingClientRect();
      if(e.clientY < r.top + r.height/2){ ref=c; break; }
    }
    if(ref===el || (el.parentElement===cell && el.nextElementSibling===ref)) return;
    withFlip(()=>cell.insertBefore(el,ref));
    dragDirty=true;
  }
  function liveMoveColumn(target,e){
    const map=$("map"), headers=[...map.querySelectorAll(".act")];
    const dragHeader=map.querySelector(`.act[data-act="${dragAct}"]`);
    if(!dragHeader||dragHeader===target) return;
    const r=target.getBoundingClientRect();
    const after = e.clientX > r.left + r.width/2;
    const ref = after ? headers[headers.indexOf(target)+1]||null : target;
    if(ref===dragHeader) return;
    if(!after && dragHeader.nextElementSibling===target) return;
    if(after && target.nextElementSibling===dragHeader) return;
    withFlip(()=>{
      map.insertBefore(dragHeader, ref || map.querySelector(".addact"));
      map.querySelectorAll(".rail[data-phase]").forEach(rail=>{
        const p=rail.dataset.phase;
        const cellDrag=map.querySelector(`.stories[data-drop-phase="${p}"][data-drop-act="${dragAct}"]`);
        const cellRef = ref ? map.querySelector(`.stories[data-drop-phase="${p}"][data-drop-act="${ref.dataset.act}"]`) : map.querySelector(`.fillp[data-fill-phase="${p}"]`);
        if(cellDrag&&cellRef) map.insertBefore(cellDrag,cellRef);
      });
    });
    dragDirty=true;
  }
  function rowNodes(id){
    const map=$("map");
    return [map.querySelector(`.rail[data-phase="${id}"]`), ...map.querySelectorAll(`.stories[data-drop-phase="${id}"]`), map.querySelector(`.fillp[data-fill-phase="${id}"]`)].filter(Boolean);
  }
  function liveMoveRow(target,e){
    const map=$("map"), rails=[...map.querySelectorAll(".rail")];
    const dragRail=map.querySelector(`.rail[data-phase="${dragPhase}"]`);
    if(!dragRail||dragRail===target) return;
    const r=target.getBoundingClientRect();
    const after = e.clientY > r.top + r.height/2;
    const ref = after ? rails[rails.indexOf(target)+1]||null : target;
    if(ref===dragRail) return;
    const nodes=rowNodes(dragPhase);
    const anchor = ref || map.querySelector(".addphase");
    if(nodes[nodes.length-1].nextElementSibling===anchor) return;
    withFlip(()=>nodes.forEach(n=>map.insertBefore(n,anchor)));
    dragDirty=true;
  }

  function commitStories(){
    const id=dragId, from=dragFrom;
    const order=[];
    document.querySelectorAll(".stories").forEach(cell=>{
      cell.querySelectorAll(".card").forEach(c=>{
        const s=state.stories.find(x=>x.id===c.dataset.card);
        if(s){ s.phase=cell.dataset.dropPhase; s.activity=cell.dataset.dropAct; order.push(s); }
      });
    });
    if(order.length===state.stories.length) state.stories=order;
    clearDragState(); save(); render();
    const moved=state.stories.find(x=>x.id===id);
    if(moved&&from) toast((moved.phase!==from.phase||moved.activity!==from.act) ? T("tMoved",(state.phases.find(p=>p.id===moved.phase)||{}).name||"") : T("tReordered"));
  }
  function commitActs(){
    const ids=[...document.querySelectorAll(".act")].map(el=>el.dataset.act);
    state.activities.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id));
    clearDragState(); save(); render(); toast(T("tActReordered"));
  }
  function commitPhases(){
    const ids=[...document.querySelectorAll(".rail")].map(el=>el.dataset.phase);
    state.phases.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id));
    clearDragState(); save(); render(); toast(T("tPhReordered"));
  }

  function wire(){
    // story cards
    document.querySelectorAll(".card").forEach(el=>{
      el.addEventListener("mousedown",e=>{ if(selMode||e.metaKey||e.ctrlKey) e.preventDefault(); });
      el.addEventListener("click",e=>{
        if(e.target.closest(".ctrls")) return;
        if(selMode||e.metaKey||e.ctrlKey){ e.preventDefault(); toggleSel(el.dataset.card); }
      });
      el.addEventListener("dragstart",e=>{
        if(selMode){ e.preventDefault(); return; }
        dragId=el.dataset.card; dragDirty=false;
        const s=state.stories.find(x=>x.id===dragId);
        dragFrom=s?{phase:s.phase,act:s.activity}:null;
        e.dataTransfer.effectAllowed="move"; e.dataTransfer.setData("text/plain",dragId);
        requestAnimationFrame(()=>el.classList.add("dragging"));
      });
      el.addEventListener("dragend",()=>{ const revert=dragDirty&&dragId; clearDragState(); if(revert) render(); });
    });
    document.querySelectorAll(".stories").forEach(cell=>{
      cell.addEventListener("dragover",e=>{ if(!dragId) return; e.preventDefault(); e.dataTransfer.dropEffect="move"; liveMoveCard(cell,e); });
    });
    // activities (columns) — the whole column slides while its header is dragged
    document.querySelectorAll(".act").forEach(el=>{
      el.addEventListener("dragstart",e=>{
        if(editing(el)){ e.preventDefault(); return; }
        dragAct=el.dataset.act; dragDirty=false;
        e.dataTransfer.effectAllowed="move"; e.dataTransfer.setData("text/plain","act:"+dragAct);
        requestAnimationFrame(()=>el.classList.add("dragging"));
      });
      el.addEventListener("dragend",()=>{ const revert=dragDirty&&dragAct; clearDragState(); if(revert) render(); });
      el.addEventListener("dragover",e=>{ if(!dragAct) return; e.preventDefault(); e.dataTransfer.dropEffect="move"; liveMoveColumn(el,e); });
    });
    // phases (rows) — the whole row slides while its rail is dragged
    document.querySelectorAll(".rail").forEach(el=>{
      el.addEventListener("dragstart",e=>{
        if(editing(el)){ e.preventDefault(); return; }
        dragPhase=el.dataset.phase; dragDirty=false;
        e.dataTransfer.effectAllowed="move"; e.dataTransfer.setData("text/plain","phase:"+dragPhase);
        requestAnimationFrame(()=>el.classList.add("dragging"));
      });
      el.addEventListener("dragend",()=>{ const revert=dragDirty&&dragPhase; clearDragState(); if(revert) render(); });
      el.addEventListener("dragover",e=>{ if(!dragPhase) return; e.preventDefault(); e.dataTransfer.dropEffect="move"; liveMoveRow(el,e); });
    });
    // inline edits
    document.querySelectorAll("[data-edit]").forEach(el=>{
      el.addEventListener("blur",()=>commitEdit(el));
      el.addEventListener("keydown",e=>{ if(e.key==="Enter" && el.dataset.edit!=="card"){ e.preventDefault(); el.blur(); } if(e.key==="Escape"){ render(); } });
    });
    $("title").onblur=()=>{ state.title=$("title").textContent.trim(); save(); };
    // buttons
    document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{ const [ph,ac]=b.dataset.add.split("|"); const id=uid("s"); state.stories.push({id:id,activity:ac,phase:ph,text:T("newStory"),tags:[]}); save(); render(); focusCard(id); });
    document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ state.stories=state.stories.filter(s=>s.id!==b.dataset.del); save(); render(); });
    document.querySelectorAll("[data-status]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); openStMenu(b,b.dataset.status); });
    document.querySelectorAll("[data-tag]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); openTagMenu(b,b.dataset.tag); });
    document.querySelectorAll("[data-del-phase]").forEach(b=>b.onclick=()=>{
      const id=b.dataset.delPhase;
      if(state.stories.some(s=>s.phase===id)) armConfirm(b,()=>delPhase(id)); else delPhase(id);
    });
    document.querySelectorAll("[data-del-act]").forEach(b=>b.onclick=()=>{
      const id=b.dataset.delAct;
      if(state.stories.some(s=>s.activity===id)) armConfirm(b,()=>delAct(id)); else delAct(id);
    });
    $("add-phase").onclick=()=>{ state.phases.push({id:uid("ph"),name:T("newPhaseName",state.phases.length+1),goal:T("newPhaseGoal")}); save(); render(); };
    $("add-activity").onclick=()=>{ state.activities.push({id:uid("a"),name:T("newActName")}); save(); render(); };
  }
  function commitEdit(el){
    const v=el.textContent.trim(), id=el.dataset.id, t=el.dataset.edit;
    if(t==="card"){ const s=state.stories.find(x=>x.id===id); if(s){ if(!v){ state.stories=state.stories.filter(x=>x.id!==id); render(); } else s.text=v; } }
    else if(t==="act-name"){ setField(state.activities,id,"name",v||"Activity"); }
    else if(t==="ph-name"){ setField(state.phases,id,"name",v||"Phase"); }
    else if(t==="ph-goal"){ setField(state.phases,id,"goal",v); }
    save();
  }
  function setField(arr,id,k,v){ const o=arr.find(x=>x.id===id); if(o)o[k]=v; }
  // sandboxed iframes swallow confirm(), so destructive buttons arm on first
  // click (turn red, "click again to confirm") and act on the second
  function armConfirm(btn,fn){
    if(btn.dataset.armed){ delete btn.dataset.armed; btn.classList.remove("armed"); fn(); return; }
    btn.dataset.armed="1"; btn.classList.add("armed"); btn.title=T("confirmHint");
    toast(T("confirmHint"));
    setTimeout(()=>{ if(document.contains(btn)){ delete btn.dataset.armed; btn.classList.remove("armed"); } },2500);
  }
  function focusCard(id){
    // focus the card that was just added, in place — never scroll the page
    const el=document.querySelector(`.card p[data-id="${id}"]`);
    if(el){ el.focus({preventScroll:true}); document.getSelection().selectAllChildren(el); }
  }

  // status menu — dropdown picker; sid null = apply to the multi-selection
  const stmenu=$("stmenu"); let stStory=null;
  function stTargets(){ return stStory ? state.stories.filter(x=>x.id===stStory) : state.stories.filter(x=>sel.has(x.id)); }
  function openStMenu(btn,sid){
    stStory=sid; renderStMenu();
    if(stmenu.hidden) stmenu.hidden=false;
    const r=btn.getBoundingClientRect();
    stmenu.style.left=Math.max(8,Math.min(r.left,innerWidth-158))+"px";
    const below=r.bottom+6;
    stmenu.style.top=Math.max(8,(below+stmenu.offsetHeight>innerHeight-8) ? r.top-stmenu.offsetHeight-6 : below)+"px";
  }
  function renderStMenu(){
    const ts=stTargets();
    if(!ts.length){ stmenu.hidden=true; return; }
    const common = ts.every(x=>x.status===ts[0].status) ? ts[0].status : null;
    $("st-list").innerHTML=STATUSES.map(st=>`<button class="st-opt st-${st}${common===st?" on":""}" data-st="${st}"><span class="sw"></span>${esc(T("stLabel")[st])}${common===st?'<span class="ck">✓</span>':""}</button>`).join("");
    $("st-list").querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{ ts.forEach(x=>x.status=b.dataset.st); stmenu.hidden=true; save(); render(); });
  }
  document.addEventListener("pointerdown",e=>{ if(!stmenu.hidden && !stmenu.contains(e.target) && !e.target.closest("[data-status]")) stmenu.hidden=true; });

  // tag menu — tags are cross-cutting themes; sid null = apply to the multi-selection
  const tagmenu=$("tagmenu"); let tagStory=null;
  function tagTargets(){ return tagStory ? state.stories.filter(x=>x.id===tagStory) : state.stories.filter(x=>sel.has(x.id)); }
  function openTagMenu(btn,sid){
    tagStory=sid; renderTagMenu();
    showTagField(false);   // every opening starts as a picker, not a form
    if(tagmenu.hidden) tagmenu.hidden=false;
    const r=btn.getBoundingClientRect();
    tagmenu.style.left=Math.max(8,Math.min(r.left,innerWidth-218))+"px";
    const below=r.bottom+6;
    tagmenu.style.top=Math.max(8,(below+tagmenu.offsetHeight>innerHeight-8) ? r.top-tagmenu.offsetHeight-6 : below)+"px";
  }
  function renderTagMenu(){
    const ts=tagTargets();
    if(!ts.length){ tagmenu.hidden=true; return; }
    const allHave=t=>ts.every(s=>s.tags.includes(t));
    const list=$("tm-list");
    list.innerHTML = state.tags.length
      ? state.tags.map(t=>`<div class="tm-row">
          <label><input type="checkbox" data-tg="${esc(t)}" ${allHave(t)?"checked":""}>${tagPill(t)}</label>
          <button class="tm-del" data-tx="${esc(t)}" title="${T("delTagEverywhere")}" aria-label="${T("delTagEverywhere")}"><svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8a1 1 0 0 0 1 .9h3.8a1 1 0 0 0 1-.9l.6-8"/><path d="M6.8 7v4M9.2 7v4"/></svg></button></div>`).join("")
      : `<div class="tm-empty">${T("tmEmpty")}</div>`;
    list.querySelectorAll("[data-tg]").forEach(cb=>cb.onchange=()=>{
      const t=cb.dataset.tg;
      if(cb.checked){ ts.forEach(s=>{ if(!s.tags.includes(t)) s.tags.push(t); }); }
      else { ts.forEach(s=>{ s.tags=s.tags.filter(x=>x!==t); }); }
      save(); render(); renderTagMenu();
    });
    list.querySelectorAll("[data-tx]").forEach(b=>b.onclick=()=>{
      const t=b.dataset.tx;
      armConfirm(b,()=>{
        state.tags=state.tags.filter(x=>x!==t);
        state.stories.forEach(st=>st.tags=st.tags.filter(x=>x!==t));
        save(); render(); renderTagMenu();
      });
    });
  }
  function showTagField(on){
    $("tm-form").hidden=!on; $("tm-open").hidden=on;
    if(on) $("tm-new").focus({preventScroll:true}); else $("tm-new").value="";
  }
  $("tm-open").onclick=()=>showTagField(true);
  $("tm-cancel").onclick=()=>showTagField(false);
  $("tm-new").onkeydown=e=>{ if(e.key==="Escape"){ e.stopPropagation(); showTagField(false); } };
  $("tm-form").onsubmit=e=>{
    e.preventDefault();
    const v=$("tm-new").value.trim(); if(!v) return;
    if(!state.tags.includes(v)) state.tags.push(v);
    tagTargets().forEach(s=>{ if(!s.tags.includes(v)) s.tags.push(v); });
    // Still open, still focused: tags come in twos and threes.
    $("tm-new").value=""; save(); render(); renderTagMenu();
    $("tm-new").focus({preventScroll:true});
  };
  document.addEventListener("pointerdown",e=>{ if(!tagmenu.hidden && !tagmenu.contains(e.target) && !e.target.closest("[data-tag]")) tagmenu.hidden=true; });

  function delPhase(id){
    state.phases=state.phases.filter(p=>p.id!==id); state.stories=state.stories.filter(s=>s.phase!==id); save(); render();
  }
  function delAct(id){
    state.activities=state.activities.filter(a=>a.id!==id); state.stories=state.stories.filter(s=>s.activity!==id); save(); render();
  }
  // release anywhere commits the current live-preview arrangement
  document.addEventListener("dragover",e=>{ if((dragId||dragAct||dragPhase)&&dragDirty){ e.preventDefault(); e.dataTransfer.dropEffect="move"; } });
  document.addEventListener("drop",e=>{
    if(dragId){ e.preventDefault(); dragDirty?commitStories():clearDragState(); }
    else if(dragAct){ e.preventDefault(); dragDirty?commitActs():clearDragState(); }
    else if(dragPhase){ e.preventDefault(); dragDirty?commitPhases():clearDragState(); }
  });

  // bulk actions on the multi-selection
  $("selmode").onclick=()=>{ selMode=!selMode; if(!selMode) sel.clear(); render(); };
  $("bb-clear").onclick=()=>{ sel.clear(); selMode=false; render(); };
  $("bb-del").onclick=()=>armConfirm($("bb-del"),()=>{ state.stories=state.stories.filter(s=>!sel.has(s.id)); sel.clear(); save(); render(); });
  $("bb-status").onclick=e=>{ e.stopPropagation(); openStMenu($("bb-status"),null); };
  $("bb-tag").onclick=e=>{ e.stopPropagation(); openTagMenu($("bb-tag"),null); };
  document.addEventListener("keydown",e=>{
    if(e.key==="Escape" && (sel.size||selMode) && !(document.activeElement&&document.activeElement.isContentEditable)){ sel.clear(); selMode=false; render(); }
  });

  VSShell.onLang(l=>{
    if(lang===l || !I18N[l]) return;
    lang=l;
    applyLang(); render(); if(!tagmenu.hidden) renderTagMenu();
  });

  // import / export
  const io=$("io");
  function copyJSON(){ const t=JSON.stringify(state,null,2); (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast(T("tCopied"))).catch(()=>{ openIO(T("ioCopy"),t,true); }); }
  $("copy").onclick=()=>{ $("export-menu").hidden=true; copyJSON(); };
  $("export").onclick=()=>{ BRIDGE ? sendToClaude() : copyJSON(); };
  $("export-more").onclick=e=>{ e.stopPropagation(); $("export-menu").hidden=!$("export-menu").hidden; };
  /* Signing off ends the map for everyone, so it asks once — the same second
     click the workspace asks for, and the same four seconds to change your
     mind. Nothing to sign off to without a session, so it only exists linked. */
  $("approve").onclick=()=>{
    if(!approveArmed){
      approveArmed=setTimeout(()=>{ approveArmed=null; $("approve").classList.remove("armed"); applyChrome(); },4000);
      $("approve").classList.add("armed"); applyChrome();
      return;
    }
    clearTimeout(approveArmed); approveArmed=null;
    $("approve").classList.remove("armed");
    $("export-menu").hidden=true;
    approveMap();
  };
  document.addEventListener("pointerdown",e=>{ if(!$("export-menu").hidden && !e.target.closest(".split")) $("export-menu").hidden=true; });
  // ⌘⏎ sends, the way it does in the workspace — the chip on the button is
  // only honest if the key works.
  document.addEventListener("keydown",e=>{
    if((e.metaKey||e.ctrlKey) && e.key==="Enter"){ e.preventDefault(); BRIDGE ? sendToClaude() : copyJSON(); }
  });
  function openIO(title,text,readonly){ $("io-title").textContent=title; $("io-text").value=text; $("io-text").readOnly=!!readonly; $("io-ok").style.display=readonly?"none":""; io.showModal(); }
  $("io-cancel").onclick=()=>io.close();
  $("io-ok").onclick=()=>{ try{ const o=JSON.parse($("io-text").value); if(!o.activities||!o.phases||!o.stories) throw 0; state=normalize(o); save(); render(); io.close(); toast(T("tLoaded")); }catch(e){ toast(T("badJson")); } };

  // ---- live link back to the Claude session (only under json-bridge.mjs) ----
  // Send: POST the state; the server writes the JSON and bumps a counter the
  // session is waiting on. Receive: SSE tells us Claude rewrote the file — we
  // offer it rather than applying it, so an in-progress re-slice isn't clobbered.
  let pending=null, sending=false, approved=false;
  function setLink(up){
    if(!BRIDGE){ VSShell.hideLink(); return; }
    VSShell.setLink(up,{on:T("linkOn"),off:T("linkOff"),offTitle:T("linkOffTitle"),
      idle:T("linkIdle"),idleTitle:T("linkIdleTitle")}, BRIDGE ? BRIDGE.watching : undefined);
  }
  function sendToClaude(){
    if(sending) return;
    sending=true; $("export").disabled=true;
    fetch(BRIDGE.save,{method:"POST",headers:{"Content-Type":"application/json","X-VSTACK-Token":BRIDGE.token},body:JSON.stringify(state,null,2)})
      .then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(()=>{ linkUp=true; setLink(true); toast(T("tSent")); })
      .catch(()=>{ linkUp=false; setLink(false); toast(T("tSendFail")); openIO(T("ioCopy"),JSON.stringify(state,null,2),true); })
      .then(()=>{ sending=false; $("export").disabled=false; });
  }
  /* Sign-off sends the map one last time, then says it is settled. Saving first
     matters: approving an arrangement the session never received would sign off
     something nobody else has. */
  function approveMap(){
    if(!BRIDGE) return;
    const post=(path,body)=>fetch(path,{method:"POST",headers:{"Content-Type":"application/json","X-VSTACK-Token":BRIDGE.token},body:body})
      .then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); });
    post(BRIDGE.save,JSON.stringify(state,null,2))
      .then(()=>post(BRIDGE.approve,JSON.stringify({note:"approved from the story map"})))
      .then(()=>{ approved=true; linkUp=false; setLink(false); $("export").disabled=true; toast(T("tApproved")); })
      .catch(()=>toast(T("tApproveFail")));
  }
  $("pb-apply").onclick=()=>{ if(pending){ state=normalize(pending); pending=null; sel.clear(); save(); render(); toast(T("tLoaded")); } $("pushbar").hidden=true; };
  $("pb-dismiss").onclick=()=>{ pending=null; $("pushbar").hidden=true; };
  if(BRIDGE && typeof EventSource!=="undefined"){
    const es=new EventSource(BRIDGE.events+"?t="+encodeURIComponent(BRIDGE.token));
    es.onopen=()=>{ linkUp=true; setLink(true); };
    // Who is listening, said by the server rather than guessed from the socket.
    es.addEventListener("presence",e=>{ try{ VSShell.setWatching(JSON.parse(e.data).watching); }catch(err){} });
    es.onerror=()=>{ linkUp=false; setLink(false); };   // EventSource retries on its own
    es.addEventListener("push",e=>{
      let o=null; try{ o=JSON.parse(e.data); }catch(err){ return; }
      if(!o||!o.activities||!o.phases||!o.stories) return;
      pending=o; $("pushbar").hidden=false;
    });
  }
  $("copy").hidden = !BRIDGE;   // primary button is Send when linked, Copy when not
  // Nothing in the menu applies without a session to say it to, so the caret
  // that opens it goes too rather than opening an empty box.
  $("export-more").hidden = !BRIDGE;

  /* Bridged, the JSON file on disk is the map and the page is just its editor,
     so boot from /doc — never from localStorage, which would quietly resurrect
     an older arrangement over the one Claude is holding. Off disk there is no
     doc to fetch: the inline block is the map, and localStorage carries the
     user's edits between openings. */
  (async function boot(){
    if(BRIDGE){
      try{
        const r = await fetch(BRIDGE.doc+"?t="+encodeURIComponent(BRIDGE.token));
        const o = await r.json();
        if(o && o.activities && o.phases && o.stories) state = normalize(o);
      }catch(e){ /* keep the inline fallback and let the link dot show the truth */ }
    } else {
      const saved = load();
      if(saved) state = normalize(saved);
    }
    KEY = keyFor(state);
    // Served, the template is unfilled — the tab takes its name from the map.
    if(BRIDGE && state.title) document.title = state.title + " · Visual Stack";
    // A map authored in Chinese opens in Chinese the first time, then the
    // reader's own choice sticks.
    VSShell.init({ name: T("eyebrow"), defaultLang: state.lang || raw.lang });
    lang = VSShell.lang;
    applyLang();
    render();
  })();
})();
</script>
