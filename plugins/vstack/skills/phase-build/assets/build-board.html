<title>Phase build · Visual Stack</title>
<style>
/* vstack:shell tokens */
/* One palette for every vstack page. Roles, not colours: a page asks for
   --surface, not for white, so light and dark are the same stylesheet.

   Page-specific hues (the story map's phase bands, the board's new/have/touch,
   the spec's priorities) stay in the page, below this block — they mean
   something only there. Everything here is shared, and is the reason a board
   and a spec look like the same product.

   Three states, in this order: the OS preference, then an explicit choice.
   `data-theme` absent means auto. */
:root{
  --paper:#eef0f3; --surface:#ffffff; --surface-2:#f7f8fa;
  --ink:#16171c; --ink-2:#43454d; --ink-3:#71737c;
  --line:#e2e4e9; --line-2:#d0d2d9;
  --brand:#d23b2e; --brand-soft:#fdefed; --brand-line:#f3b3ac;
  --ok:#10876e; --ok-soft:#e9f9f2;
  --shadow:0 1px 2px rgba(16,17,22,.06);
  --shadow-pop:0 1px 2px rgba(16,17,22,.06),0 8px 24px rgba(16,17,22,.10);
  --window-shadow:0 2px 6px rgba(16,17,22,.10),0 18px 48px rgba(16,17,22,.16);
  --radius:9px;
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0e0f12; --surface:#17191e; --surface-2:#1d1f25;
  --ink:#f1f2f4; --ink-2:#bcbfc7; --ink-3:#8b8e97;
  --line:#282a31; --line-2:#363942;
  --brand:#f0685c; --brand-soft:rgba(240,104,92,.14); --brand-line:rgba(240,104,92,.38);
  --ok:#2fb89b; --ok-soft:rgba(47,184,155,.14);
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-pop:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.5);
  --window-shadow:0 2px 6px rgba(0,0,0,.5),0 18px 48px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme=light]{
  --paper:#eef0f3; --surface:#ffffff; --surface-2:#f7f8fa;
  --ink:#16171c; --ink-2:#43454d; --ink-3:#71737c;
  --line:#e2e4e9; --line-2:#d0d2d9;
  --brand:#d23b2e; --brand-soft:#fdefed; --brand-line:#f3b3ac;
  --ok:#10876e; --ok-soft:#e9f9f2;
  --shadow:0 1px 2px rgba(16,17,22,.06);
  --shadow-pop:0 1px 2px rgba(16,17,22,.06),0 8px 24px rgba(16,17,22,.10);
  --window-shadow:0 2px 6px rgba(16,17,22,.10),0 18px 48px rgba(16,17,22,.16);
  color-scheme:light;
}
:root[data-theme=dark]{
  --paper:#0e0f12; --surface:#17191e; --surface-2:#1d1f25;
  --ink:#f1f2f4; --ink-2:#bcbfc7; --ink-3:#8b8e97;
  --line:#282a31; --line-2:#363942;
  --brand:#f0685c; --brand-soft:rgba(240,104,92,.14); --brand-line:rgba(240,104,92,.38);
  --ok:#2fb89b; --ok-soft:rgba(47,184,155,.14);
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-pop:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.5);
  --window-shadow:0 2px 6px rgba(0,0,0,.5),0 18px 48px rgba(0,0,0,.6);
  color-scheme:dark;
}
/* /vstack:shell tokens */
  :root{
    /* what the board colours mean — its own vocabulary, on the shared palette */
    --keep:#10876e; --new:#d23b2e; --have:#71737c; --touch:#b0761a; --fail:#c22f4d;
  }
  @media (prefers-color-scheme:dark){:root{
    --keep:#2fb89b; --new:#f0685c; --have:#8b8e97; --touch:#d29a3f; --fail:#e05575;
  }}
  :root[data-theme="light"]{--keep:#10876e;--new:#d23b2e;--have:#71737c;--touch:#b0761a;--fail:#c22f4d}
  :root[data-theme="dark"]{--keep:#2fb89b;--new:#f0685c;--have:#8b8e97;--touch:#d29a3f;--fail:#e05575}

  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:var(--font);
    font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px}

  #app{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;min-height:100vh}

/* vstack:shell css */
/* The chrome every vstack page wears: the top bar and the controls that sit in
   it. Page layout stays in the page — some of these are app shells that fill
   the viewport, some are documents that scroll — but the bar, the buttons and
   the segmented controls are the same object everywhere. */
/* The shell hides its own controls with `hidden` — the link dot when there is
   no link, the primary action on a page that doesn't send. A class that sets
   `display` outranks the browser's default [hidden] rule, and .btn/.linkdot
   both do, so state this here rather than trusting each page's reset. */
[hidden]{display:none!important}
.vs-topbar{display:flex;align-items:center;gap:10px;padding:0 12px;height:46px;
  background:var(--surface);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:40}
.vs-topbar .brand{display:flex;align-items:center;gap:8px;min-width:0}
.vslink{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:inherit}
.vsmark{width:15px;height:15px;flex:none;color:var(--ink)}
.vslink:hover .vsmark{opacity:.8}
.brand .ws{font:700 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);white-space:nowrap}
.brand b{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:280px}
.brand .eyebrow{font:600 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);white-space:nowrap}
.spacer{flex:1}
.sep{width:1px;height:20px;background:var(--line);flex:none}

/* buttons — one shape, three sizes of intent */
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:7px;
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:550;
  white-space:nowrap;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.primary[disabled]{opacity:.45;cursor:default;filter:none;pointer-events:none}
.btn[disabled]{opacity:.45;cursor:default;pointer-events:none}
.btn.sm{height:25px;padding:0 9px;font-size:11.5px}

/* segmented control — modes, sizes, language, theme */
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden;
  background:var(--surface);flex:none}
.seg button{height:30px;padding:0 12px;font-weight:550;color:var(--ink-2);display:inline-flex;
  align-items:center;gap:6px;border:0;border-right:1px solid var(--line-2);background:none;
  cursor:pointer;font:inherit;font-weight:550}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--surface-2)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--surface)}
.seg.sm button{height:25px;padding:0 9px;font-size:11.5px}
#langSwitch button,#themeSwitch button{padding:0 9px;font-size:11.5px;font-weight:600}
#themeSwitch button{padding:0 8px}
#themeSwitch svg{width:13px;height:13px;display:block}

/* the live link, stated rather than implied */
.linkdot{display:inline-flex;align-items:center;gap:6px;font:600 10.5px/1 var(--mono);
  letter-spacing:.03em;color:var(--ink-3);white-space:nowrap}
.linkdot::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink-3);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--ink-3) 18%,transparent)}
.linkdot.on{color:var(--ok)}
.linkdot.on::before{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}

/* floating banners — the page talking back, never blocking the work */
.banner{position:fixed;left:50%;top:58px;transform:translateX(-50%);z-index:38;display:none;
  align-items:center;gap:10px;padding:8px 10px 8px 14px;border-radius:10px;box-shadow:var(--shadow-pop);
  font-size:12.5px;white-space:nowrap;max-width:calc(100% - 24px)}
.banner.on{display:flex}
.banner.dark{background:var(--ink);color:var(--surface)}
.banner.dark .btn{background:color-mix(in srgb,var(--surface) 16%,transparent);
  border-color:transparent;color:var(--surface)}
.banner.dark .btn:hover{background:color-mix(in srgb,var(--surface) 28%,transparent)}
.banner.good{background:var(--ok-soft);border:1px solid var(--ok);color:var(--ink)}
.banner.good .tick{color:var(--ok);font-weight:700}

@media (max-width:720px){
  .brand .ws,.brand .eyebrow{display:none}
  .vs-topbar{gap:8px;padding:0 8px}
}
/* /vstack:shell css */

  /* the board's subject tabs carry counts */
  .seg .c{font-family:var(--mono);font-size:.62rem;opacity:.7}

  /* ── legend strip ── */
  #legend{display:flex;align-items:center;gap:1.1rem;padding:.5rem 1rem;background:var(--surface-2);
    border-bottom:1px solid var(--line);flex-wrap:wrap}
  .key{display:inline-flex;align-items:center;gap:.4rem;font-size:.78rem;color:var(--ink-2)}
  .key .sw{width:11px;height:11px;border-radius:3px;flex:none}
  .key.n .sw{background:var(--new)} .key.h .sw{background:var(--have);opacity:.45}
  .key.t .sw{background:var(--touch)}
  .key.d .sw{background:var(--keep)} .key.f .sw{background:var(--fail)}
  .key b{font-weight:650;color:var(--ink)}
  .src{margin-left:auto;font-family:var(--mono);font-size:.68rem;color:var(--ink-3);display:flex;align-items:center;gap:.4rem}

  /* ── progress strip (visible once a build starts) ── */
  #progress{display:flex;align-items:center;gap:1rem;padding:.45rem 1rem;background:var(--surface);
    border-bottom:1px solid var(--line);font-size:.8rem}
  #progress .pb{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
  #progress .pb i{display:block;height:100%;background:var(--keep);border-radius:99px;transition:width .4s}
  #progress .pb i.active{background:repeating-linear-gradient(45deg,var(--keep),var(--keep) 8px,
    color-mix(in srgb,var(--keep) 70%,var(--surface)) 8px,color-mix(in srgb,var(--keep) 70%,var(--surface)) 16px);
    animation:vsmarch 1s linear infinite;background-size:23px 100%}
  @keyframes vsmarch{to{background-position:23px 0}}
  #progress .n{font-family:var(--mono);font-size:.72rem;color:var(--ink-2);white-space:nowrap}

  /* ── canvas ── */
  #stage{position:relative;overflow:auto;background:var(--surface-2);
    background-image:radial-gradient(circle at 1px 1px,var(--line-2) 1px,transparent 0);background-size:22px 22px}
  #plane{position:relative;min-width:100%;min-height:100%}
  svg#edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  svg#edges path{fill:none;stroke:var(--line-2);stroke-width:1.5}
  svg#edges path.have{stroke-dasharray:3 4;opacity:.6}

  .node{position:absolute;background:var(--surface);border:1px solid var(--line-2);
    border-left:3px solid var(--c);border-radius:8px;box-shadow:var(--shadow);padding:.42rem .6rem;
    max-width:230px;display:grid;gap:.12rem;cursor:grab}
  .node:hover{border-color:color-mix(in srgb,var(--c) 55%,var(--line-2))}
  .node.new{--c:var(--new)}
  .node.have{--c:var(--have);opacity:.55;background:var(--surface-2);box-shadow:none}
  .node.have:hover{opacity:.9}
  .node.touch{--c:var(--touch)}
  .node .t{font-size:.83rem;font-weight:620;line-height:1.3;outline:0}
  .node.mono .t{font-family:var(--mono);font-size:.76rem}
  .node .k{font-family:var(--mono);font-size:.55rem;letter-spacing:.09em;text-transform:uppercase;
    font-weight:700;color:var(--c);display:flex;align-items:center;gap:.35rem}
  .node .k .st{margin-left:auto;font-size:.5rem;opacity:.85}
  .node .ctrls{position:absolute;top:-9px;right:-6px;display:none;gap:2px}
  .node:hover .ctrls{display:flex}
  .node .ctrls button{width:19px;height:19px;border-radius:5px;border:1px solid var(--line-2);
    background:var(--surface);font-size:.66rem;line-height:1;color:var(--ink-3);display:grid;place-items:center;
    box-shadow:var(--shadow)}
  .node .ctrls button:hover{background:var(--brand);border-color:var(--brand);color:#fff}
  .node.drop{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,var(--surface))}

  /* build status paints over the plan colours */
  .node .badge{position:absolute;top:-8px;left:-8px;width:18px;height:18px;border-radius:50%;
    display:grid;place-items:center;font-size:.6rem;font-weight:800;color:#fff;box-shadow:var(--shadow)}
  .node.s-building{border-color:var(--keep);
    animation:vspulse 1.2s ease-in-out infinite}
  @keyframes vspulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--keep) 45%,transparent)}
    50%{box-shadow:0 0 0 6px transparent}}
  .node.s-building .badge{background:var(--keep)}
  .node.s-done{opacity:1;background:color-mix(in srgb,var(--keep) 7%,var(--surface))}
  .node.s-done .badge{background:var(--keep)}
  .node.s-failed{border-color:var(--fail);background:color-mix(in srgb,var(--fail) 8%,var(--surface))}
  .node.s-failed .badge{background:var(--fail)}

  /* ── footer bar ── */
  #go{position:sticky;bottom:0;display:flex;align-items:center;gap:.7rem;padding:.6rem 1rem;
    background:var(--surface);border-top:1px solid var(--line)}
  #go .sum{font-size:.82rem;color:var(--ink-2)}
  #go .sum b{color:var(--ink);font-weight:700}
  #go .spacer{flex:1}

  /* refresh offer, only shown when the user has unsent edits */
  #refreshBar{display:flex;align-items:center;gap:.7rem;padding:.45rem 1rem;
    background:color-mix(in srgb,var(--keep) 10%,var(--surface));
    border-bottom:1px solid color-mix(in srgb,var(--keep) 30%,var(--line));font-size:.82rem}
  #refreshBar b{color:var(--keep)}
  #refreshBar .btn{height:24px;padding:0 9px;font-size:.74rem}
</style>

<script>
/* vstack:shell js */
/* The behaviour behind the top bar: theme, language, the link dot, and the
   page's own name. Everything else — what the page does — is the page's.

   Nothing here touches the network or the document beyond the bar, so a page
   works identically served, opened off disk, or published as an Artifact. */
window.VSShell = (function () {
  const $ = s => document.querySelector(s);
  const KEY = { theme: 'vstack:theme', lang: 'vstack:lang' };
  const store = {
    get (k, d) { try { return localStorage.getItem(k) ?? d } catch { return d } },
    set (k, v) { try { localStorage.setItem(k, v) } catch {} },
  };

  /* ── theme: auto (whatever the OS says) / light / dark ──
     Auto is the absence of an override, so the page keeps following the system
     if it changes while open — and an Artifact viewer's own toggle still wins
     the same way it does on a page that never had this control. */
  let theme = store.get(KEY.theme, 'auto');
  function applyTheme () {
    if (theme === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', theme);
    document.querySelectorAll('#themeSwitch button').forEach(b => {
      b.setAttribute('aria-pressed', String(b.dataset.themeSet === theme));
    });
  }
  function setTheme (next) {
    theme = ['auto', 'light', 'dark'].includes(next) ? next : 'auto';
    store.set(KEY.theme, theme);
    applyTheme();
  }

  /* ── language: chrome only. Page content stays as authored. ── */
  const storedLang = store.get(KEY.lang, null);
  let lang = storedLang === 'zh' ? 'zh' : 'en';
  const langListeners = [];
  function applyLang () {
    // zh-CN, not zh: the specific tag is what picks the right font and
    // line-breaking for simplified Chinese.
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    document.querySelectorAll('#langSwitch button').forEach(b => {
      b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
    });
    langListeners.forEach(fn => { try { fn(lang) } catch {} });
  }
  function setLang (next) {
    lang = next === 'zh' ? 'zh' : 'en';
    store.set(KEY.lang, lang);
    applyLang();
  }

  /* ── the live link, said out loud ── */
  function setLink (up, labels) {
    const el = $('#linkDot');
    if (!el) return;
    el.hidden = false;
    el.classList.toggle('on', !!up);
    el.textContent = up ? (labels?.on ?? 'LINKED TO CLAUDE') : (labels?.off ?? 'LINK LOST');
    el.title = up ? '' : (labels?.offTitle ?? '');
  }
  const hideLink = () => { const el = $('#linkDot'); if (el) el.hidden = true };

  function name (pageName, eyebrow) {
    const n = $('#pageName'); const e = $('#pageEyebrow');
    if (n && pageName != null) n.textContent = pageName;
    if (e && eyebrow != null) e.textContent = eyebrow;
  }

  function init (opts = {}) {
    document.querySelectorAll('#themeSwitch button').forEach(b => {
      b.addEventListener('click', () => setTheme(b.dataset.themeSet));
    });
    document.querySelectorAll('#langSwitch button').forEach(b => {
      b.addEventListener('click', () => setLang(b.dataset.lang));
    });
    if (opts.onLang) langListeners.push(opts.onLang);
    // `defaultLang` is what the artifact was authored in — it opens that way
    // once, and after that the reader's own choice is the one that sticks.
    if (opts.defaultLang && !storedLang) lang = opts.defaultLang === 'zh' ? 'zh' : 'en';
    if (opts.lang) { lang = opts.lang === 'zh' ? 'zh' : 'en'; store.set(KEY.lang, lang) }
    // Not every page sends something back — the form doesn't — so the primary
    // action stays out of the bar unless a page asks for it.
    const send = $('#send');
    if (send && opts.send) send.hidden = false;
    name(opts.name, opts.eyebrow);
    applyTheme();
    applyLang();
    return api;
  }

  const api = {
    init, setTheme, setLang, setLink, hideLink, name,
    get theme () { return theme },
    get lang () { return lang },
    onLang (fn) { langListeners.push(fn) },
  };
  return api;
})();

/* ── the scrubber ──
   An ordered set of states and a handle that moves between them: versions on
   the spec and the review workspace, release phases on phase-wireframe. The
   page says what the stops are and what showing one does; this owns the track,
   the ticks, the drag, and the caption.

     VSScrub.mount({ onPick: id => showThat(id) })
     VSScrub.set({ items: [{ id, cap, label, sub }], active: id })

   `cap` is the label under the tick (v3, P2), `label` names the stop, and
   `sub` is the line beneath it — both are escaped here, so a page never has to
   remember to. */
window.VSScrub = (function () {
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  let items = [];
  let active = null;
  let onPick = () => {};
  let wired = false;

  const index = () => Math.max(0, items.findIndex(i => i.id === active));
  const pct = i => items.length < 2 ? 100 : (i / (items.length - 1)) * 100;

  function pickAt (clientX) {
    const track = $('#tlTrack');
    if (!track || !items.length) return null;
    const r = track.getBoundingClientRect();
    return items[Math.round(clamp((clientX - r.left) / r.width, 0, 1) * (items.length - 1))]?.id;
  }
  function pick (id) {
    if (id == null || id === active) return;
    active = id;
    paint();
    onPick(id);
  }
  const step = d => { const n = items[index() + d]; if (n) pick(n.id) };

  function paint () {
    const track = $('#tlTrack');
    if (!track) return;
    const i = index();
    track.querySelectorAll('.tick').forEach(t => t.remove());
    items.forEach((it, k) => {
      const t = document.createElement('div');
      t.className = 'tick' + (k <= i ? ' past' : '');
      t.style.left = pct(k) + '%';
      t.innerHTML = `<span class="cap">${esc(it.cap)}</span>`;
      if (it.label) t.title = it.label;
      t.onclick = e => { e.stopPropagation(); pick(it.id) };
      track.appendChild(t);
    });
    $('#tlHandle').style.left = pct(i) + '%';
    $('#tlFill').style.width = pct(i) + '%';
    const cur = items[i];
    $('#tlMeta').innerHTML = cur
      ? `<div class="row"><b>${esc(cur.cap)}</b> <span class="lab">${esc(cur.label)}</span></div>` +
        `<div class="row">${esc(cur.sub)}</div>`
      : '';
    $('#tlPrev').disabled = i === 0;
    $('#tlNext').disabled = i >= items.length - 1;
  }

  function mount (opts = {}) {
    if (opts.onPick) onPick = opts.onPick;
    if (wired || !$('#tlTrack')) return api;
    wired = true;
    $('#tlPrev').onclick = () => step(-1);
    $('#tlNext').onclick = () => step(1);
    $('#tlHandle').addEventListener('pointerdown', e => {
      e.preventDefault();
      const mv = ev => pick(pickAt(ev.clientX));
      const up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up) };
      addEventListener('pointermove', mv); addEventListener('pointerup', up);
    });
    $('#tlTrack').addEventListener('pointerdown', e => {
      if (e.target.closest('#tlHandle, .tick')) return;
      pick(pickAt(e.clientX));
    });
    return api;
  }

  const api = {
    mount,
    set ({ items: list, active: a }) {
      if (list) items = list;
      if (a !== undefined) active = a;
      if (active == null && items.length) active = items[items.length - 1].id;
      paint();
      return api;
    },
    get active () { return active },
    get items () { return items },
  };
  return api;
})();
/* /vstack:shell js */
</script>

<script>
/* The plan JSON is the artifact. Adjust it here, press Start, and watch the
   build colour in — Claude reports per-node progress through json-bridge.mjs
   patch, and every change lands here over SSE. Opened off disk this falls back
   to the demo block above. */
const BRIDGE = window.__VSTACK_BRIDGE__ || null;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let LANG = VSShell.lang;   // the shell owns the choice; every page shares it
const STR = {
  title: ['Phase %n build', '第 %n 期构建'],
  api: ['Endpoints', '接口'], ui: ['Components', '组件'], infra: ['Resources', '资源'],
  send: ['Send to Claude', '发送给 Claude'], sent: ['Sent ✓', '已发送 ✓'],
  start: ['Start the phase %n build', '开始第 %n 期构建'],
  building: ['Building…', '构建中…'],
  reset: ['Reset changes', '还原修改'],
  kNew: ['New', '新增'], kTouch: ['Changed', '修改'],
  kTouchD: ['— exists, this phase extends it', '——已存在，本期扩展'],
  kHave: ['Already built', '已存在'],
  kDone: ['Built this run', '本次已建'], kFail: ['Failed', '失败'],
  src: ['read from the codebase', '读取自代码库'],
  sum: ['<b>%new</b> new · <b>%touch</b> changed · %have already built', '<b>%new</b> 新增 · <b>%touch</b> 修改 · %have 已存在'],
  progress: ['Building', '构建中'],
  linked: ['LINKED TO CLAUDE', '已连接 CLAUDE'], lost: ['LINK LOST', '连接断开'],
  refreshed: ['Claude updated the plan', 'Claude 更新了计划'],
  apply: ['Refresh', '刷新'], dismiss: ['Dismiss', '忽略'],
};
const t = k => STR[k][LANG === 'zh' ? 1 : 0];

let doc = null;
let subject = 'api';
let dirtySinceSend = false;
let pendingPush = null;

const NODES = () => $('#nodes'), EDGES = () => $('#edges'), PLANE = () => $('#plane');
const COL = 268, ROW = 52, PAD = 34;
const tree = () => doc.subjects[subject].root;

const dirty = () => { dirtySinceSend = true; syncButtons(); };
const walkAll = (n, f) => { f(n); (n.children || []).forEach(k => walkAll(k, f)); };
const counts = root => {
  const c = { new: 0, touch: 0, have: 0, done: 0, failed: 0, building: 0, buildable: 0 };
  walkAll(root, n => {
    if (n === root) return;
    c[n.state] = (c[n.state] || 0) + 1;
    if (n.state !== 'have') {
      c.buildable++;
      if (n.status === 'done') c.done++;
      if (n.status === 'failed') c.failed++;
      if (n.status === 'building') c.building++;
    }
  });
  return c;
};
const buildActive = () => {
  let any = false;
  for (const k in doc.subjects) walkAll(doc.subjects[k].root, n => { if (n.status) any = true; });
  return any;
};

/* ── layout + render (the wireframe's tree layout, kept) ── */
function layout () {
  const out = []; let row = 0;
  (function w (n, d) {
    const kids = n.children || [];
    if (!kids.length) { n._y = PAD + row * ROW; row++; }
    else { kids.forEach(k => w(k, d + 1)); n._y = (kids[0]._y + kids[kids.length - 1]._y) / 2; }
    n._x = PAD + d * COL; out.push(n);
  })(tree(), 0);
  return out;
}

function render () {
  const ph = doc.phase ?? '?';
  VSShell.name(t('title').replace('%n', ph));
  document.title = t('title').replace('%n', ph) + ' · Visual Stack';
  $('#tApi').textContent = t('api'); $('#tUi').textContent = t('ui'); $('#tInfra').textContent = t('infra');
  $('#kNew').textContent = t('kNew'); $('#kTouch').textContent = t('kTouch');
  $('#kTouchD').textContent = t('kTouchD'); $('#kHave').textContent = t('kHave');
  $('#kDone').textContent = t('kDone'); $('#kFail').textContent = t('kFail');
  $('#srcStamp').textContent = `${t('src')} · ${doc.readAt || ''}`;
  $('#reset').textContent = t('reset');
  $('#rbText').textContent = t('refreshed');
  $('#rbApply').textContent = t('apply'); $('#rbDismiss').textContent = t('dismiss');

  const all = layout();
  const mono = doc.subjects[subject].mono ? 'mono' : '';
  NODES().innerHTML = all.map(n => `
    <div class="node ${n.state} ${mono} ${n.status ? 's-' + n.status : ''}" data-id="${esc(n.id)}" draggable="true"
         style="left:${n._x}px;top:${n._y}px">
      ${n.status === 'done' ? '<span class="badge">✓</span>'
        : n.status === 'failed' ? '<span class="badge">!</span>'
        : n.status === 'building' ? '<span class="badge">…</span>' : ''}
      <div class="k">${esc(n.kind || '')}${n.note ? `<span class="st">${esc(n.note)}</span>` : ''}</div>
      <div class="t" contenteditable="plaintext-only">${esc(n.text)}</div>
      <div class="ctrls">
        <button data-act="cycle" title="New / changed / already built">◐</button>
        <button data-act="add" title="Add below">+</button>
        <button data-act="del" title="Remove from this phase">×</button>
      </div>
    </div>`).join('');

  requestAnimationFrame(() => {
    const box = {}; let w = 0, h = 0;
    NODES().querySelectorAll('.node').forEach(el => {
      box[el.dataset.id] = { x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight };
      w = Math.max(w, el.offsetLeft + el.offsetWidth); h = Math.max(h, el.offsetTop + el.offsetHeight);
    });
    const paths = [];
    (function e (n) {
      for (const k of n.children || []) {
        const a = box[n.id], b = box[k.id];
        if (a && b) {
          const x1 = a.x + a.w, y1 = a.y + a.h / 2, x2 = b.x, y2 = b.y + b.h / 2, mx = (x1 + x2) / 2;
          paths.push(`<path class="${k.state === 'have' ? 'have' : ''}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`);
        }
        e(k);
      }
    })(tree());
    EDGES().innerHTML = paths.join('');
    PLANE().style.width = (w + PAD) + 'px'; PLANE().style.height = Math.max(h + PAD, 300) + 'px';
  });

  for (const k in doc.subjects) {
    const c = counts(doc.subjects[k].root);
    const el = $('#c' + k);
    if (el) el.textContent = c.new + c.touch ? String(c.new + c.touch) : '';
  }
  const c = counts(tree());
  $('#sum').innerHTML = t('sum').replace('%new', c.new).replace('%touch', c.touch).replace('%have', c.have);

  /* progress strip + build-state legend */
  const active = buildActive();
  $('#progress').hidden = !active;
  $('#kDoneWrap').hidden = !active;
  $('#kFailWrap').hidden = !active;
  if (active) {
    let total = 0, done = 0, failed = 0, building = 0;
    for (const k in doc.subjects) {
      const cc = counts(doc.subjects[k].root);
      total += cc.buildable; done += cc.done; failed += cc.failed; building += cc.building;
    }
    $('#pLabel').textContent = t('progress');
    $('#pCount').textContent = `${done + failed}/${total}`;
    const fill = $('#pFill');
    fill.style.width = total ? ((done + failed) / total * 100) + '%' : '0%';
    fill.classList.toggle('active', building > 0);
  }
  syncButtons();
}

function syncButtons () {
  const active = buildActive();
  $('#send').textContent = t('send');
  $('#send').disabled = !BRIDGE || !dirtySinceSend;
  $('#start').textContent = active ? t('building') : t('start').replace('%n', doc.phase ?? '?');
  $('#start').disabled = !BRIDGE || active;
  $('#start').classList.toggle('primary', !active);
}

/* ── find / edit (the wireframe's) ── */
const find = (id, n = tree(), p = null) => {
  if (n.id === id) return { n, p };
  for (const k of n.children || []) { const r = find(id, k, n); if (r) return r; }
  return null;
};

$('#subjects').addEventListener('click', e => {
  const b = e.target.closest('[data-s]'); if (!b) return;
  subject = b.dataset.s;
  for (const el of $('#subjects').children) el.setAttribute('aria-pressed', String(el === b));
  render();
});

$('#nodes').addEventListener('click', e => {
  const act = e.target.closest('[data-act]'); if (!act) return;
  const node = e.target.closest('.node');
  const { n, p } = find(node.dataset.id) || {};
  if (!n) return;
  if (act.dataset.act === 'cycle') {
    n.state = { new: 'touch', touch: 'have', have: 'new' }[n.state];
  } else if (act.dataset.act === 'add') {
    (p ? p.children : n.children).push({ id: 'x' + Math.round(performance.now()), kind: n.kind, text: 'New', state: 'new', children: [] });
  } else if (p) {
    p.children = p.children.filter(k => k !== n);
  }
  dirty(); render();
});

$('#nodes').addEventListener('input', e => {
  const el = e.target.closest('.t'); if (!el) return;
  const r = find(el.closest('.node').dataset.id); if (r) { r.n.text = el.textContent.trim(); dirty(); }
});

let dragId = null;
$('#nodes').addEventListener('dragstart', e => { const n = e.target.closest('.node'); if (n) dragId = n.dataset.id; });
$('#nodes').addEventListener('dragover', e => {
  const n = e.target.closest('.node'); if (!n || n.dataset.id === dragId) return;
  e.preventDefault();
  NODES().querySelectorAll('.drop').forEach(x => x.classList.remove('drop'));
  n.classList.add('drop');
});
$('#nodes').addEventListener('drop', e => {
  const n = e.target.closest('.node'); if (!n || !dragId) return;
  e.preventDefault();
  const from = find(dragId), to = find(n.dataset.id);
  if (from && to && from.p && !find(n.dataset.id, from.n)) {
    from.p.children = from.p.children.filter(k => k !== from.n);
    (to.n.children ||= []).push(from.n);
  }
  dragId = null; dirty(); render();
});
$('#nodes').addEventListener('dragend', () => {
  NODES().querySelectorAll('.drop').forEach(x => x.classList.remove('drop')); dragId = null;
});

/* ── language — the switch is the shell's; this is what the board does about it ── */
VSShell.onLang(l => {
  LANG = l;
  if (!doc) return;      // the shell announces the language before boot loads one
  renderLink(linkUp); render();
});

/* ── live link ── */
let linkUp = false;
function renderLink (up) {
  linkUp = up;
  VSShell.setLink(up, { on: t('linked'), off: t('lost') });
}

async function save (extra) {
  if (!BRIDGE) return false;
  const body = { ...doc, ...(extra || {}) };
  try {
    const r = await fetch(BRIDGE.save, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-VSTACK-Token': BRIDGE.token },
      body: JSON.stringify(body),
    });
    if (!r.ok) throw new Error(r.status);
    doc = body;
    dirtySinceSend = false;
    return true;
  } catch { return false; }
}

$('#send').addEventListener('click', async () => {
  $('#send').disabled = true;
  if (await save()) {
    $('#send').textContent = t('sent');
    setTimeout(syncButtons, 1600);
  } else syncButtons();
});

$('#start').addEventListener('click', async () => {
  $('#start').disabled = true;
  await save({ action: 'start' });
  syncButtons();
});

$('#reset').addEventListener('click', async () => {
  if (BRIDGE) {
    try { doc = await (await fetch(`${BRIDGE.doc}?t=${BRIDGE.token}`)).json() } catch {}
  } else {
    doc = JSON.parse($('#fallback').textContent);
  }
  dirtySinceSend = false; pendingPush = null; $('#refreshBar').hidden = true;
  render();
});

/* push: auto-apply while the board is clean (a build in flight), offer when the
   user has unsent plan edits — never clobber those silently */
function onPush (next) {
  if (!dirtySinceSend) {
    doc = next; pendingPush = null; $('#refreshBar').hidden = true;
    render();
  } else {
    pendingPush = next;
    $('#refreshBar').hidden = false;
  }
}
$('#rbApply').addEventListener('click', () => {
  if (pendingPush) { doc = pendingPush; pendingPush = null; dirtySinceSend = false; }
  $('#refreshBar').hidden = true; render();
});
$('#rbDismiss').addEventListener('click', () => { $('#refreshBar').hidden = true; });

/* ── boot ── */
(async function boot () {
  VSShell.init({ name: 'Phase build', eyebrow: BRIDGE ? BRIDGE.name : '', send: true });
  if (BRIDGE) renderLink(false); else VSShell.hideLink();
  if (BRIDGE) {
    try { doc = await (await fetch(`${BRIDGE.doc}?t=${BRIDGE.token}`)).json() }
    catch { doc = JSON.parse($('#fallback').textContent); }
    const es = new EventSource(`${BRIDGE.events}?t=${BRIDGE.token}`);
    es.onopen = () => renderLink(true);
    es.onerror = () => renderLink(false);
    es.addEventListener('push', ev => {
      try { onPush(JSON.parse(ev.data)) } catch {}
    });
  } else {
    doc = JSON.parse($('#fallback').textContent);
  }
  render();
})();
</script>
