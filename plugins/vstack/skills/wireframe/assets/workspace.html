<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review · Visual Stack</title>
<style>
/* ══════════════════════════ workspace chrome ══════════════════════════
   Opens one HTML file in its own browser window and lets you comment on it.
   The wrapper knows nothing about the page inside it. Two modes, two kinds of
   comment, nothing else. */
/* vstack:shell tokens */
/* One palette for every vstack page. Roles, not colours: a page asks for
   --surface, not for white, so light and dark are the same stylesheet.

   Page-specific hues (the story map's phase bands, the board's new/have/touch,
   the spec's priorities) stay in the page, below this block — they mean
   something only there. Everything here is shared, and is the reason a board
   and a spec look like the same product.

   Three states, in this order: the OS preference, then an explicit choice.
   `data-theme` absent means auto. */
:root{
  --paper:#eef0f3; --surface:#ffffff; --surface-2:#f7f8fa;
  --ink:#16171c; --ink-2:#43454d; --ink-3:#71737c;
  --line:#e2e4e9; --line-2:#d0d2d9;
  --brand:#d23b2e; --brand-soft:#fdefed; --brand-line:#f3b3ac;
  --ok:#10876e; --ok-soft:#e9f9f2;
  --shadow:0 1px 2px rgba(16,17,22,.06);
  --shadow-pop:0 1px 2px rgba(16,17,22,.06),0 8px 24px rgba(16,17,22,.10);
  --window-shadow:0 2px 6px rgba(16,17,22,.10),0 18px 48px rgba(16,17,22,.16);
  --radius:9px;
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0e0f12; --surface:#17191e; --surface-2:#1d1f25;
  --ink:#f1f2f4; --ink-2:#bcbfc7; --ink-3:#8b8e97;
  --line:#282a31; --line-2:#363942;
  --brand:#f0685c; --brand-soft:rgba(240,104,92,.14); --brand-line:rgba(240,104,92,.38);
  --ok:#2fb89b; --ok-soft:rgba(47,184,155,.14);
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-pop:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.5);
  --window-shadow:0 2px 6px rgba(0,0,0,.5),0 18px 48px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme=light]{
  --paper:#eef0f3; --surface:#ffffff; --surface-2:#f7f8fa;
  --ink:#16171c; --ink-2:#43454d; --ink-3:#71737c;
  --line:#e2e4e9; --line-2:#d0d2d9;
  --brand:#d23b2e; --brand-soft:#fdefed; --brand-line:#f3b3ac;
  --ok:#10876e; --ok-soft:#e9f9f2;
  --shadow:0 1px 2px rgba(16,17,22,.06);
  --shadow-pop:0 1px 2px rgba(16,17,22,.06),0 8px 24px rgba(16,17,22,.10);
  --window-shadow:0 2px 6px rgba(16,17,22,.10),0 18px 48px rgba(16,17,22,.16);
  color-scheme:light;
}
:root[data-theme=dark]{
  --paper:#0e0f12; --surface:#17191e; --surface-2:#1d1f25;
  --ink:#f1f2f4; --ink-2:#bcbfc7; --ink-3:#8b8e97;
  --line:#282a31; --line-2:#363942;
  --brand:#f0685c; --brand-soft:rgba(240,104,92,.14); --brand-line:rgba(240,104,92,.38);
  --ok:#2fb89b; --ok-soft:rgba(47,184,155,.14);
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-pop:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.5);
  --window-shadow:0 2px 6px rgba(0,0,0,.5),0 18px 48px rgba(0,0,0,.6);
  color-scheme:dark;
}
/* /vstack:shell tokens */
:root{ --panelw:320px }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:13px/1.45 var(--font);
  -webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:1px}

#app{display:grid;grid-template-rows:auto 1fr;height:100%}
/* The column is what animates: the track collapses to nothing while the panel
   slides out through it, so the page under review grows into the space instead
   of the panel simply vanishing from it. */
#main{display:grid;grid-template-columns:minmax(0,1fr) var(--pw,var(--panelw));min-height:0;
  transition:grid-template-columns .18s ease-out}
#canvasArea{grid-column:1;grid-row:1;overflow:hidden}
#panel{grid-column:2;grid-row:1;position:relative;z-index:40}

/* ── the comments panel, and the one handle that shows or hides it ──
   The handle belongs to the panel, not to the bar: it rides on the panel's
   outer edge and moves with it, so the same button that pushes the comments
   away is the one that pulls them back. The arrow points where pressing it
   sends them. Its badge says what is behind a closed panel, so putting the
   comments away never hides a question waiting on an answer. */
.pbadge{display:inline-grid;place-items:center;min-width:16px;height:16px;padding:0 4px;
  border-radius:999px;font:700 9.5px/1 var(--mono);background:var(--line-2);color:var(--ink-2)}
.pbadge.need{background:var(--brand);color:#fff}
.pbadge:empty{display:none}
body.panelshut #main{--pw:0px}
/* The panel keeps its own width while the track closes over it — otherwise the
   comments reflow on the way out, which reads as the text breaking rather than
   the panel leaving. */
#panel{min-width:0;overflow:hidden}
#panel > *{width:var(--panelw);flex:none}
#pbody{flex:1 1 auto!important}
/* Up at the top, level with the panel's own heading — halfway down the window
   it read as floating, and the thing it belongs to starts here. */
#panelHandle{display:flex;grid-column:2;grid-row:1;align-self:start;justify-self:start;
  position:relative;z-index:43;margin-top:18px;transform:translateX(-100%);
  flex-direction:column;align-items:center;gap:7px;width:27px;padding:13px 0;
  border:1px solid var(--line);border-right:0;border-radius:9px 0 0 9px;
  background:var(--surface);color:var(--ink-2);box-shadow:var(--shadow-pop)}
/* The handle shares the panel's grid line, so it follows the real edge even
   when browser zoom or a constrained viewport changes the rendered track. */
body.panelopen #handleBadge{display:none}
body.panelopen #panelHandle svg{transform:rotate(180deg)}
body.phase #panelHandle{display:none!important}
#panelHandle:hover{color:var(--ink);background:var(--surface-2)}
#panelHandle svg{width:15px;height:15px;display:block;transition:transform .16s ease-out}
/* Keep comments beside the canvas for every width that still uses the desktop
   chrome. The old intermediate breakpoint made a partial drawer cover the
   reviewed page. At the compact breakpoint comments become their own view, so
   a card never straddles the panel and the page underneath. */
@media (max-width:720px){
  #main{grid-template-columns:1fr}
  #panel{position:fixed;top:46px;right:0;bottom:0;width:100vw;z-index:45;
    box-shadow:var(--shadow-pop);transform:translateX(100%);transition:transform .16s ease-out}
  /* Off to the side rather than gone: the compact view still slides into place. */
  body.panelshut #panel{display:flex}
  body.panelopen #panel{transform:none}
  /* The compact panel is its own view, not a drawer over part of the page. */
  #panel > *{width:100%}
  #panelHandle{grid-column:1;position:fixed;right:0;top:64px;margin-top:0;
    transform:none;justify-self:auto}
  body.panelopen #panelHandle{right:calc(100vw - 27px);z-index:46}
}
@media (prefers-reduced-motion:reduce){
  #main,#panel,#panelHandle,#panelHandle svg{transition:none}
}

/* vstack:shell css */
/* The chrome every vstack page wears: the top bar and the controls that sit in
   it. Page layout stays in the page — some of these are app shells that fill
   the viewport, some are documents that scroll — but the bar, the buttons and
   the segmented controls are the same object everywhere. */
/* The shell hides its own controls with `hidden` — the link dot when there is
   no link, the primary action on a page that doesn't send. A class that sets
   `display` outranks the browser's default [hidden] rule, and .btn/.linkdot
   both do, so state this here rather than trusting each page's reset. */
[hidden]{display:none!important}
/* Above anything the page floats at its edges. The bar makes a stacking context,
   so a menu opening out of it can never rise past a sibling with a higher
   z-index — which is how the comments handle came to sit on top of the settings
   menu. Raising the bar raises everything it opens. */
.vs-topbar{display:flex;align-items:center;gap:10px;padding:0 12px;height:46px;
  background:var(--surface);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:50}
.vs-topbar .brand{display:flex;align-items:center;gap:8px;min-width:0}
.vslink{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:inherit}
.vsmark{width:15px;height:15px;flex:none;color:var(--ink)}
.vslink:hover .vsmark{opacity:.8}
/* The tool's name, in the place the wordmark used to take. */
.brand b{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:280px}
.brand .eyebrow{font:600 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);white-space:nowrap}
.spacer{flex:1}
.sep{width:1px;height:20px;background:var(--line);flex:none}

/* Says the tool itself is unfinished — not that something is running. A page
   still being built should admit it in the chrome, not in a footnote. */
.wip{flex:none;font:700 9.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:#b0761a;background:color-mix(in srgb,#b0761a 12%,transparent);
  border:1px solid color-mix(in srgb,#b0761a 34%,transparent);
  border-radius:999px;padding:4px 8px;white-space:nowrap}
@media (prefers-color-scheme:dark){.wip{color:#d29a3f;background:color-mix(in srgb,#d29a3f 14%,transparent);
  border-color:color-mix(in srgb,#d29a3f 34%,transparent)}}
:root[data-theme=dark] .wip{color:#d29a3f;background:color-mix(in srgb,#d29a3f 14%,transparent);
  border-color:color-mix(in srgb,#d29a3f 34%,transparent)}
:root[data-theme=light] .wip{color:#b0761a;background:color-mix(in srgb,#b0761a 12%,transparent);
  border-color:color-mix(in srgb,#b0761a 34%,transparent)}

/* A switch is on or off. A segmented control is a choice between alternatives —
   using one to mean the other is why "Highlight new" read as two buttons. */
.switch{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px 0 9px;
  border:1px solid var(--line-2);border-radius:7px;background:var(--surface);color:var(--ink-2);
  font:inherit;font-weight:550;white-space:nowrap;cursor:pointer;flex:none}
.switch:hover{background:var(--surface-2);color:var(--ink)}
.switch .track{width:26px;height:15px;border-radius:999px;background:var(--line-2);
  position:relative;flex:none;transition:background .14s}
.switch .knob{position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;
  background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.35);transition:transform .14s}
/* On is the same "this one is selected" the segmented control uses. The brand
   red is the primary action — a view option wearing it read as the thing to
   press; solid black read like one too. */
.switch[aria-checked=true]{color:var(--ink);border-color:var(--line-2)}
/* The same near-black the segmented controls use when selected — on is on,
   whichever control is saying it. */
.switch[aria-checked=true] .track{background:var(--ink-2)}
.switch[aria-checked=true] .knob{transform:translateX(11px)}

/* buttons — one shape, three sizes of intent */
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:7px;
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:550;
  white-space:nowrap;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.primary[disabled]{opacity:.45;cursor:default;filter:none;pointer-events:none}
.btn[disabled]{opacity:.45;cursor:default;pointer-events:none}
.btn.sm{height:25px;padding:0 9px;font-size:11.5px}

/* A primary action with a ▾ beside it. The workspace and the story map both
   have one and they were built twice; same markup, same metrics, here. */
.split{display:inline-flex;position:relative;flex:none}
.split > .btn:first-child{border-radius:7px 0 0 7px}
.split > .caret{border-radius:0 7px 7px 0;width:28px;padding:0 8px;justify-content:center;
  border-left:1px solid color-mix(in srgb,#fff 28%,transparent)}

/* segmented control — modes, sizes, language, theme */
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden;
  background:var(--surface);flex:none}
.seg button{height:30px;padding:0 12px;font-weight:550;color:var(--ink-2);display:inline-flex;
  align-items:center;gap:6px;border:0;border-right:1px solid var(--line-2);background:none;
  cursor:pointer;font:inherit;font-weight:550}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--surface-2)}
/* Selected is near-black rather than black: dark enough to find at a glance,
   one step off the ink the page's own words are set in, so the bar never
   out-blacks the content. --ink-2 flips with the theme, so in dark mode this is
   the same step down from white. */
.seg button[aria-pressed=true]{background:var(--ink-2);color:var(--surface);font-weight:650}
.seg.sm button{height:25px;padding:0 9px;font-size:11.5px}
#langSwitch button,#themeSwitch button{padding:0 9px;font-size:11.5px;font-weight:600}
#themeSwitch button{padding:0 8px}
#themeSwitch svg{width:13px;height:13px;display:block}

/* ── settings: how you like the page, out of the way ── */
.cogwrap{position:relative;flex:none}
.cog{width:30px;height:30px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface);
  color:var(--ink-2);display:grid;place-items:center;cursor:pointer}
.cog:hover,.cog[aria-expanded=true]{background:var(--surface-2);color:var(--ink)}
.cog svg{width:15px;height:15px;display:block}
.cogmenu{position:absolute;top:36px;right:0;z-index:60;background:var(--surface);
  border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow-pop);padding:9px;
  display:grid;gap:9px;min-width:210px}
.cogmenu[hidden]{display:none}
.cogmenu .row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.cogmenu .lbl{font-size:12px;color:var(--ink-2);white-space:nowrap}

/* the live link, stated rather than implied */
.linkdot{display:inline-flex;align-items:center;gap:6px;font:600 10.5px/1 var(--mono);
  letter-spacing:.03em;color:var(--ink-3);white-space:nowrap}
.linkdot::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink-3);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--ink-3) 18%,transparent)}
.linkdot.on{color:var(--ok)}
.linkdot.on::before{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
/* Up, but nobody is waiting to read what you send. Amber rather than green,
   because the page works and the round will not — the same distinction the
   WIP tag makes. */
.linkdot.idle{color:#b0761a}
.linkdot.idle::before{background:#b0761a;box-shadow:0 0 0 3px color-mix(in srgb,#b0761a 22%,transparent)}
@media (prefers-color-scheme:dark){.linkdot.idle{color:#d29a3f}
  .linkdot.idle::before{background:#d29a3f;box-shadow:0 0 0 3px color-mix(in srgb,#d29a3f 22%,transparent)}}
:root[data-theme=dark] .linkdot.idle{color:#d29a3f}
:root[data-theme=dark] .linkdot.idle::before{background:#d29a3f;
  box-shadow:0 0 0 3px color-mix(in srgb,#d29a3f 22%,transparent)}

/* floating banners — the page talking back, never blocking the work */
.banner{position:fixed;left:50%;top:58px;transform:translateX(-50%);z-index:38;display:none;
  align-items:center;gap:10px;padding:8px 10px 8px 14px;border-radius:10px;box-shadow:var(--shadow-pop);
  font-size:12.5px;white-space:nowrap;max-width:calc(100% - 24px)}
.banner.on{display:flex}
.banner.dark{background:var(--ink);color:var(--surface)}
.banner.dark .btn{background:color-mix(in srgb,var(--surface) 16%,transparent);
  border-color:transparent;color:var(--surface)}
.banner.dark .btn:hover{background:color-mix(in srgb,var(--surface) 28%,transparent)}
.banner.good{background:var(--ok-soft);border:1px solid var(--ok);color:var(--ink)}
.banner.good .tick{color:var(--ok);font-weight:700}

/* the toast — VSShell.toast(); one element, appended on first use */
.vs-toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;
  background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:8px;
  font-size:12.5px;box-shadow:var(--shadow-pop);opacity:0;pointer-events:none;transition:opacity .25s}
.vs-toast.on{opacity:1}

/* ── "there is a newer one" ──
   One line under the bar, in the workmanlike amber the WIP tag uses: it is
   information, not an alarm, and it goes away for good on ×. */
.vs-update{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:7px 12px;font-size:12px;color:var(--ink-2);
  background:color-mix(in srgb,#b0761a 8%,var(--surface));
  border-bottom:1px solid color-mix(in srgb,#b0761a 26%,transparent)}
.vs-update .v{font:700 9.5px/1 var(--mono);letter-spacing:.06em;color:#8a5c06;
  background:color-mix(in srgb,#b0761a 16%,transparent);border-radius:999px;padding:4px 7px;flex:none}
.vs-update .t{flex:1;min-width:0}
.vs-update button{font:inherit;font-size:11.5px;font-weight:600;color:var(--ink-2);
  border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:3px 8px;flex:none}
.vs-update button:hover{color:var(--ink);background:var(--surface-2)}
.vs-update .no{width:24px;padding:0;font-size:14px;line-height:1}
.vs-update-how{flex-basis:100%;margin:2px 0 0;font-size:11.5px;color:var(--ink-3)}
.vs-update-how[hidden]{display:none}
.vs-update-how p{margin:0 0 4px}
.vs-update-how pre{margin:0 0 4px;padding:7px 9px;border-radius:7px;overflow-x:auto;
  font:500 11px/1.6 var(--mono);color:var(--ink);background:var(--surface);border:1px solid var(--line)}
.vs-update-how .auto{margin:0 0 4px}
.vs-update-how a{color:var(--ink-2)}
@media (prefers-color-scheme:dark){.vs-update .v{color:#e2b567}}
:root[data-theme=dark] .vs-update .v{color:#e2b567}

@media (max-width:720px){
  .brand .eyebrow,.wip{display:none}
  .vs-topbar{gap:8px;padding:0 8px}
}
/* /vstack:shell css */

/* the workspace bar sits above the window it wraps, not sticky over a scroll */
.vs-topbar{position:relative}

/* ── phase mode: the same page, showing a release instead of a version ──
   View-only on purpose. What a phase contains is a re-slice of the story map,
   not an edit of this page, so everything that writes is gone rather than
   disabled — a viewer that cannot lie beats an editor that edits the wrong
   file. See the wishlist: "It is view-only, deliberately." */
body.phase #modeSwitch,
body.phase #panel,
body.phase .split,
body.phase #sendMenu,
body.phase #composer,
body.phase #overlay{display:none!important}
body.phase #main{grid-template-columns:1fr}
/* What this phase adds, marked on the page itself rather than described beside
   it. A switch, not a segmented control: it is on or off, not a choice between
   two things. */
#hiNew{display:none}
body.phase #hiNew{display:inline-flex}
/* Send becomes Stop while a round is out. Not red-on-red: a stop is a quiet
   correction, not a second call to action competing with the one it replaces. */
#btnSend.stop{background:var(--surface);border-color:var(--brand-line);color:var(--brand)}
#btnSend.stop:hover{background:var(--brand);border-color:var(--brand);color:#fff;filter:none}
#btnSend.stop[disabled]{opacity:1;color:var(--ink-3);border-color:var(--line-2)}
.split #btnSend.stop + .caret{border-left-color:var(--brand-line)}
.btn .kbd{font:500 10px/1 var(--mono);opacity:.6}
.seg .kbd{font:500 10px/1 var(--mono);opacity:.65}
/* Icon-only sizes — wider cells, nothing else. Selected is the shell's selected
   everywhere. Only the colour is restated here, because the icon's own colour
   above would otherwise outrank the shell's. */
.seg.icons button{width:36px;padding:0;justify-content:center;color:var(--ink-3)}
.seg.icons button:hover{color:var(--ink)}
.seg.icons button[aria-pressed=true]{color:var(--surface)}

/* Send is the loop; approve is the way out of it. Same control, because they
   are the same decision made two ways — one more round, or done. The split
   itself is the shell's; only what hangs off it is the workspace's. */
#sendMenu{position:absolute;top:42px;right:12px;z-index:60;width:266px;background:var(--surface);
  border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow-pop);padding:5px;display:none}
#sendMenu.on{display:block}
#sendMenu button{display:block;width:100%;text-align:left;padding:8px 9px;border-radius:7px}
#sendMenu button:hover{background:var(--surface-2)}
/* A menu item is a list of things you might do, not a set of headings. Bold on
   every row makes the list shout in unison and says nothing about which one
   matters — the same reason the other tools' menus are set at normal weight. */
#sendMenu .t{display:block;font-weight:500;font-size:12.5px}
#sendMenu .d{display:block;font-size:11.5px;color:var(--ink-3);line-height:1.35;margin-top:3px}
#sendMenu .d:empty{display:none}
#sendMenu button.armed{background:var(--brand-soft)}
#sendMenu button.armed .t{color:var(--brand)}
#sendMenu button[disabled]{cursor:default}
#sendMenu button[disabled]:hover{background:none}
#sendMenu .mrule{height:1px;background:var(--line);margin:4px 6px}
#sendMenu .url{font:500 11px/1.4 var(--mono);color:var(--ok);word-break:break-all}
/* A link waiting under the caret is easy to miss — mark the caret itself. */
.split .caret{position:relative}
.split .caret.flag::after{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;
  border-radius:50%;background:#fff;box-shadow:0 0 0 2px var(--brand)}

/* The end of the review, said once and plainly. */
#doneScreen{position:fixed;inset:0;z-index:200;display:none;place-items:center;
  background:color-mix(in srgb,var(--ink) 34%,transparent);backdrop-filter:blur(2px)}
#doneScreen.on{display:grid}
#doneScreen .card{background:var(--surface);border-radius:14px;box-shadow:var(--window-shadow);
  padding:26px 28px;max-width:380px;text-align:center}
#doneScreen .tick{width:42px;height:42px;border-radius:50%;background:var(--ok-soft);color:var(--ok);
  display:grid;place-items:center;font-size:20px;font-weight:700;margin:0 auto 12px}
#doneScreen h2{margin:0 0 6px;font-size:16px}
#doneScreen p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.55}
.seg svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}

/* ── canvas + the page's own browser window ── */
#canvasArea{display:grid;grid-template-rows:minmax(0,1fr) auto;min-width:0}
/* The dots live on the non-scrolling frame so they are painted once, instead of
   being repainted across the whole scrollable canvas on every scroll. */
#stageArea{position:relative;overflow:hidden;background:var(--surface-2);
  background-image:radial-gradient(circle at 1px 1px,var(--line-2) 1px,transparent 0);
  background-size:22px 22px}
#canvasWrap{position:absolute;inset:0;overflow:auto}
#canvas{padding:26px;display:flex;justify-content:center;min-height:100%;align-items:flex-start}

/* transform-origin is top-left so the negative margins in setZoom() shrink the
   layout box to exactly the scaled size — anything else and the window drifts. */
#browser{background:var(--surface);border-radius:11px;box-shadow:var(--window-shadow);
  transform-origin:top left;flex:none;overflow:hidden;border:1px solid var(--line-2);
  will-change:transform;backface-visibility:hidden}
.window-bar{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;
  background:linear-gradient(var(--surface),var(--surface-2));border-bottom:1px solid var(--line-2)}
.window-bar .reload{width:22px;height:22px;border-radius:5px;display:grid;place-items:center;
  color:var(--ink-3);font-size:13px;flex:none}
.window-bar .reload:hover{background:var(--line);color:var(--ink)}
.window-bar .url{flex:1;height:22px;border-radius:11px;background:var(--paper);border:1px solid var(--line);
  display:flex;align-items:center;padding:0 9px;font:600 11px/1 var(--mono);color:var(--ink-2);
  min-width:0;overflow:hidden;white-space:nowrap}
.window-bar .size{font:500 10.5px/1 var(--mono);color:var(--ink-3);flex:none}
.window-bar .vlabel{font:600 10px/1 var(--mono);padding:3px 6px;border-radius:5px;
  background:var(--surface-2);color:var(--ink-2);flex:none}
.window-bar .vlabel.hist{background:var(--brand-soft);color:var(--brand)}
#viewportBox{position:relative;overflow:auto;background:#fff;contain:paint}
#scroller{position:relative}
#frame{display:block;border:0;width:100%;background:#fff}

/* View is the page as it really is — the annotation layer steps out of the way
   completely. Annotate brings it back. */
#overlay{position:absolute;inset:0;overflow:hidden;contain:layout paint}
#overlay.view{pointer-events:none}
#overlay.view .mark{display:none}

.mark{position:absolute}
.mark.area{border:2px solid var(--mk);border-radius:3px;
  background:color-mix(in srgb,var(--mk) 8%,transparent);cursor:pointer}
.mark .lbl{display:none}
.mark.sel .lbl,#overlay:not(.view) .mark:hover .lbl{display:block}
.mark:hover{z-index:5}
.mark.area .lbl{position:absolute;left:0;top:100%;margin-top:4px;max-width:320px;
  background:var(--mk);color:#fff;padding:3px 7px;border-radius:4px;font:500 11.5px/1.35 var(--font);
  white-space:pre-wrap;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.mark.area.flip .lbl{top:auto;bottom:100%;margin:0 0 4px}
.mark .num{position:absolute;left:-1px;top:-19px;background:var(--mk);color:#fff;
  font:700 10px/1 var(--mono);padding:3px 5px;border-radius:4px 4px 0 0}
.mark.pin{width:24px;height:24px;border-radius:50% 50% 50% 3px;background:var(--mk);color:#fff;
  display:grid;place-items:center;font:700 11px/1 var(--font);transform:translate(-2px,-24px);
  box-shadow:0 1px 5px rgba(0,0,0,.28);cursor:pointer}
/* The pin is only 24px wide, so an absolute child would shrink-to-fit to almost
   nothing — max-content lets the note size to its text instead. */
.mark.pin .lbl{position:absolute;left:calc(100% + 5px);top:50%;transform:translateY(-50%);
  width:max-content;max-width:300px;background:var(--mk);color:#fff;padding:3px 7px;border-radius:4px;
  font:500 11.5px/1.35 var(--font);white-space:pre-wrap;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.mark.sel{outline:2px dashed var(--ink);outline-offset:3px}
.mark.ghost{opacity:.4;filter:saturate(.4)}
.mark.done{opacity:.32}
/* A comment belongs to the thing it was made on. When that thing is not on the
   page right now — a closed modal, a screen that is not showing — the mark goes
   with it rather than floating over whatever took its place. */
.mark.gone{display:none}
/* The page was rebuilt and the element could not be found again: the mark falls
   back to where it was drawn, and says so by looking unsure of itself. */
.mark.loose{opacity:.5;filter:saturate(.5)}
#drag{position:absolute;border:2px dashed var(--brand);border-radius:3px;display:none;
  background:color-mix(in srgb,var(--brand) 8%,transparent);pointer-events:none}

/* ── on-canvas composer ── */
#composer{position:absolute;z-index:30;width:280px;background:var(--surface);border:1px solid var(--line-2);
  border-radius:10px;box-shadow:var(--shadow-pop);display:none;overflow:hidden}
#composer.on{display:block}
#composer .chead{display:flex;align-items:center;gap:7px;padding:8px 9px 6px}
#composer .cnum{font:700 10px/1 var(--mono);color:#fff;background:var(--mk,var(--brand));
  padding:3px 5px;border-radius:4px}
#composer .ckind{font-size:11.5px;color:var(--ink-3);flex:1}
#composer .chead button{width:20px;height:20px;border-radius:4px;color:var(--ink-3);
  display:grid;place-items:center;font-size:12px}
#composer .chead button:hover{background:var(--surface-2);color:var(--brand)}
#composer .cstatus{font:600 9.5px/1 var(--font);letter-spacing:.04em;text-transform:uppercase;
  padding:3px 5px;border-radius:4px;background:var(--surface-2);color:var(--ink-3)}
#composer .cstatus.addressed{background:var(--ok-soft);color:var(--ok)}
#composer .cstatus.question{background:var(--brand-soft);color:var(--brand)}
#composer .cstatus:empty{display:none}
/* What this comment is attached to, said back to the reviewer as they type it.
   Quietly: it is a confirmation you glance at, not a heading — you already know
   what you clicked, and the box you are typing in is the point of the panel. */
#composer .canchor{display:none;margin:0 9px 6px;font:400 10.5px/1.4 var(--mono);color:var(--ink-3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.85}
#composer .canchor.on{display:block}
#composer .canchor b{color:inherit;font-weight:500}
#composer .canchor.gone{color:var(--brand)}
#composer textarea{width:calc(100% - 18px);margin:0 9px;border:1px solid var(--line-2);border-radius:7px;
  padding:6px 7px;font-size:12.5px;line-height:1.45;resize:vertical;min-height:58px;background:var(--surface)}
#composer textarea:focus{outline:none;border-color:var(--brand);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 12%,transparent)}
#composer .cthread{margin:8px 9px 0;display:none;flex-direction:column;gap:7px;
  max-height:190px;overflow:auto}
#composer .cthread.on{display:flex}
#composer .msg{border-left:2px solid var(--line-2);padding-left:8px}
#composer .msg.agent,#composer .msg.claude{border-left-color:var(--brand)}
#composer .msg .who{font:600 10px/1 var(--font);letter-spacing:.04em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:3px}
#composer .msg.agent .who,#composer .msg.claude .who{color:var(--brand)}
#composer .msg .body{font-size:12.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
#composer .creply{display:none;margin-top:8px;min-height:44px}
#composer .creply.on{display:block}
#composer .cfoot{display:flex;align-items:center;gap:5px;padding:8px 9px;margin-top:8px;
  border-top:1px solid var(--line);background:var(--paper)}
#composer .cfoot .hint{flex:1;font-size:11px;color:var(--ink-3)}
#composer .csave{height:26px;padding:0 11px;border-radius:6px;background:var(--ink);color:#fff;
  font-weight:600;font-size:11.5px;flex:none}
#composer .csave:hover{filter:brightness(1.25)}
#composer .csave .kbd{font:500 9.5px/1 var(--mono);opacity:.6;margin-left:4px}
/* A comment Claude is working on keeps its own progress, wherever it is shown. */
#composer.working{border-color:var(--brand-line)}
#composer.working::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--brand-soft)}
#composer.working::before{content:"";position:absolute;bottom:0;height:2px;width:38%;background:var(--brand);
  z-index:1;animation:sweep 1.15s ease-in-out infinite}

/* ── right panel: the index ── */
/* Flex rather than a fixed row template: the working strip comes and goes, and
   a display:none grid child would silently reshuffle every other row. */
#panel{background:var(--surface);border-left:1px solid var(--line);display:flex;
  flex-direction:column;min-height:0}
#phead,#pwork,#pfoot{flex:none}
#phead{display:flex;align-items:center;gap:8px;padding:10px 12px 8px}
#phead b{font-size:13px}
/* Which screen these comments were made on belongs beside the word Comments —
   it qualifies the heading, so it reads as part of it rather than as a stray
   label at the far end of the bar. */
#phead .scope.pill{font:600 10px/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;
  color:var(--ink-3);background:var(--surface-2);border:1px solid var(--line);
  border-radius:999px;padding:3px 7px;white-space:nowrap}
#phead #btnGeneral{margin-left:auto}
/* A comment about the page rather than about a thing on it — the one kind you
   cannot make by pointing at something. */
#phead #btnGeneral{flex:none;width:20px;height:20px;border-radius:6px;font-size:15px;line-height:1;
  color:var(--ink-3);display:grid;place-items:center}
#phead #btnGeneral:hover{color:var(--ink);background:var(--surface-2)}
#pbody{flex:1;overflow:auto;padding:8px 10px 14px;min-height:0}

/* ── work in flight ──
   Progress lives on the comments themselves, so it is obvious *which* ones are
   being worked on — and cancel sits next to them, where the doubt is. */
#pwork{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);
  background:var(--brand-soft)}
#pwork[hidden]{display:none}
#pwork .spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--brand-line);
  border-top-color:var(--brand);animation:spin .7s linear infinite;flex:none}
#pwork .ptxt{flex:1;min-width:0;font-size:11.5px;color:var(--ink-2);line-height:1.35}
#pwork .pcancel{font-size:11.5px;font-weight:600;color:var(--brand);white-space:nowrap;flex:none;
  border:1px solid var(--brand-line);border-radius:6px;padding:3px 8px;background:var(--surface)}
#pwork .pcancel:hover{background:var(--brand);border-color:var(--brand);color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sweep{0%{left:-38%}55%{left:100%}100%{left:100%}}
#pfoot{border-top:1px solid var(--line);padding:9px 10px;display:flex;gap:7px;align-items:center}
#pfoot .count{flex:1;font-size:11.5px;color:var(--ink-3);line-height:1.3}
#pfoot .count b{color:var(--ink);font-weight:650}
#pfoot .clear{font-size:11.5px;color:var(--ink-3);text-decoration:underline;white-space:nowrap;flex:none}
#pfoot .clear:hover{color:var(--brand)}
#pfoot .clear:disabled{opacity:.35;cursor:default;text-decoration:none}
#pfoot .clear:disabled:hover{color:var(--ink-3)}

.item{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:8px;padding:7px 9px;
  margin-bottom:6px;cursor:pointer;transition:border-color .12s}
.item:hover{border-color:var(--line-2)}
.item.sel{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.item .ih{display:flex;align-items:center;gap:6px}
.item .n{font:700 10px/1 var(--mono);color:#fff;background:var(--mk,var(--brand));padding:3px 5px;border-radius:4px}
.item .kind{font-size:11px;color:var(--ink-3);flex:1}
.item .note{font-size:12.5px;line-height:1.4;margin-top:4px;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.item .note.blank{color:var(--ink-3);font-style:italic}
.item .gnote{display:block;width:100%;margin-top:5px;border:1px solid var(--line-2);border-radius:6px;
  background:var(--surface);color:var(--ink);font:inherit;font-size:12.5px;line-height:1.4;
  padding:5px 7px;resize:vertical;min-height:46px}
.item .gnote:focus{outline:none;border-color:var(--brand);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 12%,transparent)}
.item.off{opacity:.68}
.item.off:hover{opacity:1}
.item .kind .offtag{color:var(--ink-3);font-style:italic}
/* Live review: which screen of the app this was said about. Quiet, because it
   is context — the note is still the thing being read. */
.item .route{font:600 10px/1.3 var(--mono);color:var(--ink-3);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item.off .route{color:var(--brand)}
.item .thread{font-size:11px;color:var(--ink-3);margin-top:4px;display:flex;align-items:center;gap:5px}
.item .thread.asked{color:var(--brand);font-weight:600}
/* A question is the only thing here waiting on the reviewer. It gets the
   accent edge and its reply box already open — the rest of the list can wait. */
.item.asked{border-color:var(--brand-line);background:var(--brand-soft)}
.item.asked .thread.asked::before{content:"";width:6px;height:6px;border-radius:50%;
  background:var(--brand);flex:none;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
/* The conversation lives where the comment is listed, not only on the mark —
   answering Claude should not mean hunting for a pin on the page. */
.item .thread.tog{width:100%;text-align:left}
.item .thread .caret{margin-left:auto;font-size:9px;opacity:.6}
.item .tbox{margin-top:7px;padding-top:7px;border-top:1px solid var(--line);
  display:flex;flex-direction:column;gap:7px;cursor:default}
.item .tmsg{font-size:11.5px;line-height:1.4;border-left:2px solid var(--line-2);padding-left:7px}
.item .tmsg.agent,.item .tmsg.claude{border-left-color:var(--brand)}
.item .tmsg .who{display:block;font:600 9.5px/1 var(--font);letter-spacing:.04em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}
.item .tmsg.agent .who,.item .tmsg.claude .who{color:var(--brand)}
.item .tmsg .body{display:block;white-space:pre-wrap;word-break:break-word}
/* the field and its send are one control, so they share one border */
.item .treplyrow{display:flex;align-items:flex-end;gap:0;border:1px solid var(--line-2);
  border-radius:6px;background:var(--surface);overflow:hidden}
.item .treplyrow:focus-within{border-color:var(--brand);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 12%,transparent)}
.item .treply{flex:1;min-width:0;border:0;background:none;padding:6px 4px 6px 7px;
  font:inherit;font-size:12px;line-height:1.4;resize:none;min-height:30px;max-height:120px}
.item .treply:focus{outline:none}
.item .tsend{flex:none;width:28px;height:30px;display:grid;place-items:center;
  color:var(--ink-3);border-radius:5px;margin:0 2px 0 0}
.item .tsend svg{width:15px;height:15px;display:block}
.item .tsend:hover{color:var(--brand);background:var(--surface-2)}
/* Indeterminate on purpose: Claude gives no percentage, and a fake one would be
   a lie. It says "this one, right now" and nothing more. */
.item.working{border-color:var(--brand-line)}
.item .bar{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--brand-soft);overflow:hidden}
.item .bar::after{content:"";position:absolute;top:0;bottom:0;width:38%;background:var(--brand);
  animation:sweep 1.15s ease-in-out infinite}
/* Queued gets no bar at all. A progress bar is a claim that something is
   happening to this comment, and nothing is — it is sitting in a brief nobody
   has opened. The word "queued" on the card is the whole truth of it. */
@media (prefers-reduced-motion:reduce){
  .item .bar::after,#composer.working::before{animation:none;left:0;width:100%;opacity:.55}
  #pwork .spin{animation:none}
}
/* Addressed comments stay in the list — done is not the same as gone, and the
   only way to say "not like that" is to still be able to see it. The green rule
   along the foot is the whole tell: the card is not dimmed or dashed, because
   it is still live, and a comment you can still argue with should not look
   switched off. */
.item.done{border-color:color-mix(in srgb,var(--ok) 30%,var(--line));padding-bottom:9px}
.item .donebar{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--ok)}
.item.done .thread{color:var(--ok)}
/* Dealt with, but not on the page you are looking at yet. Green because it is
   done, a button because the thing it is telling you about is one click away. */
.item .landedtag{flex:none;font:600 9.5px/1 var(--mono);letter-spacing:.03em;text-transform:uppercase;
  color:var(--ok);background:var(--ok-soft);border:1px solid color-mix(in srgb,var(--ok) 32%,transparent);
  border-radius:999px;padding:3px 6px;white-space:nowrap}
.item .landedtag:hover{background:color-mix(in srgb,var(--ok) 18%,var(--surface))}
.item .isend{flex:none;width:18px;height:18px;margin:-2px 0;border-radius:5px;color:var(--ink-3);
  display:grid;place-items:center;opacity:0}
.item .isend svg{width:13px;height:13px;display:block}
.item:hover .isend,.item .isend:focus-visible{opacity:1}
.item .isend:hover{color:var(--brand);background:var(--brand-soft)}
.item .imore{flex:none;width:18px;height:18px;margin:-2px 0;border-radius:5px;color:var(--ink-3);
  font-size:13px;line-height:1;display:grid;place-items:center;opacity:0}
.item:hover .imore,.item .imore:focus-visible,.item .imore[aria-expanded=true]{opacity:1}
.item .imore:hover,.item .imore[aria-expanded=true]{color:var(--ink);background:var(--surface-2)}
/* Fixed, not absolute: the list scrolls and the panel clips its overflow, and
   no z-index wins against an ancestor that is cutting you off. Placed from the
   button's own box when it opens. */
.item .imenu{position:fixed;z-index:70;background:var(--surface);
  border:1px solid var(--line-2);border-radius:8px;box-shadow:var(--shadow-pop);padding:4px;min-width:104px}
.item .imenu[hidden]{display:none}
.item .imenu button{display:block;width:100%;text-align:left;font:500 11px/1 var(--font);
  color:var(--ink-2);padding:6px 8px;border-radius:5px;white-space:nowrap}
.item .imenu button:hover{background:var(--surface-2);color:var(--brand)}
/* The × every card carries: one way to take something off this list, in the one
   place a close sits. Quiet until the card is under the cursor, never quiet for
   a keyboard. */
.item .ikill{flex:none;width:18px;height:18px;margin:-2px -3px -2px 0;border-radius:5px;
  color:var(--ink-3);font-size:14px;line-height:1;display:grid;place-items:center;opacity:0}
.item:hover .ikill,.item .ikill:focus-visible{opacity:1}
.item .ikill:hover{color:var(--brand);background:var(--brand-soft)}
.item .tmsg{position:relative;padding-right:18px}
.item .tkill{position:absolute;top:-1px;right:0;width:16px;height:16px;border-radius:4px;
  color:var(--ink-3);font-size:12px;line-height:1;display:grid;place-items:center;opacity:0}
.item .tmsg:hover .tkill,.item .tkill:focus-visible{opacity:1}
.item .tkill:hover{color:var(--brand);background:var(--brand-soft)}
.empty{color:var(--ink-3);font-size:12.5px;text-align:center;line-height:1.6}
.grouphd{font:650 10.5px/1 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);
  margin:12px 2px 7px;display:flex;align-items:center;gap:6px}
.grouphd:first-child{margin-top:2px}
.grouphd.tog{width:100%;text-align:left;font:inherit;font-weight:650;font-size:10.5px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.grouphd.tog:hover{color:var(--ink)}
.grouphd .caret{font-size:9px;opacity:.7}
.grouphd::after{content:"";flex:1;height:1px;background:var(--line)}

/* vstack:shell scrubber-css */
/* The scrubber: one control for moving along an ordered set of states.
   `spec` and `wireframe` scrub versions, `phase-preview` scrubs release
   phases — same control, different axis, so it lives here rather than being
   written a third time. The page supplies the stops and decides what showing
   one means; everything below is how it looks and behaves. */
#timeline{border-top:1px solid var(--line);background:var(--surface);padding:9px 16px 12px;
  display:flex;align-items:center;gap:12px;z-index:20}
#timeline .step{width:24px;height:24px;border-radius:6px;color:var(--ink-2);display:grid;place-items:center;flex:none}
#timeline .step:hover{background:var(--surface-2);color:var(--ink)}
#timeline .step[disabled]{opacity:.3;cursor:default}
#timeline .step[disabled]:hover{background:none}
#tlTrack{flex:1;position:relative;height:26px;min-width:120px;cursor:pointer}
#tlTrack::before{content:"";position:absolute;left:0;right:0;top:11px;height:3px;border-radius:2px;background:var(--line)}
#tlFill{position:absolute;left:0;top:11px;height:3px;border-radius:2px;background:var(--brand-line)}
#tlTrack .tick{position:absolute;top:7px;width:11px;height:11px;border-radius:50%;background:var(--surface);
  border:2px solid var(--line-2);transform:translateX(-50%)}
#tlTrack .tick.past{border-color:var(--brand-line)}
#tlTrack .tick:hover{border-color:var(--brand)}

  border:3px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.3);transform:translateX(-50%);
  cursor:grab;z-index:3}
#tlHandle:active{cursor:grabbing}
#tlMeta{flex:none;max-width:330px;min-width:0;font-size:11.5px;color:var(--ink-3);line-height:1.35}
#tlMeta b{color:var(--ink);font-weight:650;font-family:var(--mono);font-size:11px}
#tlMeta .lab{color:var(--ink-2)}
#tlMeta .row{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* /vstack:shell scrubber-css */

#btnClearHistory{flex:none;min-height:28px;padding:0 9px;border:1px solid var(--line-2);border-radius:7px;
  color:var(--ink-3);font-size:11px;white-space:nowrap;background:var(--surface)}
#btnClearHistory:hover:not(:disabled){border-color:var(--brand-line);color:var(--brand);background:var(--surface-2)}
#btnClearHistory:disabled{opacity:.35;cursor:default}
#btnClearHistory[hidden],body.phase #btnClearHistory{display:none}
@media(max-width:720px){#btnClearHistory{width:28px;padding:0;font-size:0}#btnClearHistory::before{content:"⌫";font-size:15px}}

/* ── floating banners — the shell's .banner/.dark/.good; only what this page
   adds on top lives here ── */
/* Two pieces of news can land at once — a version and a link. Stack them
   rather than let the later one hide the earlier. */
.banner.on ~ .banner.on{top:104px}
.banner.on ~ .banner.on ~ .banner.on{top:150px}
.banner .btn{height:25px;font-size:11.5px}
#workBanner .txt,#shareBanner .txt{min-width:0;overflow:hidden;text-overflow:ellipsis}

#zoombar{position:absolute;left:12px;bottom:12px;display:flex;gap:2px;align-items:center;background:var(--surface);
  border:1px solid var(--line-2);border-radius:8px;padding:3px;box-shadow:var(--shadow-pop);z-index:20}
#zoombar button{width:26px;height:24px;border-radius:5px;color:var(--ink-2);display:grid;place-items:center;font-size:14px}
#zoombar button:hover{background:var(--surface-2);color:var(--ink)}
#zoombar .z{min-width:44px;text-align:center;font:600 11px/1 var(--mono);color:var(--ink-2)}

/* ── modal ── */
.confirmDialog{width:min(440px,calc(100% - 32px));padding:0;border:1px solid var(--line-2);border-radius:12px;
  background:var(--surface);color:var(--ink);box-shadow:var(--shadow-pop)}

.confirmDialog .modalbody{padding:20px 20px 16px}
.confirmDialog h2{margin:0 0 9px;font-size:17px;line-height:1.25}
.confirmDialog p{margin:0;color:var(--ink-2);font-size:13px;line-height:1.55}
.confirmDialog .kept{margin-top:10px;padding:9px 10px;border-radius:7px;background:var(--surface-2);

  border-top:1px solid var(--line);background:var(--surface-2)}
.confirmDialog .danger{background:var(--brand);border-color:var(--brand);color:#fff}
.confirmDialog .danger:hover{filter:brightness(1.08)}
.confirmDialog .danger:disabled{opacity:.45;filter:none}
</style>

<script id="bundle" type="application/json">null</script>
<script>
/* vstack:shell js */
/* The behaviour behind the top bar: theme, language, the link dot, and the
   page's own name. Everything else — what the page does — is the page's.

   Nothing here touches the network or the document beyond the bar, so a page
   works identically served, opened off disk, or published as an Artifact. */
window.VSShell = (function () {
  const $ = s => document.querySelector(s);
  const KEY = { theme: 'vstack:theme', lang: 'vstack:lang', seen: 'vstack:update-seen' };
  const store = {
    get (k, d) { try { return localStorage.getItem(k) ?? d } catch { return d } },
    set (k, v) { try { localStorage.setItem(k, v) } catch {} },
  };

  /* ── theme: auto (whatever the OS says) / light / dark ──
     Auto is the absence of an override, so the page keeps following the system
     if it changes while open — and an Artifact viewer's own toggle still wins
     the same way it does on a page that never had this control. */
  let theme = store.get(KEY.theme, 'auto');
  function applyTheme () {
    if (theme === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', theme);
    document.querySelectorAll('#themeSwitch button').forEach(b => {
      b.setAttribute('aria-pressed', String(b.dataset.themeSet === theme));
    });
  }
  function setTheme (next) {
    theme = ['auto', 'light', 'dark'].includes(next) ? next : 'auto';
    store.set(KEY.theme, theme);
    applyTheme();
  }

  /* ── language: chrome only. Page content stays as authored. ── */
  const storedLang = store.get(KEY.lang, null);
  let lang = storedLang === 'zh' ? 'zh' : 'en';
  const langListeners = [];
  function applyLang () {
    // zh-CN, not zh: the specific tag is what picks the right font and
    // line-breaking for simplified Chinese.
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    document.querySelectorAll('#langSwitch button').forEach(b => {
      b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
    });
    langListeners.forEach(fn => { try { fn(lang) } catch {} });
    paintLink();
  }
  function setLang (next) {
    lang = next === 'zh' ? 'zh' : 'en';
    store.set(KEY.lang, lang);
    applyLang();
  }

  /* ── the live link, said out loud ── */
  /* Three states, not two. "The page reached its server" and "an agent session
     is waiting to read what you send" are different facts, and only the second
     is the one anyone actually wants to know. `watching` undefined means the
     page has no way to tell, and the dot behaves as it always did. Host name
     comes from window.__VSTACK_HOST__ (contracts/host.md), so no page bakes a
     product name in; the words live here, in both languages, so no page
     repeats them either. A page with something more specific to say passes
     `labels` to setLink and only those keys win. */
  let linked = null, linkLabels = null, watching;
  function linkWords () {
    const agent = window.__VSTACK_HOST__?.name || 'agent';
    return lang === 'zh' ? {
      on: `已连接 ${agent}`, off: '连接已断开', idle: '未连接',
      idleTitle: `页面是通的，但没有 ${agent} 会话在等待——发送的内容会一直留在这里，直到有会话接手。`,
      offTitle: `${agent} 会话已不再提供此页面——你写的内容只保存在这个标签页里。`,
    } : {
      on: `LINKED TO ${String(agent).toUpperCase()}`, off: 'LINK LOST', idle: 'UNLINKED',
      idleTitle: `This page is live, but no ${agent} session is waiting for it — what you send will sit here until one is.`,
      offTitle: `The ${agent} session is no longer serving this page — anything you write stays in this tab.`,
    };
  }
  function paintLink () {
    const el = $('#linkDot');
    if (!el || linked === null) return;
    el.hidden = false;
    const idle = linked && watching === false;
    el.classList.toggle('on', linked && !idle);
    el.classList.toggle('idle', !!idle);
    const words = linkWords();
    el.textContent = !linked ? (linkLabels?.off ?? words.off)
      : idle ? (linkLabels?.idle ?? words.idle)
      : (linkLabels?.on ?? words.on);
    el.title = !linked ? (linkLabels?.offTitle ?? words.offTitle)
      : idle ? (linkLabels?.idleTitle ?? words.idleTitle) : '';
  }
  function setLink (up, labels, isWatching) {
    linked = !!up;
    if (labels) linkLabels = labels;
    if (isWatching !== undefined) watching = isWatching;
    paintLink();
  }
  /** The server saying who is listening now, without the page repeating itself. */
  function setWatching (isWatching) {
    if (watching === isWatching) return;
    watching = isWatching;
    paintLink();
  }
  const hideLink = () => { const el = $('#linkDot'); if (el) el.hidden = true };

  /* ── one live-link client, instead of one per page ──
     Wires the dot to a server: SSE when the page has an event stream, a plain
     poll for a server that only answers /ping. Either way the shell owns the
     socket-to-dot translation and the page only hears about its own events.

       VSShell.connect({ url, on: { push: ev => apply(ev) }, onLink })
       VSShell.connect({ poll: '/ping', onLink })

     SSE reconnects on its own, so the dot only ever reports what is true right
     now. `presence` — who is listening, said by the server rather than guessed
     from the socket — is handled here; every other event is the page's. */
  function connect (opts = {}) {
    const say = up => { setLink(up); try { opts.onLink?.(up) } catch {} };
    if (opts.poll) {
      const tick = async () => {
        try { const r = await fetch(opts.poll, { cache: 'no-store' }); say(r.ok) }
        catch { say(false) }
      };
      tick();
      const timer = setInterval(tick, opts.interval || 5000);
      return { stop: () => clearInterval(timer) };
    }
    const es = new EventSource(opts.url);
    es.onopen = () => say(true);
    es.onerror = () => say(false);
    es.addEventListener('presence', ev => {
      try { setWatching(JSON.parse(ev.data).watching) } catch {}
    });
    for (const [name, fn] of Object.entries(opts.on || {})) es.addEventListener(name, fn);
    return { stop: () => es.close(), source: es };
  }

  /* ── a toast: the page saying "done" without stopping anyone ── */
  let toastTimer = null;
  function toast (msg, ms = 2200) {
    let el = document.querySelector('.vs-toast');
    if (!el) { el = document.createElement('div'); el.className = 'vs-toast'; document.body.appendChild(el) }
    el.textContent = msg;
    el.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('on'), ms);
  }

  /* ── two-step confirm on one button ──
     First press arms it (class `armed`, plus whatever `arm` repaints); a second
     press inside the window fires; the window closing quietly disarms. The
     page styles `armed` and words the button — this owns only the dance. */
  function armConfirm (btn, { onConfirm, arm, disarm, ms = 4000 } = {}) {
    let timer = null;
    const reset = () => { timer = null; btn.classList.remove('armed'); try { disarm?.() } catch {} };
    btn.addEventListener('click', () => {
      if (timer) { clearTimeout(timer); reset(); onConfirm(); return }
      btn.classList.add('armed');
      try { arm?.() } catch {}
      timer = setTimeout(reset, ms);
    });
    return { armed: () => timer !== null, disarm: () => { if (timer) { clearTimeout(timer); reset() } } };
  }

  function name (pageName, eyebrow) {
    const n = $('#pageName'); const e = $('#pageEyebrow');
    if (n && pageName != null) n.textContent = pageName;
    if (e && eyebrow != null) e.textContent = eyebrow;
  }

  /** Mark the tool itself as unfinished. `false` takes it off again. */
  function wip (on, label) {
    const el = $('#wip');
    if (!el) return;
    el.hidden = !on;
    el.textContent = label || 'Work in progress';
  }

  /* ── a newer Visual Stack than this one ──
     The server looked it up before serving this page and left the answer on
     `window.__VSTACK_UPDATE__`; nothing here reaches the network. Dismissal is
     remembered per version, so saying "not now" to 4.2 stays said, and 4.3
     asks once. */
  function updateNotice () {
    const info = window.__VSTACK_UPDATE__;
    // Dismissal is per release: saying "not now" to this one stays said, and
    // the next one asks once.
    if (!info?.title || store.get(KEY.seen, '') === info.title) return;
    const bar = document.createElement('div');
    bar.className = 'vs-update';
    bar.innerHTML =
      `<span class="v">${esc(info.pill || 'new')}</span>` +
      `<span class="t">${esc(info.title)}</span>` +
      `<button class="how">How</button><button class="no" aria-label="Dismiss">×</button>`;
    const how = document.createElement('div');
    how.className = 'vs-update-how';
    how.hidden = true;
    const lead = info.howLead || 'To update:';
    how.innerHTML = `<p>${esc(lead)}</p><pre>${esc((info.install || []).join('\n'))}</pre>` +
      (info.auto ? `<p class="auto">${esc(info.auto)}</p>` : '') +
      (info.url ? `<a href="${esc(info.url)}" target="_blank" rel="noopener">What changed</a>` : '');
    bar.appendChild(how);
    bar.querySelector('.how').onclick = () => { how.hidden = !how.hidden };
    bar.querySelector('.no').onclick = () => { store.set(KEY.seen, info.title); bar.remove() };
    const top = $('.vs-topbar');
    if (top) top.insertAdjacentElement('afterend', bar);
  }
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  /* The cog: one button for the two choices nobody makes twice. */
  function wireSettings () {
    const btn = $('#settingsBtn'), menu = $('#settingsMenu');
    if (!btn || !menu) return;
    const open = on => { menu.hidden = !on; btn.setAttribute('aria-expanded', String(on)) };
    btn.addEventListener('click', e => { e.stopPropagation(); open(menu.hidden) });
    menu.addEventListener('click', e => e.stopPropagation());
    document.addEventListener('click', () => open(false));
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !menu.hidden) open(false) });
  }

  function init (opts = {}) {
    document.querySelectorAll('#themeSwitch button').forEach(b => {
      b.addEventListener('click', () => setTheme(b.dataset.themeSet));
    });
    document.querySelectorAll('#langSwitch button').forEach(b => {
      b.addEventListener('click', () => setLang(b.dataset.lang));
    });
    if (opts.onLang) langListeners.push(opts.onLang);
    // `defaultLang` is what the artifact was authored in — it opens that way
    // once, and after that the reader's own choice is the one that sticks.
    if (opts.defaultLang && !storedLang) lang = opts.defaultLang === 'zh' ? 'zh' : 'en';
    if (opts.lang) { lang = opts.lang === 'zh' ? 'zh' : 'en'; store.set(KEY.lang, lang) }
    // Not every page sends something back — the form doesn't — so the primary
    // action stays out of the bar unless a page asks for it.
    const send = $('#send');
    if (send && opts.send) send.hidden = false;
    if (opts.wip) wip(true, typeof opts.wip === 'string' ? opts.wip : undefined);
    name(opts.name, opts.eyebrow);

    applyLang();

  }

  const api = {
    init, setTheme, setLang, setLink, setWatching, hideLink, name, wip,
    connect, toast, armConfirm, esc,
    get theme () { return theme },
    get lang () { return lang },
    onLang (fn) { langListeners.push(fn) },

/* ── the scrubber ──
   An ordered set of states and a handle that moves between them: versions on
   the spec and the review workspace, release phases on phase-preview. The
   page says what the stops are and what showing one does; this owns the track,
   the ticks, the drag, and the caption.

     VSScrub.mount({ onPick: id => showThat(id) })
     VSScrub.set({ items: [{ id, cap, label, sub }], active: id })

   `cap` is the label under the tick (v3, P2), `label` names the stop, and
   `sub` is the line beneath it — both are escaped here, so a page never has to
   remember to. */
window.VSScrub = (function () {
  const $ = s => document.querySelector(s);
  const esc = s => window.VSShell.esc(s ?? '');
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  let items = [];
  let active = null;
  let onPick = () => {};
  let wired = false;

  const index = () => Math.max(0, items.findIndex(i => i.id === active));
  const pct = i => items.length < 2 ? 100 : (i / (items.length - 1)) * 100;

  function pickAt (clientX) {
    const track = $('#tlTrack');
    if (!track || !items.length) return null;
    const r = track.getBoundingClientRect();
    return items[Math.round(clamp((clientX - r.left) / r.width, 0, 1) * (items.length - 1))]?.id;
  }
  function pick (id) {
    if (id == null || id === active) return;
    active = id;
    paint();
    onPick(id);
  }
  const step = d => { const n = items[index() + d]; if (n) pick(n.id) };

  function paint () {
    const track = $('#tlTrack');
    if (!track) return;
    const i = index();
    track.querySelectorAll('.tick').forEach(t => t.remove());
    items.forEach((it, k) => {
      const t = document.createElement('div');
      t.className = 'tick' + (k <= i ? ' past' : '');
      t.style.left = pct(k) + '%';
      t.innerHTML = `<span class="cap">${esc(it.cap)}</span>`;
      if (it.label) t.title = it.label;
      t.onclick = e => { e.stopPropagation(); pick(it.id) };
      track.appendChild(t);
    });
    $('#tlHandle').style.left = pct(i) + '%';
    $('#tlFill').style.width = pct(i) + '%';
    const cur = items[i];
    $('#tlMeta').innerHTML = cur
      ? `<div class="row"><b>${esc(cur.cap)}</b> <span class="lab">${esc(cur.label)}</span></div>` +
        `<div class="row">${esc(cur.sub)}</div>`
      : '';
    $('#tlPrev').disabled = i === 0;
    $('#tlNext').disabled = i >= items.length - 1;
  }

  function mount (opts = {}) {
    if (opts.onPick) onPick = opts.onPick;
    if (wired || !$('#tlTrack')) return api;
    wired = true;
    $('#tlPrev').onclick = () => step(-1);
    $('#tlNext').onclick = () => step(1);
    $('#tlHandle').addEventListener('pointerdown', e => {
      e.preventDefault();
      const mv = ev => pick(pickAt(ev.clientX));
      const up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up) };
      addEventListener('pointermove', mv); addEventListener('pointerup', up);
    });
    $('#tlTrack').addEventListener('pointerdown', e => {
      if (e.target.closest('#tlHandle, .tick')) return;
      pick(pickAt(e.clientX));
    });
    return api;
  }

  const api = {
    mount,
    set ({ items: list, active: a }) {
      if (list) items = list;
      if (a !== undefined) active = a;
      if (active == null && items.length) active = items[items.length - 1].id;
      paint();
      return api;
    },
    /** Move one stop back or forward — what arrow keys and the ‹ › buttons do. */
    step,
    get active () { return active },
    get items () { return items },
  };
  return api;
})();
