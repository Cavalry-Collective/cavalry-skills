  historyClearedAt: null, clearingHistory: false,
  mode: 'annotate',
  size: SIZES[1],
  zoom: 1,
  ann: [], carried: [],
  sel: null,
  // Comments whose element is not on the page as it stands right now.
  offscreen: new Set(),
  // Threads opened in the panel, and which reply box the cursor is in.
  threadOpen: new Set(), focusReply: null,
  awaiting: false, pendingUpdate: null, sentSig: null,
  activeRoundId: null,
  queued: new Set(),      // sent, but the brief has not been collected yet
  collected: new Set(),   // ids Claude has taken delivery of
  landed: new Set(),      // dealt with by a version this page has not adopted yet
  landedVersion: null,
  // Which comments went out with the last send and have not come back yet.
  working: new Set(),
  /* Sent while a round was already collected and underway. Nothing goes on the
     wire: the ids wait here — and as a `held` flag on the comment itself, which
     is what survives a reload — then go out as one batch when the round ends. */
  held: new Set(),
  // A stop has been asked for and the round has not ended yet.
  stopping: false,
  linked: null,   // null until the connection has actually said one way or other
  // The shareable Artifact: asked for here, published by Claude, link comes back.
  share: { url: null, version: null, pending: false },
  doneOpen: false,        // the Addressed group, which starts folded
  // Live review only: the app's origin, where the frame starts, and which route
  // it is showing right now. A comment belongs to the route it was made on.
  app: null, startPath: '/', route: null,
  // The frame followed a link off the site: another origin, nothing readable.
  offsite: false,
};
const isHistory = () => S.viewing !== S.version;
/** The frame holds a running app, not a file we published. */
const live = () => S.runtime === 'live';
/** There is a session on the other end: it can be sent to, replied to, stopped. */
const served = () => S.runtime === 'local' || S.runtime === 'live';

/* ─────────────────────────── boot ─────────────────────────── */

async function boot () {
  const inline = JSON.parse($('#bundle').textContent || 'null');
  let data = inline;
  if (!data) {
    try { data = await (await fetch(API + '/project')).json() }
    catch {
      document.body.innerHTML = '<div class="empty" style="padding:80px">Could not reach the review server.<br>Start it with <code>node review-server.mjs serve --file &lt;page.html&gt;</code>.</div>';
      return;
    }
  }
  S.runtime = data.mode || (inline ? 'artifact' : 'local');
  S.name = data.name || 'Wireframe';
  S.fileName = data.fileName || 'page.html';
  S.html = data.html || '';
  S.versions = data.versions || [];
  S.reviews = data.reviews || {};
  S.version = S.viewing = data.currentVersion || 1;
  S.historyClearedAt = data.historyClearedAt || null;
  S.app = data.app || null;
  S.startPath = data.startPath || '/';
  if (live()) S.route = S.startPath;
  adoptShare(data);
  VSShell.setWatching(data.watching);

  const phase = S.runtime === 'phase';
  loadAnnotations();
  /* A round in flight belongs to the review, not to the tab that started it.
     The brief on disk names the comments that went out, so a reload — or a
     second tab — picks the progress back up instead of showing a workspace
     where nothing ever happened. */
  S.activeRoundId = data.activeReview?.id || null;
  const out = data.activeReview?.comments || data.pendingReview?.comments;
  if (out?.length) {
    S.awaiting = true;
    const sentAt = data.pendingReview?.sentAt || data.activeReview?.createdAt;
    const at = sentAt || new Date().toISOString();
    for (const id of out) { const a = annById(id); if (a && !a.sentAt) a.sentAt = at }
    setWorking(out);
  }
  readFlight(data);
  /* Holds outlive the tab that made them: the flag rides the saved annotation.
     A round still out keeps them held; a review at rest gets them now — the
     send the closing tab still owed. */
  S.held = new Set(S.ann
    .filter(a => a.held && a.status === 'open' && !a.dismissed && hasSubstance(a))
    .map(a => a.id));
  if (S.held.size && !S.working.size && served()) flushHeld();
  // The mark says Visual Stack; the word beside it says which tool this is.
  // Which page you are on is already on the window below, twice.
  VSShell.init({ name: phase ? 'Phase preview' : live() ? 'Live review' : 'Wireframe' });
  document.title = S.name + (phase ? ' — Phases' : ' — Review') + ' · Visual Stack';
  $('#urlBar').textContent = live() ? S.route : S.fileName;
  LANG = VSShell.lang;
  buildSizes(); wireChrome(); wireComposer(); buildTimeline(); applyLang();
  if (live()) enterLiveMode();
  if (phase) enterPhaseMode(); else setMode('annotate');
  loadFrame(); render();
  if (served()) liveReload();
}

/** Claude spoke last and nobody has answered — the one state that stalls a round. */
const awaitsReply = a => a.status === 'question' ||
  (a.status !== 'addressed' && isAgent((a.replies || []).at(-1)?.by));

function loadAnnotations () {
  const local = S.runtime === 'artifact' ? lsGet() : null;
  S.ann = (local ?? S.reviews[S.version]?.annotations ?? []).map(normalise);
  // Anything Claude has said back is waiting on you, whether or not it was
  // filed as a question — open the thread so the words are visible and the box
  // to answer in is already there.
  for (const a of S.ann) if (awaitsReply(a)) S.threadOpen.add(a.id);
  /* What earlier versions still have to say. Open comments ride along because
     they are unfinished — and so do addressed ones, because "Claude changed it"
     is not the same as "that was the change I wanted". A comment leaves the
     screen when the reviewer dismisses it, and not before. Versions iterate in
     order, so a later copy of the same comment overwrites an earlier one. */
  const ghosts = new Map();
  for (const [v, rev] of Object.entries(S.reviews)) {
    if (Number(v) >= S.version) continue;
    for (const a of rev.annotations || []) {
      if (a.status !== 'open' && a.status !== 'addressed') continue;
      ghosts.set(a.id, { ...normalise(a), fromVersion: Number(v) });
    }
  }
  for (const a of S.ann) ghosts.delete(a.id);   // this version's copy is the live one
  S.carried = [...ghosts.values()].filter(a => !a.dismissed);
}
// status: open (waiting on Claude) · question (Claude asked, waiting on you) ·
// addressed (Claude changed it). Only Claude moves a comment to addressed.
const normalise = a => ({ status: 'open', note: '', size: 'desktop', replies: [], ...a });
const lsKey = () => `vstack:review:${S.fileName}:v${S.version}`;
const lsGet = () => { try { return JSON.parse(localStorage.getItem(lsKey())) } catch { return null } };

let saveTimer = null;
function save () {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    // A comment being composed is not feedback yet — it never leaves the tab
    // until it has words, so closing the browser mid-thought leaves no trace.
    const real = S.ann.filter(hasSubstance);
    if (S.runtime === 'artifact') { try { localStorage.setItem(lsKey(), JSON.stringify(real)) } catch {} ; return }
    try {
      await fetch(API + '/annotations', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ version: S.version, annotations: real }),
      });
    } catch {}
  }, 700);
}

/** Claude edits the file while it is open here. Never swap the page out from
    under the reviewer — announce it, let them pick the moment. */
function liveReload () {
  // The shell owns the socket-to-dot translation, `presence` included; this
  // page only hears about its own `reload` events and remembers the link
  // state for its own logic.
  VSShell.connect({
    url: API + '/events',
    onLink: up => { S.linked = up },
    on: { reload: onReloadEvent },
  });
}
async function onReloadEvent () {
  let data;
  try { data = await (await fetch(API + '/project')).json() } catch { return }
  // The link can land on its own, without the page or the review moving.
  adoptShare(data, true);
  VSShell.setWatching(data.watching);
  if (data.historyClearedAt && data.historyClearedAt !== S.historyClearedAt) {
    applyHistoryClear(data);
    toast(T('historyCleared'));
    return;
  }
  /* A stop that has been taken: the server drops the brief when it records the
     request, so a brief that is gone while we are stopping means the round is
     over whether or not anyone is still listening — which is the whole reason
     Stop used to hang forever.

     ONLY while stopping. A missing brief otherwise means Claude picked it up
     and deleted it, which is the *start* of the work, not the end of it —
     reading that as "round over" is what took the progress bars off comments
     the moment anything else touched the store. */
  const finishedRound = readFlight(data);   // collected, active, or complete?
  const bumped = (data.currentVersion || 1) !== S.version;
  if (!bumped && data.html === S.html) {
    // Only the conversation moved — fold it in without touching the page.
    const latest = new Map();
    for (const version of Object.keys(data.reviews || {}).map(Number).sort((a, b) => a - b)) {
      for (const comment of data.reviews?.[version]?.annotations || []) latest.set(comment.id, comment);
    }
    const conversationChanged = mergeThreads([...latest.values()]);
    if (finishedRound) {
      const stopped = S.stopping;
      roundEnded();
      if (stopped) toast(T('stopped'));
    }
    if (conversationChanged) {
      render();
      if (S.sel) openComposer(S.sel, false);
      toast(T('replied'));
    }
    return;
  }
  S.pendingUpdate = data;
  // Mid-edit saves are not news — the comments being worked on already say so.
  // Only a version that has actually landed is worth interrupting for.
  if (bumped) {
    closeAddressed(data);
    const meta = (data.versions || []).find(v => v.n === data.currentVersion);
    showWork((live() ? T('roundReady')(data.currentVersion) : T('ready')(data.currentVersion))
      + (meta?.label ? ' — ' + esc(meta.label) : ''));
  } else if (!S.awaiting) showWork(live() ? T('appChanged') : T('changed'));
}
function showWork (html) {
  $('#workBanner').classList.add('on');
  $('#workText').innerHTML = '<span class="tick">✓</span> ' + html;
}
const hideWork = () => $('#workBanner').classList.remove('on');

/** Is the session on the other end still there? Silent until it knows — a dot
    that says "lost" during the first handshake is just wrong. */
function setLink (up) {
  S.linked = up;
  if (!served() || up === null) { VSShell.hideLink(); return }
  VSShell.setLink(up);
}

/* ─────────────── work in flight ───────────────
   A sent comment is out of the reviewer's hands until Claude publishes or
   answers. Saying so on the comment itself — and offering to call it off there —
   beats a banner that covers the page it is talking about. */
const setWorking = ids => { S.working = new Set(ids); renderPanel() };

/* Sent is not the same as being worked on. A brief sits in the store until
   Claude collects it, and a comment added to a round already underway waits in
   the next brief — so the workspace can tell the two apart without guessing:
   anything in a brief still on disk is queued; everything else that went out
   has been collected, and is being worked on. */
function readFlight (data) {
  const brief = data?.pendingReview?.comments;
  const active = data?.activeReview;
  const wasActive = S.activeRoundId;
  if (active) {
    S.activeRoundId = active.id;
    S.working = new Set(active.comments || []);
    S.awaiting = true;
  } else if (wasActive) {
    S.activeRoundId = null;
    S.working.clear();
  }
  const next = new Set(brief ? brief.filter(id => !S.collected.has(id)) : []);
  // The cards carry this, not just the strip: collecting a brief turns "queued"
  // into "being worked on", and repainting only the strip left every card
  // saying queued while the strip said Claude was working on them.
  const moved = next.size !== S.queued.size || [...next].some(id => !S.queued.has(id));
  S.queued = next;
  if (active && !data?.pendingReview) for (const id of S.working) S.collected.add(id);
  moved ? renderPanel() : renderWork();
  return !!wasActive && !active;
}
function clearWorking () {
  if (!S.working.size) return;
  S.working.clear();
  renderPanel();
}
function renderWork () {
  // A comment Claude has finished with, or asked about, is no longer in flight.
  // Carried comments go out with a round too, so look for them as well — a
  // reloaded workspace reads its in-flight list from the brief, which has both.
  for (const id of [...S.working]) {
    const a = annById(id);
    if (!a || a.dismissed || a.status !== 'open') S.working.delete(id);
  }
  for (const id of [...S.queued]) if (!S.working.has(id)) S.queued.delete(id);
  // Held comments are waiting too — just here rather than in a brief on disk.
  const n = S.working.size, q = S.queued.size, h = S.held.size;
  // Claude answering or addressing the last comment in flight ends the round
  // just as surely as publishing does — the button has to come back.
  if (!n && S.stopping) { S.stopping = false; S.awaiting = false }
  $('#pwork').hidden = !n;
  if (n) $('#pworkText').textContent = S.stopping ? T('stopping')
    : q === n && !h ? T('queuedOn')(q)
    : q + h ? T('workingAndQueued')(n - q, q + h)
    : T('workingOn')(n);
  $('#btnCancel').disabled = S.stopping;
  composer.classList.toggle('working', !!S.sel && S.working.has(S.sel));
}

/** Stop, rather than let Claude finish something the reviewer no longer wants.
    This raises a request; it cannot reach into a turn already running. Claude
    checks for it at each checkpoint in the round and stops there — so the
    button says "Stopping…" until the round actually ends, rather than
    pretending the work died the instant it was pressed. */
async function cancelWork () {
  if (S.stopping || !S.working.size) return;
  const ids = [...S.working];
  if (!served()) { clearWorking(); S.awaiting = false; return }
  S.stopping = true;
  renderCounts(); renderWork();
  try {
    await fetch(API + '/cancel', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ version: S.version, comments: ids, reason: 'The reviewer stopped this round from the workspace.' }),
    });
    // Sending the same review again has to be possible after calling it off.
    S.sentSig = null;
    toast(T('stopAsked'));
  } catch {
    S.stopping = false;
    renderCounts(); renderWork();
    toast(T('cancelFail'));
  }
}

/** The round is over — however it ended. Claude publishing, replying or
    closing the review all land here, and the button goes back to Send. */
function roundEnded () {
  const stopped = S.stopping;
  S.stopping = false;
  S.awaiting = false;
  clearWorking();
  renderCounts();
  /* The queue fires as the round ends — one round out at a time is the deal.
     Not after a Stop: the reviewer just said "not now", and firing the next
     batch on the heels of that would be the opposite of stopping. What is held
     goes out with their next Send instead. */
  if (!stopped) flushHeld();
}

/** Everything held back during the round, out as one send. The set is cleared
    before the send starts, so a second call is a no-op rather than a second
    brief. */
function flushHeld () {
  if (!S.held.size) return;
  const ids = [...S.held].filter(id => {
    const a = annById(id);
    return a && !a.dismissed && a.status !== 'addressed' && hasSubstance(a);
  });
  S.held.clear();
  for (const a of S.ann.concat(S.carried)) delete a.held;
  if (ids.length) openSend(ids);
  else { save(); renderPanel(); }
}

/** Fold in what arrived from the server without rolling back a local action
    that is still inside the autosave window. The longer thread wins; a local
    dismissal or explicit reopen also wins until the server has received it. */
function mergeThreads (serverAnn) {
  let changed = false, asked = false;
  for (const sa of serverAnn) {
    const local = annById(sa.id);
    if (!local) { S.ann.push(normalise(sa)); changed = true; continue }
    // Dismissal is a deliberate tombstone. A stale reload may still carry the
    // visible server copy, but it must never make the card reappear.
    if (local.dismissed) continue;
    const sr = (sa.replies || []).length, lr = (local.replies || []).length;
    // Claude has said something — open that thread in the list, where the
    // answer is going to be typed. A shorter server thread is simply older
    // than the reply the reviewer just wrote, so leave the local one alone.
    if (sr > lr) {
      local.replies = sa.replies || [];
      S.threadOpen.add(local.id); changed = true;
      if (isAgent((sa.replies || []).at(-1)?.by)) asked = true;
    }
    const localAhead = lr > sr;
    const locallyReopened = local.status === 'open' && !!local.reopenedAt && sa.status === 'addressed';
    if (sa.status !== local.status && !localAhead && !locallyReopened) {
      local.status = sa.status;
      if (sa.status === 'question') { S.threadOpen.add(local.id); asked = true }
      // A comment that has been addressed again starts clean: whatever was
      // asked for on the way here has now been answered.
      if (sa.status === 'addressed') { delete local.revert; delete local.reopenedAt }
      changed = true;
    }
  }
  // A question stalls the round, so it should not wait behind a closed drawer.
  if (asked) setPanel(true);
  return changed;
}

/**
 * A published version finishes the comments it names, and only those. The round
 * is over when nothing is left in flight.
 *
 * Both ways of learning about a new version end up here — the announcement and
 * the refresh you take afterwards. They were two copies of this rule, so fixing
 * one left the other putting comments back to Open the moment you looked at the
 * change they were not part of.
 */
function closeAddressed (data) {
  const closed = (data.versions || []).find(v => v.n === data.currentVersion)?.addressed || [];
  /* A landed version has already dealt with these, but the page you are looking
     at is still the old one and their status here is still open. The banner
     announces the version; the cards say which comments it was about, and are
     the second way to bring it in. Cleared when the new version is adopted. */
  for (const id of closed) S.landed.add(id);
  if (closed.length) S.landedVersion = data.currentVersion;
  for (const id of closed) { S.working.delete(id); S.queued.delete(id) }
  if (!S.working.size) roundEnded();
  /* Always repaint. `roundEnded` only refreshes the counts, and `clearWorking`
     returns early when the set is already empty — so a version that finished
     everything left the cards exactly as they were: still queued, still open,
     still claiming to be worked on, next to a banner saying it was all done. */
  renderPanel();
}

function adoptUpdate () {
  const data = S.pendingUpdate;
  S.pendingUpdate = null; hideWork();
  if (!data) { loadFrame(true); return }
  const bumped = (data.currentVersion || 1) !== S.version;
  // Looking at a change is not finishing the work: a mid-round save moves the
  // page and nothing else.
  if (bumped) { closeAddressed(data); S.landed.clear(); S.landedVersion = null }
  S.html = data.html; S.versions = data.versions; S.reviews = data.reviews;
  S.version = data.currentVersion; S.name = data.name || S.name;
  if (bumped) { S.viewing = S.version; loadAnnotations(); S.sentSig = null }
  closeComposer();
  readFlight(data);   // collected, or still sitting in a brief?
  buildTimeline(); loadFrame(); render();
  if (bumped) toast(live() ? T('nowRound')(S.version) : T('nowReviewing')(S.version));
}

/* ───────────────────── chrome & controls ───────────────────── */

function buildSizes () {
  const wrap = $('#sizeSwitch');
  wrap.innerHTML = '';
  for (const s of SIZES) {
    const b = document.createElement('button');
    b.dataset.size = s.id;
    b.title = `${T(s.id)} — ${s.width} × ${s.height}`;
    b.setAttribute('aria-pressed', String(s.id === S.size.id));
    b.innerHTML = `<svg viewBox="0 0 24 24">${s.icon}</svg>`;
    b.onclick = () => setSize(s.id);
    wrap.appendChild(b);
  }
}
function setSize (id) {
  const s = SIZES.find(x => x.id === id);
  if (!s || s.id === S.size.id) return;
  S.size = s;
  $$('#sizeSwitch button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.size === id)));
  closeComposer();
  // The frame height follows the new viewport, so refit before anything reads it.
  applyWindowSize(); fitFrameHeight(); fitZoom(); drawMarks(); renderPanel();
}
/** Re-label every static surface. Comment text is the reviewer's, never ours. */
function applyLang () {
  const mv = $('#modeSwitch [data-mode=view]'), ma = $('#modeSwitch [data-mode=annotate]');
  mv.textContent = T('viewLabel'); mv.title = T('view');
  ma.innerHTML = esc(T('annotateLabel')) + ' <span class="kbd">esc</span>'; ma.title = T('annotate');
  $('#hiNew .lbl').textContent = T('hiNew');
  $('#hiNew').title = T('hiNewTitle');
  $('#btnReload').title = T('reloadTitle');
  $('#btnNow').textContent = T('backToCurrent');
  $('#btnRefresh').textContent = T('reviewChanges');
  $('#btnDismissWork').textContent = T('later');
  $('#btnCopyShare').textContent = T('copyLink');
  $('#btnDismissShare').textContent = T('later');
  if ($('#shareBanner').classList.contains('on')) showShareReady();
  $('#btnCancel').textContent = T('cancel');
  renderApprove(); renderShare();
  composer.querySelector('.csave').innerHTML = esc(T('save')) + ' <span class="kbd">⏎</span>';
  composer.querySelector('.hint').textContent = T('newlineHint');
  setLink(S.linked);
  renderWork();
  $('#phead').querySelector('b').textContent = T('comments');
  $('#btnGeneral').title = T('addGeneral');
  $('#btnGeneral').setAttribute('aria-label', T('addGeneral'));
  $('#btnGeneral').hidden = isHistory();
  renderCounts();   // the primary button says Send or Stop depending on the round
  renderClearDialog();
  renderHistoryButton();
  renderHistoryDialog();
  buildSizes();
  render(); syncTimeline();
  if (S.sel) openComposer(S.sel, false);
}
function setLang (l) {
  if (l === LANG) return;
  LANG = l;
  applyLang();
}

function wireChrome () {
  $$('#modeSwitch button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
  $('#btnClear').onclick = openClearDialog;
  $('#btnCancelClear').onclick = () => $('#clearDialog').close();
  $('#btnConfirmClear').onclick = confirmClearComments;
  $('#clearDialog').onclick = e => { if (e.target === $('#clearDialog')) $('#clearDialog').close() };
  $('#clearDialog').addEventListener('cancel', e => { e.preventDefault(); $('#clearDialog').close() });
  $('#btnClearHistory').onclick = openHistoryDialog;
  $('#btnCancelHistory').onclick = () => $('#historyDialog').close();
  $('#btnConfirmHistory').onclick = confirmClearReviewHistory;
  $('#historyDialog').onclick = e => { if (e.target === $('#historyDialog') && !S.clearingHistory) $('#historyDialog').close() };
  $('#historyDialog').addEventListener('cancel', e => {
    e.preventDefault();
    if (!S.clearingHistory) $('#historyDialog').close();
  });
  VSShell.onLang(setLang);   /* the switch is the shell's; this is the workspace's answer */
  $('#btnReload').onclick = () => S.pendingUpdate ? adoptUpdate() : loadFrame(true);
  $('#btnNow').onclick = () => gotoVersion(S.version);
  $('#btnRefresh').onclick = adoptUpdate;
  $('#btnDismissWork').onclick = hideWork;
  $('#btnCopyShare').onclick = () => { if (S.share.url) copy(S.share.url); hideShare() };
  $('#btnDismissShare').onclick = hideShare;
  $('#btnCancel').onclick = cancelWork;
  // One button, on the panel's edge: it pushes the comments away and pulls them
  // back, so there is never a second control saying the same thing elsewhere.
  $('#panelHandle').onclick = () => setPanel(!document.body.classList.contains('panelopen'));
  $('#btnGeneral').onclick = addGeneral;
  // Open beside the page when there is room for it, away when there is not —
  // and back to that default whenever the window crosses the line, rather than
  // carrying a choice made about one shape over into the other.
  const wide = window.matchMedia('(min-width:721px)');
  setPanel(wide.matches);
  wide.addEventListener('change', e => setPanel(e.matches));
  $('#canvasWrap').addEventListener('scroll', reposition);
  $('#viewportBox').addEventListener('scroll', reposition);
}
let repositionQueued = false;
function reposition () {
  if (repositionQueued) return;
  repositionQueued = true;
  requestAnimationFrame(() => { repositionQueued = false; placeComposer() });
}

/* ───────────────────── the page's window ─────────────────── */

const frame = $('#frame'), overlay = $('#overlay'), browser = $('#browser'),
      vpBox = $('#viewportBox'), scroller = $('#scroller');
let fdoc = null;

/** Both bundled modes carry every stop inside the file rather than fetching it. */
const inlined = () => S.runtime === 'artifact' || S.runtime === 'phase';

function frameSrc () {
  if (isHistory()) {
    if (inlined()) {
      return { srcdoc: S.versions.find(v => v.n === S.viewing)?.html
        || '<p style="font:14px system-ui;padding:24px">Not captured in this bundle.</p>' };
    }
    return { src: `${API}/version/${S.viewing}` };

 *   show:false  the element is not on the page — neither is the mark
 *   loose:true  the page has been rebuilt since and the element is gone with it;
 *               the mark falls back to where it was drawn rather than vanishing,
 *               because a comment nobody can see is a comment nobody answers
 */
function anchorState (a) {
  const drawn = a.rect || (a.point ? { x: a.point.x, y: a.point.y, w: 1, h: 1 } : { x: 20, y: 20, w: 1, h: 1 });
  if (!a.anchor || !fdoc) return { rect: drawn, show: true };
  const el = findAnchor(a);
  if (!el) {
    const madeHere = (a.anchorVersion ?? a.fromVersion ?? S.viewing) === S.viewing;
    return madeHere ? { show: false } : { rect: drawn, show: true, loose: true };
  }
  if (!isShown(el)) return { show: false, el };
  const r = docRect(el), an = a.anchor;
  const sx = an.size?.w > 4 ? clamp(r.w / an.size.w, .25, 4) : 1;
  const sy = an.size?.h > 4 ? clamp(r.h / an.size.h, .25, 4) : 1;
  const x = r.x + (an.rel?.x || 0) * sx, y = r.y + (an.rel?.y || 0) * sy;
  return {
    show: true, el,
    rect: a.kind === 'area' && a.rect
      ? { x, y, w: drawn.w * sx, h: drawn.h * sy }
      : { x, y, w: 1, h: 1 },
  };
}
/** What this comment is on, in words. */
function anchorLabel (an) {
  if (!an) return '';
  const words = an.text || an.label;
  const el = an.tag + (an.role ? `[${an.role}]` : '');
  const reg = an.region ? T('inRegion')(an.region.kind, trim(an.region.label, 32)) : '';
  return (words ? `${el} “${trim(words, 42)}”` : el) + (reg ? ' · ' + reg : '');
}

/* The page changes under the marks — a modal opens, a tab switches, a pane
   scrolls. Nothing tells us but the DOM itself, so watch it and re-place. */
let syncQueued = false;
const syncSoon = [null, null];
function scheduleSync () {
  if (!syncQueued) {
    syncQueued = true;
    requestAnimationFrame(() => { syncQueued = false; positionMarks() });
  }
  // Transitions land after the mutation that started them; look again once they have.
  clearTimeout(syncSoon[0]); syncSoon[0] = setTimeout(positionMarks, 180);
  clearTimeout(syncSoon[1]); syncSoon[1] = setTimeout(positionMarks, 560);
}
function watchFrame () {
  if (!fdoc) return;
  try { frame._mo?.disconnect() } catch {}
  // The page moved: anything we failed to find last time is worth another look.
  const mo = frame._mo = new MutationObserver(() => { domEpoch++; scheduleSync() });
  try {
    mo.observe(fdoc.documentElement, {
      childList: true, subtree: true, attributes: true,
      attributeFilter: ['class', 'style', 'hidden', 'open', 'aria-hidden', 'aria-expanded', 'data-state'],
    });
  } catch {}
  fdoc.addEventListener('scroll', scheduleSync, { capture: true, passive: true });
  fdoc.addEventListener('transitionend', scheduleSync, true);
  fdoc.addEventListener('animationend', scheduleSync, true);
}

let drag = null;
overlay.addEventListener('pointerdown', e => {
  if (S.mode !== 'annotate' || e.target.closest('.mark')) return;
  if (isHistory()) { toast(T('historyBlocked')); return }
  if (composerOpen()) { closeComposer(); return }
  overlayRect = overlay.getBoundingClientRect();
  drag = { start: pt(e), moved: false };
  try { overlay.setPointerCapture(e.pointerId) } catch {}
});
overlay.addEventListener('pointermove', e => {
  if (!drag) return;
  const p = pt(e);
  if (Math.abs(p.x - drag.start.x) > 4 || Math.abs(p.y - drag.start.y) > 4) drag.moved = true;
  if (!drag.moved) return;
  const d = $('#drag');
  d.style.display = 'block';
  d.style.left = Math.min(drag.start.x, p.x) + 'px';
  d.style.top = Math.min(drag.start.y, p.y) + 'px';
  d.style.width = Math.abs(p.x - drag.start.x) + 'px';
  d.style.height = Math.abs(p.y - drag.start.y) + 'px';
});
overlay.addEventListener('pointerup', e => {
  if (!drag) return;
  const p = pt(e), d = drag; drag = null;
  overlayRect = null;
  $('#drag').style.display = 'none';
  if (!d.moved) return addComment({ kind: 'comment', point: d.start, ...anchorFor(d.start) });
  const rect = {
    x: Math.min(d.start.x, p.x), y: Math.min(d.start.y, p.y),
    w: Math.abs(p.x - d.start.x), h: Math.abs(p.y - d.start.y),
  };
  if (rect.w < 8 || rect.h < 8) return;
  addComment({ kind: 'area', rect, ...anchorFor(null, rect) });
});

function addComment (a) {
  const c = normalise({ id: uid(), size: S.size.id, ...(live() ? { route: S.route } : {}), ...a });
  c._fresh = true;
  S.ann.push(c);
  save(); render();
  openComposer(c.id);
}
/* Not everything worth saying is about one element. A general comment has no
   anchor, so it draws no mark and never goes looking for the thing it was made
   on — it just sits in the list and rides out with the rest. */
function addGeneral () {
  if (isHistory()) return;
  setPanel(true);
  const c = normalise({ id: uid(), size: S.size.id, kind: 'general',
    ...(live() ? { route: S.route } : {}) });
  c._fresh = true;
  S.ann.push(c);
  save(); render();     // the card's own field takes the cursor
}

function removeComment (id) {
  S.ann = S.ann.filter(a => a.id !== id);
  S.held.delete(id);
  if (S.sel === id) { S.sel = null; composer.classList.remove('on') }
  save(); render();
}
const annById = id => S.ann.find(a => a.id === id) || S.carried.find(a => a.id === id);
/**
 * A comment is its words. Never typing any, or clearing the ones that were
 * there, means there is no comment — dismissing it takes it away.
 */
const hasSubstance = a => !!(a.note || '').trim();
/** Everything the current panel can actually clear. Carried comments are just
    as present as current-version comments, despite living in an older file. */
const activeComments = () => S.ann.concat(S.carried)
  .filter(a => !a.dismissed && hasSubstance(a));
/** A general comment that has just been made and has nothing in it yet. */
const blank = a => !!a._fresh && a.kind === 'general';
/* Once a comment has gone to Claude it is a record of what was asked, not a
   draft: editing it here would change the words without changing the brief
   that already left. Reply to add to it. */
/* Having gone out is a fact about the comment, not a phase of this tab's
   memory. Deriving it from the in-flight set meant that when a round ended —
   Claude publishing a version that did not name this comment — every general
   comment already handed over turned back into an open text box, inviting an
   edit that would never reach the brief that had already left. */
const sent = a => !!a.sentAt || a.status !== 'open' ||
  !!(a.replies || []).length || !!a.reopenedAt ||
  S.working.has(a.id) || S.queued.has(a.id);
/* One sequence over every comment on screen, this version's and the ones
   carried in from earlier ones. Which version a comment came from is the
   group it sits under, not a different kind of number on its badge. */
let numbers = new Map();
function numberComments () {
  numbers = new Map();
  let n = 0;
  for (const a of S.ann.concat(S.carried)) {
    if ((!hasSubstance(a) && !blank(a)) || a.dismissed) continue;
    numbers.set(a.id, ++n);

}
const num = a => numbers.get(a.id) ?? '·';

/* ─────────────── on-canvas composer ─────────────── */

const composer = $('#composer');
const composerOpen = () => composer.classList.contains('on');
function placeComposer () {
  const a = annById(S.sel);
  if (!a || !composerOpen()) return;
  const st = a.kind === 'general' ? { show: false } : anchorState(a);
  const ar = $('#stageArea').getBoundingClientRect();
  // Nothing to sit beside — the comment is still editable, so it takes the
  // middle of the stage rather than hovering over whatever replaced its element.
  if (!st.show) {
    composer.style.left = Math.max(8, (ar.width - 280) / 2) + 'px';
    composer.style.top = Math.max(8, (ar.height - 240) / 2) + 'px';
    return;
  }
  const r = st.rect, or = overlay.getBoundingClientRect();
  composer.style.left = clamp(or.left - ar.left + r.x * S.zoom, 8, Math.max(8, ar.width - 294)) + 'px';
  composer.style.top = clamp(or.top - ar.top + (r.y + r.h) * S.zoom + 8, 8, Math.max(8, ar.height - 250)) + 'px';
}
const who = by => T(isAgent(by) ? 'agent' : 'you');

function openComposer (id, focus) {
  const a = annById(id);
  if (!a) return;
  S.sel = id;
  composer.classList.add('on');
  composer.querySelector('.cnum').textContent = num(a);
  composer.querySelector('.ckind').textContent = T(a.kind === 'area' ? 'areaComment' : 'comment');

  const st = composer.querySelector('.cstatus');
  st.className = 'cstatus' + (a.status === 'open' ? '' : ' ' + a.status);
  st.textContent = a.status === 'addressed' ? T('statusAddressed') : a.status === 'question' ? T('statusAsked') : '';

  // Say what this is attached to, so "it did not know what I meant" is answered
  // while the note is being written rather than after the next round.
  const anc = composer.querySelector('.canchor');
  const covers = a.covers?.length ? T('coversN')(a.covers.length) : '';
  const desc = [anchorLabel(a.anchor), covers].filter(Boolean).join(' · ');
  const shown = anchorState(a).show;
  anc.classList.toggle('on', !!desc || !shown);
  anc.classList.toggle('gone', !shown);
  anc.innerHTML = desc
    ? `<b>${esc(desc)}</b>` + (shown ? '' : ' · ' + esc(T('anchorGone')))
    : esc(T('anchorGone'));
  // The list itself is long; the line is short. Hovering says the whole of it.
  anc.title = [desc, ...(a.covers || []).map(c => `${c.tag} “${c.text}”`)].filter(Boolean).join('\n');

  const note = composer.querySelector('.cnote');
  note.value = a.note || '';
  note.disabled = isHistory();
  note.placeholder = T('notePlaceholder');

  // The thread turns a comment into a conversation: Claude answers or asks,
  // you reply, and the whole exchange goes back with the next round.
  const thread = composer.querySelector('.cthread');
  const replies = a.replies || [];
  thread.classList.toggle('on', replies.length > 0);
  thread.innerHTML = replies.map(m =>
    `<div class="msg ${isAgent(m.by) ? 'agent' : ''}">
       <div class="who">${who(m.by)}</div>
       <div class="body">${esc(m.text)}</div>
     </div>`).join('');

  const reply = composer.querySelector('.creply');
  const canReply = !isHistory() && (replies.length > 0 || a.status === 'question');
  reply.classList.toggle('on', canReply);
  reply.value = '';
  reply.placeholder = T(a.status === 'question' ? 'answerPlaceholder' : 'replyPlaceholder');

  // Nothing written yet means dismissing already throws it away — a second
  // button for the same outcome is just noise.
  composer.querySelector('.cdel').style.display = hasSubstance(a) && !isHistory() ? '' : 'none';
  composer.querySelector('.cdel').title = T('del');
  composer.querySelector('.csave').style.display = isHistory() ? 'none' : '';
  composer.classList.toggle('working', S.working.has(id));
  placeComposer();

}
function closeComposer () {
  if (!composerOpen()) return;
  const a = annById(S.sel);
  if (a) {
    const note = composer.querySelector('.cnote').value.trim();
    const reply = composer.querySelector('.creply').value.trim();
    if (reply) postReply(a, reply);
    if (note !== (a.note || '')) { a.note = note; save() }
    // No words and no thread is not feedback — clearing a comment removes it,
    // which is also how you take one back.
    if (!hasSubstance(a)) S.ann = S.ann.filter(x => x.id !== a.id);
    delete a._fresh;
  }
  composer.classList.remove('on');
  S.sel = null;
  render();
}
/** Answering Claude puts the ball back in its court — including on a comment it
    had called done. Saying "not like that" in the thread IS reopening it; there
    is no separate button for it, because a reply nobody reads is worse than no
    button at all. */
function postReply (a, text) {
  a.replies = (a.replies || []).concat({ by: 'reviewer', text, at: new Date().toISOString() });
  if (a.status === 'question') a.status = 'open';
  if (a.status === 'addressed') { a.status = 'open'; a.reopenedAt = new Date().toISOString() }
  // A reply is new review input regardless of which reply surface wrote it.
  // Reset this here so both the canvas composer and panel thread enable Send.
  S.sentSig = null;
  save();
}

/**
 * A comment from an earlier version becomes this version's business the moment
 * you act on it — copy it in, because `save()` only ever writes the round you
 * are in, and a change made to a ghost would vanish with the next reload.
 */
function adopt (a) {
  const live = S.ann.find(x => x.id === a.id);
  if (live) return live;
  const copy = { ...a };
  delete copy.fromVersion;
  S.ann.push(copy);
  S.carried = S.carried.filter(x => x.id !== a.id);
  return copy;
}

/**
 * The × on a card, and the one way anything leaves this list. A comment you
 * wrote and have not handed over is simply taken back; one that has entered a
 * conversation, been addressed, or came from an earlier round is kept on file
 * and hidden — the record of what was asked outlives the list it was asked in.
 */
function takeOff (a) {
  if (isHistory()) return;
  // Only a draft that has never left this tab can disappear outright. Once
  // Claude has replied, asked, or addressed it, keep a dismissed record so a
  // slightly older server snapshot cannot immediately bring it back.
  if (!a.fromVersion && !sent(a)) { removeComment(a.id); return }
  const live = adopt(a);
  live.dismissed = true;
  delete live.reopenedAt; delete live.revert;
  S.threadOpen.delete(live.id);
  replyDrafts.delete(live.id);
  if (S.sel === live.id) closeComposer();
  S.sentSig = null;
  save();
  render();
  toast(T('dismissed'));
}

/** Take back the reply you just wrote, while Claude has yet to see it. */
function undoReply (a, i) {
  if (isHistory()) return;
  const live = adopt(a);
  const reps = live.replies || [];
  if (i !== reps.length - 1 || reps[i]?.by !== 'reviewer') return;
  reps.splice(i, 1);
  // Unsaying the answer puts the question back — it is unanswered again.
  if (isAgent(reps.at(-1)?.by)) live.status = 'question';
  S.sentSig = null;
  save();
  render();
}

/**
 * Addressed is Claude's word for it, not the last word. Reopening a comment puts
 * it back in play for the next round: refine adds to what was asked, revert asks
 * for the change to be undone. `reopenedAt` is what lets the server take a
 * status going backwards from a client — nothing else can un-address a comment.
 */
function reopen (a, mode) {
  if (isHistory()) return;
  a = adopt(a);
  a.status = 'open';
  a.reopenedAt = new Date().toISOString();
  if (mode === 'revert') {
    a.revert = true;
    postReply(a, T('revertNote'));
  } else {
    delete a.revert;
    save();
  }
  /* Both of these are things to say, so both are said in the thread: revert has
     already written its line, refine leaves the cursor where yours goes. The
     thread opens either way, so the ask is visible where the answer will be. */
  S.threadOpen.add(a.id);
  S.focusReply = a.id;
  S.sentSig = null;
  render();

}
function wireComposer () {
  const note = composer.querySelector('.cnote');
  note.addEventListener('input', () => {
    const a = annById(S.sel);
    if (!a) return;
    a.note = note.value.trim();
    if (a._fresh && a.note) delete a._fresh;
    composer.querySelector('.cdel').style.display = hasSubstance(a) && !isHistory() ? '' : 'none';
    save();
    // Repaint just this mark's label — rebuilding every mark on each keystroke
    // is the kind of work that makes typing feel heavy.
    const lbl = $(`.mark[data-id="${a.id}"] .lbl`, overlay);
    if (lbl) lbl.textContent = a.note;
    clearTimeout(note._t);
    note._t = setTimeout(() => { drawMarks(); renderPanel() }, 400);
  });

     Shift+Enter is the newline. An IME sends Enter to accept its candidates —
     committing on that would eat the first word of every Chinese comment. */
  const submit = e => {
    if (e.key !== 'Enter' || e.shiftKey || e.isComposing || e.keyCode === 229) return;
    e.preventDefault();
    closeComposer();
  };
  note.addEventListener('keydown', submit);
  composer.querySelector('.creply').addEventListener('keydown', submit);
  // The button says the shortcut out loud, for anyone who would otherwise
  // wonder whether closing the note threw it away.
  composer.querySelector('.csave').onclick = closeComposer;
  composer.querySelector('.cclose').onclick = closeComposer;
  composer.querySelector('.cdel').onclick = () => {
    const a = annById(S.sel);

    S.sel = null;
    if (a) takeOff(a);

  composer.addEventListener('pointerdown', e => e.stopPropagation());

  // decides for itself whether a click closes one or starts the next.
  document.addEventListener('pointerdown', e => {

    closeComposer();

/** The one line the list shows about a comment's conversation — and the way in. */

  const txt = a.revert && a.status !== 'addressed' ? T('wantsRevert')
    : a.status === 'question' ? T('claudeAsked')
    : n ? `${n} ${T(n > 1 ? 'replies' : 'reply')}`
    : T('addReply');

  const msgs = (a.replies || []).map((m, i, all) =>
    `<div class="tmsg${isAgent(m.by) ? ' agent' : ''}">

const replyDrafts = new Map();
function toggleThread (id) {

/* ─────────────────────── drawing marks ────────────────────── */

/** Which screen the canvas is showing: the live one, or — scrubbed back — the
    one that capture was taken on. */
const shownRoute = () => isHistory()
  ? (S.versions.find(v => v.n === S.viewing)?.route || S.route)
  : S.route;
/** A comment made on another screen of the app. It keeps its place in the list
    and still reaches Claude — it just has nothing to point at from here. */
const offRoute = a => live() && !!a.route && a.route !== shownRoute();

function visibleAnn () {
  const list = isHistory()
    ? (S.reviews[S.viewing]?.annotations || []).map(normalise)
    : S.ann.concat(S.carried);
  /* Addressed comments keep their marks off the page while the Addressed group
     is folded: a page covered in marks for things already dealt with is a page
     you have to read past. Opening the group brings them back, which is exactly
     when you are looking at them. */
  return list.filter(a => !a.dismissed
    && (S.doneOpen || isHistory() || a.status !== 'addressed')
    && (a.size || 'desktop') === S.size.id && !offRoute(a));
}
/* Drawing a mark and placing it are two different jobs on two different clocks:
   the node is built when the review changes, and placed every time the page
   underneath it moves. */
let drawnMarks = new Map();
function drawMarks () {
  numberComments();
  $$('.mark', overlay).forEach(n => n.remove());
  drawnMarks = new Map();
  for (const a of visibleAnn()) { drawMark(a); drawnMarks.set(a.id, a) }
  positionMarks();
}
function drawMark (a) {
  const ghost = !!a.fromVersion, done = a.status !== 'open', n = num(a);
  const cls = (S.sel === a.id ? ' sel' : '') + (ghost ? ' ghost' : '') + (done ? ' done' : '');
  const area = a.kind === 'area' && a.rect;
  if (!area && !a.point) return;
  const d = document.createElement('div');
  d.className = 'mark ' + (area ? 'area' : 'pin') + cls;
  d.dataset.id = a.id;
  d.style.setProperty('--mk', MARK);
  d.innerHTML = area
    ? `<span class="num">${n}</span>` + (a.note ? `<span class="lbl">${esc(a.note)}</span>` : '')
    : esc(String(n)) + (a.note ? `<span class="lbl">${esc(a.note)}</span>` : '');
  if (!area) d.title = a.note || T('comment');
  d.onclick = ev => { ev.stopPropagation(); openComposer(a.id) };
  overlay.appendChild(d);
}
/** Put every mark where its element is now — or take it off the page with it. */
function positionMarks () {
  const frameH = parseFloat(frame.style.height) || 0;
  const off = new Set();
  for (const node of $$('.mark', overlay)) {
    const a = drawnMarks.get(node.dataset.id);
    if (!a) continue;
    const st = anchorState(a);
    node.classList.toggle('gone', !st.show);
    node.classList.toggle('loose', !!st.loose);
    if (!st.show) { off.add(a.id); continue }
    const r = st.rect;
    node.style.left = r.x + 'px';
    node.style.top = r.y + 'px';
    if (node.classList.contains('area')) {
      node.style.width = r.w + 'px';
      node.style.height = r.h + 'px';
      node.classList.toggle('flip', !!(frameH && r.y + r.h + 64 > frameH && r.y > 64));
    }
  }
  const changed = off.size !== S.offscreen.size || [...off].some(id => !S.offscreen.has(id));
  S.offscreen = off;
  placeComposer();
  if (changed) renderPanel();
}

/* ───────────────────── panel: the index ───────────────────── */

const sizeLabel = id => T(id);

function render () { numberComments(); drawMarks(); renderPanel() }

function renderPanel () {
  numberComments();
  renderWork();
  const body = $('#pbody');
  body.innerHTML = '';
  $('#pscope').textContent = isHistory() ? T('readOnly')(S.viewing) : sizeLabel(S.size.id);
  // "Open" means unfinished — a comment Claude has asked a question about is
  // still very much open, and hiding it would strand the conversation.
  // Addressed comments are never mixed in with the live ones — they get their
  // own section at the bottom, where revert and refine live.
  // A general comment appears the moment it is made — its card IS where you
  // write it, so it cannot wait until it has words to be shown.
  const match = a => (hasSubstance(a) || blank(a)) && a.status !== 'addressed' && !a.dismissed;
  // A question from Claude is the one thing in this list that is waiting on
  // *you*. It goes first, under a heading that says how many — everything else
  // can be read at leisure; this can't, because the round is stalled on it.
  const isAsked = awaitsReply;
  /* Two lists, and only two: what is open and what is done. Everything that
     used to be its own heading — a question from Claude, a comment made at
     another size, one carried in from an earlier round — is still ordered and
     still labelled on the card itself, but a panel with five headings and one
     comment under each was mostly headings. */
  const asked = S.ann.filter(a => match(a) && isAsked(a));
  const here = S.ann.filter(a => match(a) && !isAsked(a) && (a.size || 'desktop') === S.size.id);
  const elsewhere = S.ann.filter(a => match(a) && !isAsked(a) && (a.size || 'desktop') !== S.size.id);
  const carried = S.carried.filter(a => a.status === 'open' && hasSubstance(a));
  // Addressed in this round or in one before it — same group, same actions.
  const done = S.ann.concat(S.carried).filter(a =>
    hasSubstance(a) && a.status === 'addressed' && !a.dismissed);

  // An empty panel is empty. It used to explain how to make a comment, which is
  // the one thing the page itself already demonstrates the moment you click it.
  /* Newest first. The list is a stack of what you have just noticed, and the
     comment you wrote a second ago is the one you are still thinking about —
     scrolling to the bottom to find it read as an archive, not a workspace.

  // Waiting on you first — it is the one thing here that stalls the round.
  for (const a of asked) body.appendChild(itemNode(a, { asked: true }));
  for (const a of here) body.appendChild(itemNode(a));
  for (const a of elsewhere) body.appendChild(itemNode(a, { otherSize: true }));
  for (const a of carried) body.appendChild(itemNode(a, { ghost: true }));
  if (done.length) {
    /* What Claude just did is the part you want to check; what it did three
       rounds ago is a record. The version that was published names what it
       addressed, so "the last round" is a fact here rather than a guess. */
    const lastRound = new Set(S.versions.find(v => v.n === S.version)?.addressed || []);
    const recent = done.filter(a => lastRound.has(a.id));
    const older = done.filter(a => !lastRound.has(a.id));
    body.appendChild(group(T('addressedGroup')(done.length)));
    for (const a of recent) body.appendChild(itemNode(a, { done: true, ghost: !!a.fromVersion }));
    if (older.length) {
      body.appendChild(groupToggle(T('earlierGroup')(older.length), S.doneOpen, () => {
        S.doneOpen = !S.doneOpen;
        render();   // the marks come and go with the fold
      }));

    }

  // being typed into it. Put the cursor back where it was.
  if (S.focusReply) {
    const ta = $(`.item[data-id="${S.focusReply}"] .treply`, body);
    if (ta && document.activeElement !== ta) {
      ta.focus({ preventScroll: true });
      ta.setSelectionRange(ta.value.length, ta.value.length);
    }

function confirmClearComments () {
  if (isHistory()) return;
  closeComposer();
  const n = activeComments().length;
  $('#clearDialog').close();
  if (!n) return;
  /* A carried comment lives in an earlier review file. Emptying only this
     version cannot remove it; on reload it is carried straight back in. Put a
     dismissed copy in the current version instead. Doing that for every
     comment also preserves the audit record and prevents an older copy of a
     current comment from being resurrected after the current one is gone. */
  const cleared = new Map();
  for (const a of S.carried.concat(S.ann)) {
    if (!hasSubstance(a)) continue;
    const copy = { ...a, dismissed: true };
    delete copy.fromVersion; delete copy.reopenedAt; delete copy.revert;
    delete copy.held; delete copy._fresh;
    cleared.set(copy.id, copy);
  }
  S.ann = [...cleared.values()];
  S.carried = [];
  S.held.clear(); S.sentSig = null;
  save(); render();
  toast(T('cleared')(n));

function applyHistoryClear (data) {
  const wasHistory = isHistory();
  if (wasHistory) closeComposer();
  if ($('#historyDialog').open) $('#historyDialog').close();
  S.historyClearedAt = data.historyClearedAt || S.historyClearedAt;
  S.versions = data.versions || S.versions.filter(v => v.n === S.version);
  S.viewing = S.version;
  S.clearingHistory = false;
  if (wasHistory) { setMode('annotate'); loadFrame() }
  buildTimeline(); render();

async function confirmClearReviewHistory () {
  if (!hasVersionHistory() || S.clearingHistory) return;
  /* Confirmation is the end of the modal interaction. Closing immediately also
     keeps any network error toast in the visible top layer instead of behind a
     native dialog backdrop. */
  S.clearingHistory = true;
  $('#historyDialog').close();
  renderHistoryButton();
  try {
    const res = await fetch(API + '/history/clear', { method: 'POST' });
    const type = res.headers.get('content-type') || '';
    const data = type.includes('application/json') ? await res.json() : {};
    if (!res.ok) {
      const error = new Error(data.error || `clear failed (${res.status})`);
      error.status = res.status;
      throw error;
    }
    applyHistoryClear(data);
    toast(T('historyCleared'));
  } catch (error) {
    S.clearingHistory = false;
    renderHistoryButton();
    toast(error?.status === 404 ? T('historyClearRestart') : T('historyClearFail'));
  }
}

const versionList = () => {
  const ns = S.versions.map(v => v.n).sort((a, b) => a - b);
  return ns.length ? ns : [S.version];
};
const labelFor = n => S.versions.find(v => v.n === n)?.label
  || (S.runtime === 'phase' ? T('phaseOf')(n) : live() ? `Round ${n}` : `Version ${n}`);
const dateFor = n => {
  const d = S.versions.find(v => v.n === n)?.date;
  if (!d) return '';
  const dt = new Date(d);

/**

function whereLine (a) {
  if (a.kind === 'general') return 'the page as a whole — not attached to an element';

    ? `area ${Math.round(a.rect.w)}×${Math.round(a.rect.h)} at ${Math.round(a.rect.x)},${Math.round(a.rect.y)}`
    : `at ${Math.round(a.point?.x || 0)},${Math.round(a.point?.y || 0)}`;

  if (!an) return `${geo}${a.anchorText ? ` — on “${a.anchorText}”` : ''}`;
  const el = '`<' + an.tag + (an.id ? ` id="${an.id}"` : '') + (an.cls ? ` class="${an.cls}"` : '') +
    (an.role ? ` role="${an.role}"` : '') + '>`';
  const words = an.text || an.label;
  const reg = an.region;
  const region = !reg ? ''
    : reg.kind === 'region' ? (reg.label ? ` inside “${reg.label}”,` : '')
    : ` inside ${reg.kind}${reg.label ? ` “${reg.label}”` : ''},`;
  return `on ${el}${words ? ` “${words}”` : ''},${region} ${geo}`;
}

/** Everything the box was drawn around, in the order it appears on the page. */
const coversLine = a => a.covers.map(c => `\`<${c.tag}>\` “${c.text}”`).join(' · ') +
  (a.covers.length >= COVER_MAX ? ' · …' : '');

function buildFeedback () {
  /* Everything handed over and not yet done — not everything written. Sending
     one comment on its own must not shrink the brief to that comment, or the
     ones already out would quietly drop off the list Claude is working from.
     Landed counts as done: a version this tab has not adopted yet already
     addressed it, and a brief built between the announcement and the refresh —
     the held queue flushing is exactly that moment — must not hand it back. */
  const done = a => a.status === 'addressed' || S.landed.has(a.id);
  const items = S.ann.filter(a => !done(a) && !a.dismissed && hasSubstance(a) && a.sentAt);
  const carried = S.carried.filter(a => !done(a) && !a.dismissed);

  const reverts = items.concat(carried).filter(a => a.revert);
  const reopened = items.concat(carried).filter(a => a.reopenedAt && !a.revert);

  const L = [];
  L.push(live()
    ? `# Live UI review — ${S.name} · round ${S.version}`
    : `# Wireframe review — ${S.name} · v${S.version}`);
  L.push(`${items.length} comment(s) — every one is a must` +
    (carried.length ? ` · ${carried.length} carried over` : '') +
    (reverts.length ? ` · ${reverts.length} revert` : '') +
    (reopened.length ? ` · ${reopened.length} reopened` : ''));
  L.push('');
  if (live()) {
    // What is under review is running code, so the change is a code change.
    // Every comment names the route it was made on: that route is the way back
    // to the screen, and the way to the component that renders it.
    L.push(`These are comments on the app running at \`${S.app || S.fileName}\` — change the source, ` +
      'not a mockup. Each comment says which **route** it was made on; the anchor names the ' +
      'element, which is what to search the codebase for.');
    L.push('');
    L.push('The reviewer is looking at the app right now. If it hot-reloads they will see your ' +
      'change as you make it, so land whole changes rather than half of one.');
  } else {
    L.push(`Apply these to \`${S.fileName}\`, then publish the next version.`);
  }
  if (reverts.length || reopened.length) {
    L.push('');
    L.push('Some of these you already marked addressed and they were sent back: ' +
      '**revert** means undo what you did there, **reopened** means it did not go far enough. ' +
      'Read the note and the thread again before touching anything.');
  }
  L.push('');

  const bySize = {};
  for (const a of items) (bySize[a.size || 'desktop'] ||= []).push(a);
  for (const sid of SIZES.map(s => s.id)) {
    const list = bySize[sid];
    if (!list?.length) continue;
    const size = SIZES.find(s => s.id === sid);
    // The brief is written for Claude, so it stays in English whatever the
    // workspace is showing. The reviewer's own words pass through untouched.
    L.push(`## ${STR.en[sid]} — ${size.width} × ${size.height}`);
    L.push('');
    for (const a of list) {
      /* Sending again sends everything still open, including whatever went out
         in an earlier brief — the brief is the state of the review, not a diff.
         Say which ones you have already seen so a second read does not become a
         second round of work on the same comment. */
      const again = S.collected.has(a.id);
      L.push(`### #${num(a)}${a.revert ? ' · REVERT' : ''}${again ? ' · ALREADY SENT' : ''}`);
      if (again) L.push('*You have had this one before and it is still open — carry on with it rather than starting again.*');
      if (a.revert) L.push('**They asked for your last change here to be undone** — restore what was there before, then apply the note again only if it still stands.');
      if (live() && a.route) L.push(`**Route** \`${a.route}\``);
      L.push(`**Where** ${whereLine(a)}`);
      if (a.covers?.length) L.push(`**Covers** ${coversLine(a)}`);
      if (a.note) L.push(a.note);
      for (const m of a.replies || []) {
        L.push('');
        L.push(`> **${isAgent(m.by) ? 'You asked' : 'They replied'}:** ${m.text}`);
      }
      L.push('');
    }
  }
  if (carried.length) {
    L.push(live() ? '## Still open from earlier rounds' : '## Still open from earlier versions');
    L.push('');
    for (const a of carried) {
      L.push(`- **[${capFor(a.fromVersion)}]** ${a.note} — ${live() && a.route ? '`' + a.route + '` · ' : ''}${whereLine(a)}`);
    }
    L.push('');
  }
  L.push('---');
  L.push('Claim the round id from the pending record first. Then mark every applied comment done, and ask about anything unclear instead of guessing:');
  L.push('```bash');
  const subject = live() ? '--name <review-name>' : '--file <page.html>';
  L.push(`node review-server.mjs claim ${subject} --round <round-id>`);
  L.push(`node review-server.mjs publish ${subject} --round <round-id> --label "<what changed>" --addressed ` +
    items.concat(carried).map(a => a.id).join(','));
  L.push(`node review-server.mjs reply ${subject} --round <round-id> --comment <id> --text "<your question>"`);
  L.push('```');

  const payload = {
    page: S.fileName, name: S.name, version: S.version,
    ...(live() ? { reviewing: 'app', app: S.app, routes: [...new Set(items.concat(carried).map(a => a.route).filter(Boolean))] } : {}),
    comments: items.concat(carried).map(a => ({
      id: a.id, kind: a.kind, status: a.status, note: a.note,
      replies: a.replies || [],
      // Reopened after you called it done — either put it back (revert) or
      // take it further. Either way it is not finished.
      reopened: !!a.reopenedAt, wantsRevert: !!a.revert,
      // True when this comment was in a brief you already collected.
      alreadySent: S.collected.has(a.id),
      anchorText: a.anchorText || null,
      // What the comment is attached to. `selector` is how the workspace finds
      // the element again to keep the mark on it — a hint for you, not a promise
      // about the markup.
      anchor: a.anchor ? {
        selector: a.anchor.sel, tag: a.anchor.tag, id: a.anchor.id || null,
        classes: a.anchor.cls || null, role: a.anchor.role || null,
        label: a.anchor.label || null, text: a.anchor.text || null,
        region: a.anchor.region || null,
      } : null,
      // For an area: what was inside the box when it was drawn.
      covers: a.covers?.length ? a.covers : null,
      screenSize: a.size || 'desktop',
      // Live: the screen of the app this was said about.
      route: a.route || null,
      point: a.point || null, rect: a.rect || null,
      fromVersion: a.fromVersion || S.version,
    })),
  };
  return {
    markdown: L.join('\n') + '\n\n```json\n' + JSON.stringify(payload, null, 2) + '\n```\n',
    feedback: payload,
    counts: { total: items.length + carried.length },
  };
}

/** What was last handed over, so an unchanged review can't be sent twice. */
const reviewSignature = () => JSON.stringify(S.ann
  .filter(a => a.status !== 'addressed' && hasSubstance(a))
  .map(a => [a.id, a.note, a.status, !!a.revert, (a.replies || []).length]));

/* ─────────────── live: keeping a copy of what they saw ───────────────
   A file review freezes the file on every publish. There is nothing to freeze
   here — the app moves on the moment the code does — so the workspace takes
   the picture instead: the DOM as it stands, with its stylesheets folded in so
   it still looks like itself. It is what the timeline scrubs back to, and what
   gets published when someone asks for a link they can send on.

   A capture is a likeness, not the app: scripts are dropped, and anything the
   page would have fetched later never arrives. */
function captureDOM () {
  if (!fdoc) return null;
  let doc;
  try { doc = fdoc.documentElement.cloneNode(true) } catch { return null }
  for (const n of doc.querySelectorAll('script')) n.remove();
  // Same-origin means the rules are readable — which is the only reason a
  // capture of a real app looks like anything at all.
  const css = [];
  try {
    for (const sheet of fdoc.styleSheets) {
      let rules = null;
      try { rules = sheet.cssRules } catch { continue }   // a cross-origin sheet stays out
      if (rules) css.push([...rules].map(r => r.cssText).join('\n'));
    }
  } catch {}
  for (const n of doc.querySelectorAll('link[rel~="stylesheet"],style')) n.remove();
  const head = doc.querySelector('head') || doc;
  // Absolute paths in the capture still point at this origin, which is the
  // proxy — so a capture opened outside it shows structure, not artwork.
  const base = doc.ownerDocument.createElement('base');
  base.href = location.origin + '/';
  head.prepend(base);
  const style = doc.ownerDocument.createElement('style');
  style.textContent = css.join('\n');
  head.append(style);
  return '<!doctype html>\n' + doc.outerHTML;
}
/** Best-effort — a round with no capture is still a round. */
async function pushCapture () {
  if (!live() || isHistory()) return;
  const html = captureDOM();
  if (!html) return;
  try {
    await fetch(API + '/snapshot', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ version: S.version, route: S.route, html }),
    });
  } catch {}
}

/**
 * Hand comments over. With no argument it sends everything open; with an id it
 * sends that one, which joins whatever is already out rather than replacing it.
 * With an array of ids — the held queue flushing — it sends those, and never
 * holds.
 */
async function openSend (only) {
  closeComposer();
  const at = new Date().toISOString();
  // DOM event handlers pass the click event as their first argument. Only an
  // explicit string/array is a scoped send; everything else means Send all.
  const scope = Array.isArray(only) || typeof only === 'string' ? only : null;
  const going = Array.isArray(scope)
    ? scope.map(annById).filter(Boolean)
    : scope
      ? [annById(scope)].filter(Boolean)
      : S.ann.filter(a => a.status !== 'addressed' && !a.dismissed && hasSubstance(a));
  /* A collected round is a Claude already working — sending into it would raise
     a second wake-up mid-round. So the comment waits here, marked queued, and
     goes out as one batch the moment the round ends. A brief still sitting
     uncollected is different: writing into it just grows the batch Claude will
     pick up in one read, so those sends go straight through. */
  const collected = [...S.working].some(id => !S.queued.has(id));
  if (!Array.isArray(scope) && collected && served()) {
    for (const a of going) {
      if (S.working.has(a.id) || S.held.has(a.id)) continue;
      a.held = true; S.held.add(a.id);
    }
    if (S.held.size) {
      // Nothing new to say until the next edit — the button can rest.
      S.sentSig = reviewSignature();
      save(); renderPanel();
      toast(T('heldOn')(S.held.size));
    }
    return;
  }
  for (const a of going) if (!a.sentAt) a.sentAt = at;
  const pending = buildFeedback();
  if (!pending.counts.total) return;
  if (S.runtime === 'artifact') {
    await copy(pending.markdown);
    S.sentSig = reviewSignature();
    // Copied out is out: the words are on their way to Claude in a paste, and
    // editing them here afterwards would change only this screen.
    const at = new Date().toISOString();
    for (const c of pending.feedback.comments) {
      const a = annById(c.id);
      if (a && !a.sentAt) a.sentAt = at;
    }
    save(); render();
    return;
  }
  try {
    // Take the picture before the round starts — once Claude changes the code,
    // what the reviewer was looking at is gone.
    await pushCapture();
    /* The held queue flushes at the announcement, before this tab adopts the
       new version — filing it under S.version then would overwrite the round
       that just ended. A send always belongs to the newest version there is. */
    const v = S.pendingUpdate?.currentVersion ?? S.version;
    /* Same moment, same stale statuses: what landed is addressed, and writing
       it as open into the new version's record would resurrect it there. */
    const anns = S.ann.filter(hasSubstance)
      .map(a => S.landed.has(a.id) ? { ...a, status: 'addressed' } : a);
    const response = await fetch(API + '/feedback', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ version: v, annotations: anns, ...pending }),
    });
    if (!response.ok) throw new Error(`feedback failed (${response.status})`);
    const receipt = await response.json();
    S.activeRoundId = receipt.roundId || S.activeRoundId;
    S.awaiting = true;
    S.sentSig = reviewSignature();
    /* Everything that just went out is queued by definition: the brief is on
       disk and nobody has opened it. Waiting for the server to tell us that on
       the next tick left the bars sweeping for a second first — saying work had
       started when the message had not even been collected. Anything Claude
       already holds from an earlier brief stays as work in progress. */
    const ids = pending.feedback.comments.map(c => c.id);
    // Stamped on the comment itself, so it stays true after the round it went
    // out with is over. Out is out — whatever was held is held no longer.
    const at = new Date().toISOString();
    for (const id of ids) {
      const a = annById(id);
      if (a) { if (!a.sentAt) a.sentAt = at; delete a.held }
      S.held.delete(id);
    }
    S.queued = new Set(ids.filter(id => !S.collected.has(id)));
    setWorking(ids);
    save();
    toast(T('working')(pending.counts.total));
  } catch {
    // Failed is unsent: whatever the signature said, Send has to work again.
    S.sentSig = null;
    toast(T('sendFail'));
  }
}
$('#btnSend').onclick = () => openSend();

/* ─────────────── approve: the way out of the loop ───────────────
   Send says "one more round". Approve says the design is done — it closes the
   review, which ends the server and hands Claude back the thread. It sits under
   the same button because it is the same decision, answered the other way. */
const sendMenu = $('#sendMenu');
function closeSendMenu () {
  sendMenu.classList.remove('on');
  $('#btnSendMore').setAttribute('aria-expanded', 'false');
  approveConfirm.disarm();
  renderApprove();
}
// Opening the menu is seeing the link — the flag has done its job.
const clearShareFlag = () => $('#btnSendMore').classList.remove('flag');
/* The label is the whole item. It said what approving does and what it would
   leave behind, and both were explaining a two-word button to someone who has
   been reviewing this design all afternoon. The second click still asks. */
function renderApprove () {
  // The shell's armConfirm owns the `armed` class; the words follow it.
  const armed = $('#btnApprove').classList.contains('armed');
  $('#btnApprove .t').textContent = armed ? T('approveSure') : T('approve');
  $('#btnApprove .d').textContent = '';
}
/* The hold is the default, not a wall. When Claude needs what was just written
   to finish the round it is in the middle of, the queue can go now — it lands
   as the next brief and joins the round rather than waiting behind it. */
function renderSendNow () {
  const b = $('#btnSendNow'), n = S.held.size;
  b.hidden = !n; $('#sendNowRule').hidden = !n;
  if (!n) return;
  b.querySelector('.t').textContent = T('sendNow');
  b.querySelector('.d').textContent = T('sendNowDesc')(n);
}
$('#btnSendNow').onclick = () => { closeSendMenu(); flushHeld(); };
$('#btnSendMore').onclick = e => {
  e.stopPropagation();
  const on = !sendMenu.classList.contains('on');
  closeSendMenu();
  if (!on) return;
  sendMenu.classList.add('on');
  $('#btnSendMore').setAttribute('aria-expanded', 'true');
  clearShareFlag();
  renderApprove(); renderShare(); renderSendNow();
};
// Signing off ends the review for everyone, so it asks once before acting.
const approveConfirm = VSShell.armConfirm($('#btnApprove'), {
  onConfirm: () => approve(),
  arm: renderApprove, disarm: renderApprove,
});
document.addEventListener('pointerdown', e => {
  if (sendMenu.classList.contains('on') && !e.target.closest('#sendMenu, #btnSendMore')) closeSendMenu();
});

/* ─────────────── the shareable copy ───────────────
   The workspace cannot publish an Artifact — only Claude can. So this asks, the
   same way cancel and approve ask, and the link comes back down the same wire
   the page reloads on. */
function adoptShare (data, announce) {
  const had = S.share.url;
  S.share = {
    url: data.shareUrl || null,
    version: data.shareVersion || null,
    pending: !!data.sharePending,
  };
  const fresh = !!S.share.url && S.share.url !== had;
  if (fresh) $('#btnSendMore').classList.add('flag');
  renderShare();
  // A toast at the bottom of the screen outlives nobody's attention for a wait
  // this long. Announce it the way a new version is announced.
  if (fresh && announce) showShareReady();
}
function showShareReady () {
  $('#shareBannerText').innerHTML = '<span class="tick">✓</span> ' + T('shareBannerReady');
  $('#shareBanner').classList.add('on');
}
const hideShare = () => $('#shareBanner').classList.remove('on');
function renderShare () {
  const b = $('#btnShare');
  if (S.runtime === 'artifact' || !canShareArtifact()) { b.hidden = true; $('#shareRule').hidden = true; return }
  const s = S.share;
  b.disabled = s.pending;
  if (s.pending) { b.querySelector('.t').textContent = T('shareWorking'); b.querySelector('.d').textContent = T('shareWait'); return }
  if (s.url && s.version === S.version) {
    b.querySelector('.t').textContent = T('shareReady');
    b.querySelector('.d').innerHTML = `<span class="url">${esc(s.url)}</span>`;
    return;
  }
  // The label says what the button does; only a stale link needs explaining.
  b.querySelector('.t').textContent = s.url ? T('shareStale') : T('share');
  b.querySelector('.d').textContent = s.url ? T('shareStaleHint')(s.version) : '';
}
async function requestShare () {
  const s = S.share;
  // A link that is already current is a link to copy, not one to ask for again.
  if (s.url && s.version === S.version) { copy(s.url); closeSendMenu(); return }
  S.share.pending = true; renderShare();
  try {
    // A running app cannot be sent to anyone. What can is a capture of the
    // screen they are on — so take one now, and let Claude publish that.
    await pushCapture();
    await fetch(API + '/share', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ version: S.version }),
    });
    toast(T('shareAsked'));
  } catch { S.share.pending = false; renderShare(); toast(T('shareFail')) }
  closeSendMenu();
}
$('#btnShare').onclick = requestShare;

async function approve () {
  closeSendMenu();
  const all = new Map(S.carried.concat(S.ann).map(a => [a.id, a]));
  const open = [...all.values()].filter(a => !a.dismissed && a.status !== 'addressed' && hasSubstance(a));
  if (S.runtime === 'artifact') { showDone(); return }
  try {
    const response = await fetch(API + '/approve', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        version: S.version,
        expectedOpenCount: open.length,
      }),
    });
    if (!response.ok) throw new Error(`approval failed (${response.status})`);
    showDone();
  } catch { toast(T('approveFail')) }
}
function showDone () {
  clearWorking();
  closeComposer();
  setMode('view');
  hideWork(); hideShare();
  $('#doneTitle').textContent = T('approvedTitle');
  $('#doneBody').textContent = T('approvedBody');
  $('#doneScreen').classList.add('on');
}
async function copy (t) {
  try { await navigator.clipboard.writeText(t); toast(T('copied')) }
  catch {
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove(); toast(T('copied'));
  }
}
function toast (m) { VSShell.toast(m) }

boot();
</script>
</body>
</html>
