<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review · Visual Stack</title>
<style>
/* ══════════════════════════ workspace chrome ══════════════════════════
   Opens one HTML file in its own browser window and lets you comment on it.
   The wrapper knows nothing about the page inside it. Two modes, two kinds of
   comment, nothing else. */
/* vstack:shell tokens */
/* One palette for every vstack page. Roles, not colours: a page asks for
   --surface, not for white, so light and dark are the same stylesheet.

   Page-specific hues (the story map's phase bands, the board's new/have/touch,
   the spec's priorities) stay in the page, below this block — they mean
   something only there. Everything here is shared, and is the reason a board
   and a spec look like the same product.

   Three states, in this order: the OS preference, then an explicit choice.
   `data-theme` absent means auto. */
:root{
  --paper:#eef0f3; --surface:#ffffff; --surface-2:#f7f8fa;
  --ink:#16171c; --ink-2:#43454d; --ink-3:#71737c;
  --line:#e2e4e9; --line-2:#d0d2d9;
  --brand:#d23b2e; --brand-soft:#fdefed; --brand-line:#f3b3ac;
  --ok:#10876e; --ok-soft:#e9f9f2;
  --shadow:0 1px 2px rgba(16,17,22,.06);
  --shadow-pop:0 1px 2px rgba(16,17,22,.06),0 8px 24px rgba(16,17,22,.10);
  --window-shadow:0 2px 6px rgba(16,17,22,.10),0 18px 48px rgba(16,17,22,.16);
  --radius:9px;
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0e0f12; --surface:#17191e; --surface-2:#1d1f25;
  --ink:#f1f2f4; --ink-2:#bcbfc7; --ink-3:#8b8e97;
  --line:#282a31; --line-2:#363942;
  --brand:#f0685c; --brand-soft:rgba(240,104,92,.14); --brand-line:rgba(240,104,92,.38);
  --ok:#2fb89b; --ok-soft:rgba(47,184,155,.14);
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-pop:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.5);
  --window-shadow:0 2px 6px rgba(0,0,0,.5),0 18px 48px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme=light]{
  --paper:#eef0f3; --surface:#ffffff; --surface-2:#f7f8fa;
  --ink:#16171c; --ink-2:#43454d; --ink-3:#71737c;
  --line:#e2e4e9; --line-2:#d0d2d9;
  --brand:#d23b2e; --brand-soft:#fdefed; --brand-line:#f3b3ac;
  --ok:#10876e; --ok-soft:#e9f9f2;
  --shadow:0 1px 2px rgba(16,17,22,.06);
  --shadow-pop:0 1px 2px rgba(16,17,22,.06),0 8px 24px rgba(16,17,22,.10);
  --window-shadow:0 2px 6px rgba(16,17,22,.10),0 18px 48px rgba(16,17,22,.16);
  color-scheme:light;
}
:root[data-theme=dark]{
  --paper:#0e0f12; --surface:#17191e; --surface-2:#1d1f25;
  --ink:#f1f2f4; --ink-2:#bcbfc7; --ink-3:#8b8e97;
  --line:#282a31; --line-2:#363942;
  --brand:#f0685c; --brand-soft:rgba(240,104,92,.14); --brand-line:rgba(240,104,92,.38);
  --ok:#2fb89b; --ok-soft:rgba(47,184,155,.14);
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-pop:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.5);
  --window-shadow:0 2px 6px rgba(0,0,0,.5),0 18px 48px rgba(0,0,0,.6);
  color-scheme:dark;
}
/* /vstack:shell tokens */
:root{ --panelw:320px }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:13px/1.45 var(--font);
  -webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:1px}

#app{display:grid;grid-template-rows:auto 1fr;height:100%}
#main{display:grid;grid-template-columns:1fr var(--panelw);min-height:0}
@media (max-width:820px){ #main{grid-template-columns:1fr} #panel{display:none} }

/* vstack:shell css */
/* The chrome every vstack page wears: the top bar and the controls that sit in
   it. Page layout stays in the page — some of these are app shells that fill
   the viewport, some are documents that scroll — but the bar, the buttons and
   the segmented controls are the same object everywhere. */
/* The shell hides its own controls with `hidden` — the link dot when there is
   no link, the primary action on a page that doesn't send. A class that sets
   `display` outranks the browser's default [hidden] rule, and .btn/.linkdot
   both do, so state this here rather than trusting each page's reset. */
[hidden]{display:none!important}
.vs-topbar{display:flex;align-items:center;gap:10px;padding:0 12px;height:46px;
  background:var(--surface);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:40}
.vs-topbar .brand{display:flex;align-items:center;gap:8px;min-width:0}
.vslink{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:inherit}
.vsmark{width:15px;height:15px;flex:none;color:var(--ink)}
.vslink:hover .vsmark{opacity:.8}
.brand .ws{font:700 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);white-space:nowrap}
.brand b{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:280px}
.brand .eyebrow{font:600 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);white-space:nowrap}
.spacer{flex:1}
.sep{width:1px;height:20px;background:var(--line);flex:none}

/* buttons — one shape, three sizes of intent */
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:7px;
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:550;
  white-space:nowrap;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.primary[disabled]{opacity:.45;cursor:default;filter:none;pointer-events:none}
.btn[disabled]{opacity:.45;cursor:default;pointer-events:none}
.btn.sm{height:25px;padding:0 9px;font-size:11.5px}

/* segmented control — modes, sizes, language, theme */
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden;
  background:var(--surface);flex:none}
.seg button{height:30px;padding:0 12px;font-weight:550;color:var(--ink-2);display:inline-flex;
  align-items:center;gap:6px;border:0;border-right:1px solid var(--line-2);background:none;
  cursor:pointer;font:inherit;font-weight:550}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--surface-2)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--surface)}
.seg.sm button{height:25px;padding:0 9px;font-size:11.5px}
#langSwitch button,#themeSwitch button{padding:0 9px;font-size:11.5px;font-weight:600}
#themeSwitch button{padding:0 8px}
#themeSwitch svg{width:13px;height:13px;display:block}

/* the live link, stated rather than implied */
.linkdot{display:inline-flex;align-items:center;gap:6px;font:600 10.5px/1 var(--mono);
  letter-spacing:.03em;color:var(--ink-3);white-space:nowrap}
.linkdot::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink-3);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--ink-3) 18%,transparent)}
.linkdot.on{color:var(--ok)}
.linkdot.on::before{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}

/* floating banners — the page talking back, never blocking the work */
.banner{position:fixed;left:50%;top:58px;transform:translateX(-50%);z-index:38;display:none;
  align-items:center;gap:10px;padding:8px 10px 8px 14px;border-radius:10px;box-shadow:var(--shadow-pop);
  font-size:12.5px;white-space:nowrap;max-width:calc(100% - 24px)}
.banner.on{display:flex}
.banner.dark{background:var(--ink);color:var(--surface)}
.banner.dark .btn{background:color-mix(in srgb,var(--surface) 16%,transparent);
  border-color:transparent;color:var(--surface)}
.banner.dark .btn:hover{background:color-mix(in srgb,var(--surface) 28%,transparent)}
.banner.good{background:var(--ok-soft);border:1px solid var(--ok);color:var(--ink)}
.banner.good .tick{color:var(--ok);font-weight:700}

@media (max-width:720px){
  .brand .ws,.brand .eyebrow{display:none}
  .vs-topbar{gap:8px;padding:0 8px}
}
/* /vstack:shell css */

/* the workspace bar sits above the window it wraps, not sticky over a scroll */
.vs-topbar{position:relative}
/* Send becomes Stop while a round is out. Not red-on-red: a stop is a quiet
   correction, not a second call to action competing with the one it replaces. */
#btnSend.stop{background:var(--surface);border-color:var(--brand-line);color:var(--brand)}
#btnSend.stop:hover{background:var(--brand);border-color:var(--brand);color:#fff;filter:none}
#btnSend.stop[disabled]{opacity:1;color:var(--ink-3);border-color:var(--line-2)}
.split #btnSend.stop + .caret{border-left-color:var(--brand-line)}
.btn .kbd{font:500 10px/1 var(--mono);opacity:.6}
.seg .kbd{font:500 10px/1 var(--mono);opacity:.65}
/* icon-only sizes: a control, not a call to action */
.seg.icons button{width:36px;padding:0;justify-content:center;color:var(--ink-3)}
.seg.icons button:hover{color:var(--ink)}
.seg.icons button[aria-pressed=true]{background:var(--surface-2);color:var(--ink)}

/* Send is the loop; approve is the way out of it. Same control, because they
   are the same decision made two ways — one more round, or done. */
.split{display:inline-flex}
.split .btn{border-radius:7px 0 0 7px}
.split .caret{border-radius:0 7px 7px 0;border-left:1px solid rgba(255,255,255,.28);padding:0 8px;width:28px;
  justify-content:center}
.split .btn[disabled]+.caret{border-left-color:rgba(255,255,255,.28)}
#sendMenu{position:absolute;top:42px;right:12px;z-index:60;width:266px;background:var(--surface);
  border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow-pop);padding:5px;display:none}
#sendMenu.on{display:block}
#sendMenu button{display:block;width:100%;text-align:left;padding:8px 9px;border-radius:7px}
#sendMenu button:hover{background:var(--surface-2)}
#sendMenu .t{display:block;font-weight:600;font-size:12.5px}
#sendMenu .d{display:block;font-size:11.5px;color:var(--ink-3);line-height:1.35;margin-top:3px}
#sendMenu .d:empty{display:none}
#sendMenu button.armed{background:var(--brand-soft)}
#sendMenu button.armed .t{color:var(--brand)}
#sendMenu button[disabled]{cursor:default}
#sendMenu button[disabled]:hover{background:none}
#sendMenu .warn{color:#b7791f;font-weight:600}
#sendMenu .mrule{height:1px;background:var(--line);margin:4px 6px}
#sendMenu .url{font:500 11px/1.4 var(--mono);color:var(--ok);word-break:break-all}
/* A link waiting under the caret is easy to miss — mark the caret itself. */
.split .caret{position:relative}
.split .caret.flag::after{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;
  border-radius:50%;background:#fff;box-shadow:0 0 0 2px var(--brand)}

/* The end of the review, said once and plainly. */
#doneScreen{position:fixed;inset:0;z-index:200;display:none;place-items:center;
  background:color-mix(in srgb,var(--ink) 34%,transparent);backdrop-filter:blur(2px)}
#doneScreen.on{display:grid}
#doneScreen .card{background:var(--surface);border-radius:14px;box-shadow:var(--window-shadow);
  padding:26px 28px;max-width:380px;text-align:center}
#doneScreen .tick{width:42px;height:42px;border-radius:50%;background:var(--ok-soft);color:var(--ok);
  display:grid;place-items:center;font-size:20px;font-weight:700;margin:0 auto 12px}
#doneScreen h2{margin:0 0 6px;font-size:16px}
#doneScreen p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.55}
#langSwitch button{padding:0 9px;font-size:11.5px;font-weight:600}
.seg svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}

/* ── canvas + the page's own browser window ── */
#canvasArea{display:grid;grid-template-rows:minmax(0,1fr) auto;min-width:0}
/* The dots live on the non-scrolling frame so they are painted once, instead of
   being repainted across the whole scrollable canvas on every scroll. */
#stageArea{position:relative;overflow:hidden;background:var(--surface-2);
  background-image:radial-gradient(circle at 1px 1px,var(--line-2) 1px,transparent 0);
  background-size:22px 22px}
#canvasWrap{position:absolute;inset:0;overflow:auto}
#canvas{padding:26px;display:flex;justify-content:center;min-height:100%;align-items:flex-start}

/* transform-origin is top-left so the negative margins in setZoom() shrink the
   layout box to exactly the scaled size — anything else and the window drifts. */
#browser{background:var(--surface);border-radius:11px;box-shadow:var(--window-shadow);
  transform-origin:top left;flex:none;overflow:hidden;border:1px solid var(--line-2);
  will-change:transform;backface-visibility:hidden}
.window-bar{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;
  background:linear-gradient(var(--surface),var(--surface-2));border-bottom:1px solid var(--line-2)}
.window-bar .reload{width:22px;height:22px;border-radius:5px;display:grid;place-items:center;
  color:var(--ink-3);font-size:13px;flex:none}
.window-bar .reload:hover{background:var(--line);color:var(--ink)}
.window-bar .url{flex:1;height:22px;border-radius:11px;background:var(--paper);border:1px solid var(--line);
  display:flex;align-items:center;padding:0 9px;font:600 11px/1 var(--mono);color:var(--ink-2);
  min-width:0;overflow:hidden;white-space:nowrap}
.window-bar .size{font:500 10.5px/1 var(--mono);color:var(--ink-3);flex:none}
.window-bar .vlabel{font:600 10px/1 var(--mono);padding:3px 6px;border-radius:5px;
  background:var(--surface-2);color:var(--ink-2);flex:none}
.window-bar .vlabel.hist{background:var(--brand-soft);color:var(--brand)}
#viewportBox{position:relative;overflow:auto;background:#fff;contain:paint}
#scroller{position:relative}
#frame{display:block;border:0;width:100%;background:#fff}

/* View is the page as it really is — the annotation layer steps out of the way
   completely. Annotate brings it back. */
#overlay{position:absolute;inset:0;overflow:hidden;contain:layout paint}
#overlay.view{pointer-events:none}
#overlay.view .mark{display:none}

.mark{position:absolute}
.mark.area{border:2px solid var(--mk);border-radius:3px;
  background:color-mix(in srgb,var(--mk) 8%,transparent);cursor:pointer}
.mark .lbl{display:none}
.mark.sel .lbl,#overlay:not(.view) .mark:hover .lbl{display:block}
.mark:hover{z-index:5}
.mark.area .lbl{position:absolute;left:0;top:100%;margin-top:4px;max-width:320px;
  background:var(--mk);color:#fff;padding:3px 7px;border-radius:4px;font:500 11.5px/1.35 var(--font);
  white-space:pre-wrap;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.mark.area.flip .lbl{top:auto;bottom:100%;margin:0 0 4px}
.mark .num{position:absolute;left:-1px;top:-19px;background:var(--mk);color:#fff;
  font:700 10px/1 var(--mono);padding:3px 5px;border-radius:4px 4px 0 0}
.mark.pin{width:24px;height:24px;border-radius:50% 50% 50% 3px;background:var(--mk);color:#fff;
  display:grid;place-items:center;font:700 11px/1 var(--font);transform:translate(-2px,-24px);
  box-shadow:0 1px 5px rgba(0,0,0,.28);cursor:pointer}
/* The pin is only 24px wide, so an absolute child would shrink-to-fit to almost
   nothing — max-content lets the note size to its text instead. */
.mark.pin .lbl{position:absolute;left:calc(100% + 5px);top:50%;transform:translateY(-50%);
  width:max-content;max-width:300px;background:var(--mk);color:#fff;padding:3px 7px;border-radius:4px;
  font:500 11.5px/1.35 var(--font);white-space:pre-wrap;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.mark.sel{outline:2px dashed var(--ink);outline-offset:3px}
.mark.ghost{opacity:.4;filter:saturate(.4)}
.mark.done{opacity:.32}
/* A comment belongs to the thing it was made on. When that thing is not on the
   page right now — a closed modal, a screen that is not showing — the mark goes
   with it rather than floating over whatever took its place. */
.mark.gone{display:none}
/* The page was rebuilt and the element could not be found again: the mark falls
   back to where it was drawn, and says so by looking unsure of itself. */
.mark.loose{opacity:.5;filter:saturate(.5)}
#drag{position:absolute;border:2px dashed var(--brand);border-radius:3px;display:none;
  background:color-mix(in srgb,var(--brand) 8%,transparent);pointer-events:none}

/* ── on-canvas composer ── */
#composer{position:absolute;z-index:30;width:280px;background:var(--surface);border:1px solid var(--line-2);
  border-radius:10px;box-shadow:var(--shadow-pop);display:none;overflow:hidden}
#composer.on{display:block}
#composer .chead{display:flex;align-items:center;gap:7px;padding:8px 9px 6px}
#composer .cnum{font:700 10px/1 var(--mono);color:#fff;background:var(--mk,var(--brand));
  padding:3px 5px;border-radius:4px}
#composer .ckind{font-size:11.5px;color:var(--ink-3);flex:1}
#composer .chead button{width:20px;height:20px;border-radius:4px;color:var(--ink-3);
  display:grid;place-items:center;font-size:12px}
#composer .chead button:hover{background:var(--surface-2);color:var(--brand)}
#composer .cstatus{font:600 9.5px/1 var(--font);letter-spacing:.04em;text-transform:uppercase;
  padding:3px 5px;border-radius:4px;background:var(--surface-2);color:var(--ink-3)}
#composer .cstatus.addressed{background:var(--ok-soft);color:var(--ok)}
#composer .cstatus.question{background:var(--brand-soft);color:var(--brand)}
#composer .cstatus:empty{display:none}
/* What this comment is attached to, said back to the reviewer as they type it. */
#composer .canchor{display:none;margin:0 9px 6px;font:500 11px/1.4 var(--mono);color:var(--ink-3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#composer .canchor.on{display:block}
#composer .canchor b{color:var(--ink-2);font-weight:650}
#composer .canchor.gone{color:var(--brand)}
#composer textarea{width:calc(100% - 18px);margin:0 9px;border:1px solid var(--line-2);border-radius:7px;
  padding:6px 7px;font-size:12.5px;line-height:1.45;resize:vertical;min-height:58px;background:var(--surface)}
#composer textarea:focus{outline:none;border-color:var(--brand);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 12%,transparent)}
#composer .cthread{margin:8px 9px 0;display:none;flex-direction:column;gap:7px;
  max-height:190px;overflow:auto}
#composer .cthread.on{display:flex}
#composer .msg{border-left:2px solid var(--line-2);padding-left:8px}
#composer .msg.claude{border-left-color:var(--brand)}
#composer .msg .who{font:600 10px/1 var(--font);letter-spacing:.04em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:3px}
#composer .msg.claude .who{color:var(--brand)}
#composer .msg .body{font-size:12.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
#composer .creply{display:none;margin-top:8px;min-height:44px}
#composer .creply.on{display:block}
#composer .cfoot{display:flex;align-items:center;gap:5px;padding:8px 9px;margin-top:8px;
  border-top:1px solid var(--line);background:var(--paper)}
#composer .cfoot .hint{flex:1;font-size:11px;color:var(--ink-3)}
#composer .csave{height:26px;padding:0 11px;border-radius:6px;background:var(--ink);color:#fff;
  font-weight:600;font-size:11.5px;flex:none}
#composer .csave:hover{filter:brightness(1.25)}
#composer .csave .kbd{font:500 9.5px/1 var(--mono);opacity:.6;margin-left:4px}
/* A comment Claude is working on keeps its own progress, wherever it is shown. */
#composer.working{border-color:var(--brand-line)}
#composer.working::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--brand-soft)}
#composer.working::before{content:"";position:absolute;bottom:0;height:2px;width:38%;background:var(--brand);
  z-index:1;animation:sweep 1.15s ease-in-out infinite}

/* ── right panel: the index ── */
/* Flex rather than a fixed row template: the working strip comes and goes, and
   a display:none grid child would silently reshuffle every other row. */
#panel{background:var(--surface);border-left:1px solid var(--line);display:flex;
  flex-direction:column;min-height:0}
#phead,#pfilter,#pwork,#pfoot{flex:none}
#phead{display:flex;align-items:center;gap:8px;padding:10px 12px 8px}
#phead b{font-size:13px}
#phead .scope{margin-left:auto;font-size:11px;color:var(--ink-3)}
#pfilter{display:flex;flex-wrap:wrap;gap:5px;padding:0 10px 8px;border-bottom:1px solid var(--line)}
#pfilter select{height:26px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);
  padding:0 3px;font-size:11.5px;color:var(--ink-2);flex:1 1 auto;min-width:0}
#pbody{flex:1;overflow:auto;padding:8px 10px 14px;min-height:0}

/* ── work in flight ──
   Progress lives on the comments themselves, so it is obvious *which* ones are
   being worked on — and cancel sits next to them, where the doubt is. */
#pwork{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);
  background:var(--brand-soft)}
#pwork[hidden]{display:none}

<script>
/* vstack:shell js */
/* The behaviour behind the top bar: theme, language, the link dot, and the
   page's own name. Everything else — what the page does — is the page's.

   Nothing here touches the network or the document beyond the bar, so a page
   works identically served, opened off disk, or published as an Artifact. */
window.VSShell = (function () {
  const $ = s => document.querySelector(s);
  const KEY = { theme: 'vstack:theme', lang: 'vstack:lang' };
  const store = {
    get (k, d) { try { return localStorage.getItem(k) ?? d } catch { return d } },
    set (k, v) { try { localStorage.setItem(k, v) } catch {} },
  };

  /* ── theme: auto (whatever the OS says) / light / dark ──
     Auto is the absence of an override, so the page keeps following the system
     if it changes while open — and an Artifact viewer's own toggle still wins
     the same way it does on a page that never had this control. */
  let theme = store.get(KEY.theme, 'auto');
  function applyTheme () {
    if (theme === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', theme);
    document.querySelectorAll('#themeSwitch button').forEach(b => {
      b.setAttribute('aria-pressed', String(b.dataset.themeSet === theme));
    });
  }
  function setTheme (next) {
    theme = ['auto', 'light', 'dark'].includes(next) ? next : 'auto';
    store.set(KEY.theme, theme);
    applyTheme();
  }

  /* ── language: chrome only. Page content stays as authored. ── */
  const storedLang = store.get(KEY.lang, null);
  let lang = storedLang === 'zh' ? 'zh' : 'en';
  const langListeners = [];
  function applyLang () {
    // zh-CN, not zh: the specific tag is what picks the right font and
    // line-breaking for simplified Chinese.
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    document.querySelectorAll('#langSwitch button').forEach(b => {
      b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
    });
    langListeners.forEach(fn => { try { fn(lang) } catch {} });
  }
  function setLang (next) {
    lang = next === 'zh' ? 'zh' : 'en';
    store.set(KEY.lang, lang);
    applyLang();
  }

  /* ── the live link, said out loud ── */
  function setLink (up, labels) {
    const el = $('#linkDot');
    if (!el) return;
    el.hidden = false;
    el.classList.toggle('on', !!up);
    el.textContent = up ? (labels?.on ?? 'LINKED TO CLAUDE') : (labels?.off ?? 'LINK LOST');
    el.title = up ? '' : (labels?.offTitle ?? '');
  }
  const hideLink = () => { const el = $('#linkDot'); if (el) el.hidden = true };

  function name (pageName, eyebrow) {
    const n = $('#pageName'); const e = $('#pageEyebrow');
    if (n && pageName != null) n.textContent = pageName;
    if (e && eyebrow != null) e.textContent = eyebrow;
  }

  function init (opts = {}) {
    document.querySelectorAll('#themeSwitch button').forEach(b => {
      b.addEventListener('click', () => setTheme(b.dataset.themeSet));
    });
    document.querySelectorAll('#langSwitch button').forEach(b => {
      b.addEventListener('click', () => setLang(b.dataset.lang));
    });
    if (opts.onLang) langListeners.push(opts.onLang);
    // `defaultLang` is what the artifact was authored in — it opens that way
    // once, and after that the reader's own choice is the one that sticks.
    if (opts.defaultLang && !storedLang) lang = opts.defaultLang === 'zh' ? 'zh' : 'en';
    if (opts.lang) { lang = opts.lang === 'zh' ? 'zh' : 'en'; store.set(KEY.lang, lang) }
    // Not every page sends something back — the form doesn't — so the primary
    // action stays out of the bar unless a page asks for it.
    const send = $('#send');
    if (send && opts.send) send.hidden = false;
    name(opts.name, opts.eyebrow);
    applyTheme();
    applyLang();
    return api;
  }

  const api = {
    init, setTheme, setLang, setLink, hideLink, name,
    get theme () { return theme },
    get lang () { return lang },
    onLang (fn) { langListeners.push(fn) },
  };
  return api;
})();
/* /vstack:shell js */
</script>
<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════════
   wireframe · review workspace

   One HTML file, opened in its own browser window. Two modes: View clicks
   through the page, Annotate comments on it. Two kinds of comment: click for a
   point, drag for an area. The wrapper never inspects or edits the page's
   markup — a comment is a place and some words.

   Two runtimes from one codebase:
     local    — served by review-server.mjs; feedback POSTs into the session.
     artifact — bundle-artifact.mjs inlines everything; feedback is copied.
   ══════════════════════════════════════════════════════════════════════ */

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const uid = () => 'c' + Math.random().toString(36).slice(2, 8);

/* One severity: everything the reviewer writes is something to do. The mark
   colour is the accent, and nothing on screen has to be decoded. */
const MARK = 'var(--brand)';

/* ── language ─────────────────────────────────────────────────────────
   The workspace chrome speaks two languages; the page under review is
   untouched, and comments stay in whatever words the reviewer typed. */
const STR = {
  en: {
    viewLabel: 'View', annotateLabel: 'Annotate',
    view: 'View — click through the page (space)', annotate: 'Annotate — click for a comment, drag for an area (space)',
    del: 'Delete comment', clearAll: 'Clear all', clearSure: 'Sure?',
    cleared: n => `Cleared ${n} comment${n > 1 ? 's' : ''}`,
    comments: 'Comments',
    open: 'Open', asked: 'Claude asked', all: 'All', addressed: 'Addressed',
    send: 'Send to Claude', copyFor: 'Copy for Claude',
    comment: 'Comment', areaComment: 'Area comment', notePlaceholder: 'What needs to change?',
    replyPlaceholder: 'Reply…', answerPlaceholder: 'Answer Claude…',
    statusAddressed: 'addressed', statusAsked: 'claude asked',
    you: 'You', claude: 'Claude',
    emptyTitle: 'No comments yet.', emptyBody: 'In Annotate mode, click a spot for a comment or drag over an area. The note opens right there on the page — this list is just the index.',
    noNote: 'No note yet', claudeAsked: 'Claude asked something', addressedBy: 'Addressed by Claude',
    reply: 'reply', replies: 'replies', otherSizes: n => `On other screen sizes (${n})`,
    stillOpen: n => `Still open from earlier versions (${n})`,

/* The four screens people actually design for. Comments belong to the size they
   were made at — a note about the phone layout is meaningless on ultrawide. */
const SIZES = [
  { id: 'ultrawide', width: 2560, height: 1440,
    icon: '<rect x="1.5" y="5" width="21" height="11" rx="1.5"/><path d="M8 20h8M12 16v4"/>' },
  { id: 'desktop', width: 1440, height: 900,
    icon: '<rect x="3" y="4.5" width="18" height="12" rx="1.5"/><path d="M8.5 20h7M12 16.5V20"/>' },
  { id: 'tablet', width: 834, height: 1112,
    icon: '<rect x="5.5" y="2.5" width="13" height="19" rx="2"/><path d="M11 18.7h2"/>' },
  { id: 'phone', width: 390, height: 844,
    icon: '<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M10.6 5.3h2.8"/>' },
];

const S = {
  runtime: 'local',
  name: 'Review', fileName: 'page.html',
  html: '', versions: [], reviews: {},
  version: 1, viewing: 1,
  mode: 'annotate',
  size: SIZES[1],
  zoom: 1,
  ann: [], carried: [],
  sel: null,
  // Comments whose element is not on the page as it stands right now.
  offscreen: new Set(),
  // Threads opened in the panel, and which reply box the cursor is in.
  threadOpen: new Set(), focusReply: null,
  awaiting: false, pendingUpdate: null, sentSig: null,
  // Which comments went out with the last send and have not come back yet.
  working: new Set(),
  // A stop has been asked for and the round has not ended yet.
  stopping: false,
  linked: null,   // null until the connection has actually said one way or other
  // The shareable Artifact: asked for here, published by Claude, link comes back.
  share: { url: null, version: null, pending: false },
  filter: { status: 'open' },
};
const isHistory = () => S.viewing !== S.version;

/* ─────────────────────────── boot ─────────────────────────── */

async function boot () {
  const inline = JSON.parse($('#bundle').textContent || 'null');
  let data = inline;
  if (!data) {
    try { data = await (await fetch('/api/project')).json() }
    catch {
      document.body.innerHTML = '<div class="empty" style="padding:80px">Could not reach the review server.<br>Start it with <code>node review-server.mjs serve --file &lt;page.html&gt;</code>.</div>';
      return;
    }
  }
  S.runtime = data.mode || (inline ? 'artifact' : 'local');
  S.name = data.name || 'Wireframe';
  S.fileName = data.fileName || 'page.html';
  S.html = data.html || '';
  S.versions = data.versions || [];
  S.reviews = data.reviews || {};
  S.version = S.viewing = data.currentVersion || 1;
  adoptShare(data);

  loadAnnotations();
  VSShell.init({ name: S.name, eyebrow: 'Review' });
  document.title = S.name + ' — Review · Visual Stack';
  $('#urlBar').textContent = S.fileName;
  LANG = VSShell.lang;
  buildSizes(); wireChrome(); wireComposer(); buildTimeline(); applyLang();
  setMode('annotate'); loadFrame(); render();
  if (S.runtime === 'local') liveReload();
}

function loadAnnotations () {
  const local = S.runtime === 'artifact' ? lsGet() : null;
  S.ann = (local ?? S.reviews[S.version]?.annotations ?? []).map(normalise);
  // A question is waiting on an answer — open its thread so the box to type it
  // in is already there.
  for (const a of S.ann) if (a.status === 'question') S.threadOpen.add(a.id);
  S.carried = [];
  for (const [v, rev] of Object.entries(S.reviews)) {
    if (Number(v) >= S.version) continue;
    for (const a of rev.annotations || []) {
      if (a.status === 'open') S.carried.push({ ...normalise(a), fromVersion: Number(v) });
    }
  }
}
// status: open (waiting on Claude) · question (Claude asked, waiting on you) ·
// addressed (Claude changed it). Only Claude moves a comment to addressed.
const normalise = a => ({ status: 'open', note: '', size: 'desktop', replies: [], ...a });
const lsKey = () => `ui-review:${S.fileName}:v${S.version}`;
const lsGet = () => { try { return JSON.parse(localStorage.getItem(lsKey())) } catch { return null } };

let saveTimer = null;
function save () {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    // A comment being composed is not feedback yet — it never leaves the tab
    // until it has words, so closing the browser mid-thought leaves no trace.
    const real = S.ann.filter(hasSubstance);
    if (S.runtime === 'artifact') { try { localStorage.setItem(lsKey(), JSON.stringify(real)) } catch {} ; return }
    try {
      await fetch('/api/annotations', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ version: S.version, annotations: real }),
      });
    } catch {}
  }, 700);
}

/** Claude edits the file while it is open here. Never swap the page out from
    under the reviewer — announce it, let them pick the moment. */
function liveReload () {
  const es = new EventSource('/api/events');
  // The same tell the story map carries: whether the session on the other end
  // is still there. EventSource reconnects on its own, so this only ever
  // reports what is true right now.
  es.onopen = () => setLink(true);
  es.onerror = () => setLink(false);
  es.addEventListener('reload', async () => {
    let data;
    try { data = await (await fetch('/api/project')).json() } catch { return }
    // The link can land on its own, without the page or the review moving.
    adoptShare(data, true);
    const bumped = (data.currentVersion || 1) !== S.version;
    if (!bumped && data.html === S.html) {
      // Only the conversation moved — fold it in without touching the page.
      if (mergeThreads(data.reviews?.[S.version]?.annotations || [])) {
        render();
        if (S.sel) openComposer(S.sel, false);
        toast(T('replied'));
      }
      return;
    }
    S.pendingUpdate = data;
    // Mid-edit saves are not news — the comments being worked on already say so.
    // Only a version that has actually landed is worth interrupting for.
    if (bumped) {
      const meta = (data.versions || []).find(v => v.n === data.currentVersion);
      showWork(T('ready')(data.currentVersion) + (meta?.label ? ' — ' + esc(meta.label) : ''));
    } else if (!S.awaiting) showWork(T('changed'));
  });
}
function showWork (html) {
  const b = $('#workBanner');
  b.classList.add('on', 'ready');
  $('#workText').innerHTML = '<span class="tick">✓</span> ' + html;
}
const hideWork = () => $('#workBanner').classList.remove('on');

/** Is the session on the other end still there? Silent until it knows — a dot
    that says "lost" during the first handshake is just wrong. */
function setLink (up) {
  S.linked = up;
  if (S.runtime !== 'local' || up === null) { VSShell.hideLink(); return }
  VSShell.setLink(up, { on: T('linkOn'), off: T('linkOff'), offTitle: T('linkOffTitle') });
}

/* ─────────────── work in flight ───────────────
   A sent comment is out of the reviewer's hands until Claude publishes or
   answers. Saying so on the comment itself — and offering to call it off there —
   beats a banner that covers the page it is talking about. */
const setWorking = ids => { S.working = new Set(ids); renderPanel() };
function clearWorking () {
  if (!S.working.size) return;
  S.working.clear();
  renderPanel();
}
function renderWork () {
  // A comment Claude has finished with, or asked about, is no longer in flight.
  for (const id of [...S.working]) {
    const a = S.ann.find(x => x.id === id);
    if (!a || a.status !== 'open') S.working.delete(id);
  }
  const n = S.working.size;
  // Claude answering or addressing the last comment in flight ends the round
  // just as surely as publishing does — the button has to come back.
  if (!n && S.stopping) { S.stopping = false; S.awaiting = false }
  $('#pwork').hidden = !n;
  if (n) $('#pworkText').textContent = S.stopping ? T('stopping') : T('workingOn')(n);
  $('#btnCancel').disabled = S.stopping;
  composer.classList.toggle('working', !!S.sel && S.working.has(S.sel));
}

/** Stop, rather than let Claude finish something the reviewer no longer wants.
    This raises a request; it cannot reach into a turn already running. Claude
    checks for it at each checkpoint in the round and stops there — so the
    button says "Stopping…" until the round actually ends, rather than
    pretending the work died the instant it was pressed. */
async function cancelWork () {
  if (S.stopping || !S.working.size) return;
  const ids = [...S.working];
  if (S.runtime !== 'local') { clearWorking(); S.awaiting = false; return }
  S.stopping = true;
  renderCounts(); renderWork();
  try {
    await fetch('/api/cancel', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ version: S.version, comments: ids, reason: 'The reviewer stopped this round from the workspace.' }),
    });
    // Sending the same review again has to be possible after calling it off.
    S.sentSig = null;
    toast(T('stopAsked'));
  } catch {
    S.stopping = false;
    renderCounts(); renderWork();
    toast(T('cancelFail'));
  }
}

/** The round is over — however it ended. Claude publishing, replying or
    closing the review all land here, and the button goes back to Send. */
function roundEnded () {
  S.stopping = false;
  S.awaiting = false;
  clearWorking();
  renderCounts();
}

/** Server-side thread state wins; whatever the reviewer is typing does not. */
function mergeThreads (serverAnn) {
  let changed = false;
  const seen = new Set();
  for (const sa of serverAnn) {
    seen.add(sa.id);
    const local = S.ann.find(a => a.id === sa.id);
    if (!local) { S.ann.push(normalise(sa)); changed = true; continue }
    const sr = (sa.replies || []).length, lr = (local.replies || []).length;
    // Claude has said something — open that thread in the list, where the
    // answer is going to be typed.
    if (sr !== lr) { local.replies = sa.replies || []; S.threadOpen.add(local.id); changed = true }
    if (sa.status !== local.status) {
      local.status = sa.status;
      if (sa.status === 'question') S.threadOpen.add(local.id);
      // A comment that has been addressed again starts clean: whatever was
      // asked for on the way here has now been answered.
      if (sa.status === 'addressed') { delete local.revert; delete local.reopenedAt }
      changed = true;
    }
  }
  return changed;
}

function adoptUpdate () {
  const data = S.pendingUpdate;
  S.pendingUpdate = null; hideWork(); roundEnded();
  if (!data) { loadFrame(true); return }
  const bumped = (data.currentVersion || 1) !== S.version;
  S.html = data.html; S.versions = data.versions; S.reviews = data.reviews;
  S.version = data.currentVersion; S.name = data.name || S.name;
  if (bumped) { S.viewing = S.version; loadAnnotations(); S.sentSig = null }
  closeComposer();
  VSShell.name(S.name);
  buildTimeline(); loadFrame(); render();
  if (bumped) toast(T('nowReviewing')(S.version));
}

/* ───────────────────── chrome & controls ───────────────────── */

function buildSizes () {
  const wrap = $('#sizeSwitch');
  wrap.innerHTML = '';
  for (const s of SIZES) {
    const b = document.createElement('button');
    b.dataset.size = s.id;
    b.title = `${T(s.id)} — ${s.width} × ${s.height}`;
    b.setAttribute('aria-pressed', String(s.id === S.size.id));
    b.innerHTML = `<svg viewBox="0 0 24 24">${s.icon}</svg>`;
    b.onclick = () => setSize(s.id);
    wrap.appendChild(b);
  }
}
function setSize (id) {
  const s = SIZES.find(x => x.id === id);
  if (!s || s.id === S.size.id) return;
  S.size = s;
  $$('#sizeSwitch button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.size === id)));
  closeComposer();
  // The frame height follows the new viewport, so refit before anything reads it.
  applyWindowSize(); fitFrameHeight(); fitZoom(); drawMarks(); renderPanel();
}
/** Re-label every static surface. Comment text is the reviewer's, never ours. */
function applyLang () {
  const mv = $('#modeSwitch [data-mode=view]'), ma = $('#modeSwitch [data-mode=annotate]');
  mv.textContent = T('viewLabel'); mv.title = T('view');
  ma.innerHTML = esc(T('annotateLabel')) + ' <span class="kbd">space</span>'; ma.title = T('annotate');
  $('#btnReload').title = T('reloadTitle');
  $('#btnNow').textContent = T('backToCurrent');
  $('#btnRefresh').textContent = T('reviewChanges');
  $('#btnDismissWork').textContent = T('later');
  $('#btnCopyShare').textContent = T('copyLink');
  $('#btnDismissShare').textContent = T('later');
  if ($('#shareBanner').classList.contains('on')) showShareReady();
  $('#btnCancel').textContent = T('cancel');
  renderApprove(); renderShare();
  composer.querySelector('.csave').innerHTML = esc(T('save')) + ' <span class="kbd">⏎</span>';
  composer.querySelector('.hint').textContent = T('newlineHint');
  setLink(S.linked);
  renderWork();
  $('#phead').querySelector('b').textContent = T('comments');
  renderCounts();   // the primary button says Send or Stop depending on the round
  const st = $('#fStatus');
  [['open', 'open'], ['question', 'asked'], ['', 'all'], ['addressed', 'addressed']]
    .forEach(([v, k], i) => { st.options[i].textContent = T(k) });
  buildSizes();
  render(); syncTimeline();
  if (S.sel) openComposer(S.sel, false);
}
function setLang (l) {
  if (l === LANG) return;
  LANG = l;
  applyLang();
}

function wireChrome () {
  $$('#modeSwitch button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
  VSShell.onLang(setLang);   /* the switch is the shell's; this is the workspace's answer */
  $('#fStatus').onchange = e => { S.filter.status = e.target.value; renderPanel() };
  $('#btnReload').onclick = () => S.pendingUpdate ? adoptUpdate() : loadFrame(true);
  // Two clicks, because throwing away a whole review by accident would sting.
  let armed = null;
  const clear = $('#btnClear');
  clear.onclick = () => {
    if (!S.ann.some(hasSubstance)) return;
    if (!armed) {
      armed = setTimeout(() => { armed = null; clear.classList.remove('armed'); renderCounts() }, 3000);
      clear.classList.add('armed');
      clear.textContent = T('clearSure');
      return;
    }
    clearTimeout(armed); armed = null; clear.classList.remove('armed');
    const n = S.ann.filter(hasSubstance).length;
    S.ann = []; S.sentSig = null;
    closeComposer(); save(); render();
    toast(T('cleared')(n));
  };
  $('#btnNow').onclick = () => gotoVersion(S.version);
  $('#btnRefresh').onclick = adoptUpdate;
  $('#btnDismissWork').onclick = hideWork;
  $('#btnCopyShare').onclick = () => { if (S.share.url) copy(S.share.url); hideShare() };

/* ───────────────────── panel: the index ───────────────────── */

function renderPanel () {

    : reg.kind === 'region' ? (reg.label ? ` inside “${reg.label}”,` : '')
    : ` inside ${reg.kind}${reg.label ? ` “${reg.label}”` : ''},`;
  return `on ${el}${words ? ` “${words}”` : ''},${region} ${geo}`;
}

/** Everything the box was drawn around, in the order it appears on the page. */
const coversLine = a => a.covers.map(c => `\`<${c.tag}>\` “${c.text}”`).join(' · ') +
  (a.covers.length >= COVER_MAX ? ' · …' : '');

function buildFeedback () {
  const items = S.ann.filter(a => a.status !== 'addressed' && hasSubstance(a));
  const carried = S.carried.filter(a => a.status !== 'addressed');

  const reverts = items.concat(carried).filter(a => a.revert);
  const reopened = items.concat(carried).filter(a => a.reopenedAt && !a.revert);

  const L = [];
  L.push(`# Wireframe review — ${S.name} · v${S.version}`);
  L.push(`${items.length} comment(s) — every one is a must` +
    (carried.length ? ` · ${carried.length} carried over` : '') +
    (reverts.length ? ` · ${reverts.length} revert` : '') +
    (reopened.length ? ` · ${reopened.length} reopened` : ''));
  L.push('');
  L.push(`Apply these to \`${S.fileName}\`, then publish the next version.`);
  if (reverts.length || reopened.length) {
    L.push('');
    L.push('Some of these you already marked addressed and they were sent back: ' +
      '**revert** means undo what you did there, **reopened** means it did not go far enough. ' +
      'Read the note and the thread again before touching anything.');
  }
  L.push('');

  const bySize = {};
  for (const a of items) (bySize[a.size || 'desktop'] ||= []).push(a);
  for (const sid of SIZES.map(s => s.id)) {
    const list = bySize[sid];
    if (!list?.length) continue;
    const size = SIZES.find(s => s.id === sid);
    // The brief is written for Claude, so it stays in English whatever the
    // workspace is showing. The reviewer's own words pass through untouched.
    L.push(`## ${STR.en[sid]} — ${size.width} × ${size.height}`);
    L.push('');
    for (const a of list) {
      L.push(`### #${num(a)}${a.revert ? ' · REVERT' : ''}`);
      if (a.revert) L.push('**They asked for your last change here to be undone** — restore what was there before, then apply the note again only if it still stands.');
      L.push(`**Where** ${whereLine(a)}`);
      if (a.covers?.length) L.push(`**Covers** ${coversLine(a)}`);
      if (a.note) L.push(a.note);
      for (const m of a.replies || []) {
        L.push('');
        L.push(`> **${m.by === 'claude' ? 'You asked' : 'They replied'}:** ${m.text}`);
      }
      L.push('');
    }
  }
  if (carried.length) {
    L.push('## Still open from earlier versions');
    L.push('');
    for (const a of carried) {
      L.push(`- **[v${a.fromVersion}]** ${a.note} — ${whereLine(a)}`);
    }
    L.push('');
  }
  L.push('---');
  L.push('Mark what you changed as done, and ask about anything unclear instead of guessing:');
  L.push('```bash');
  L.push('node review-server.mjs publish --file <page.html> --label "<what changed>" --addressed ' +
    items.concat(carried).map(a => a.id).join(','));
  L.push('node review-server.mjs reply --file <page.html> --comment <id> --text "<your question>"');
  L.push('```');

  const payload = {
    page: S.fileName, name: S.name, version: S.version,
    comments: items.concat(carried).map(a => ({
      id: a.id, kind: a.kind, status: a.status, note: a.note,
      replies: a.replies || [],
      // Reopened after you called it done — either put it back (revert) or
      // take it further. Either way it is not finished.
      reopened: !!a.reopenedAt, wantsRevert: !!a.revert,
      anchorText: a.anchorText || null,
      // What the comment is attached to. `selector` is how the workspace finds
      // the element again to keep the mark on it — a hint for you, not a promise
      // about the markup.
      anchor: a.anchor ? {
        selector: a.anchor.sel, tag: a.anchor.tag, id: a.anchor.id || null,
        classes: a.anchor.cls || null, role: a.anchor.role || null,
        label: a.anchor.label || null, text: a.anchor.text || null,
        region: a.anchor.region || null,
      } : null,
      // For an area: what was inside the box when it was drawn.
      covers: a.covers?.length ? a.covers : null,
      screenSize: a.size || 'desktop',
      point: a.point || null, rect: a.rect || null,
      fromVersion: a.fromVersion || S.version,
    })),
  };
  return {
    markdown: L.join('\n') + '\n\n```json\n' + JSON.stringify(payload, null, 2) + '\n```\n',
    feedback: payload,
    counts: { total: items.length + carried.length },
  };
}

/** What was last handed over, so an unchanged review can't be sent twice. */
const reviewSignature = () => JSON.stringify(S.ann
  .filter(a => a.status !== 'addressed' && hasSubstance(a))
  .map(a => [a.id, a.note, a.status, !!a.revert, (a.replies || []).length]));

async function openSend () {
  closeComposer();
  const pending = buildFeedback();
  if (!pending.counts.total) return;
  if (S.runtime === 'artifact') {
    await copy(pending.markdown);
    S.sentSig = reviewSignature();
    renderCounts();
    return;
  }
  try {
    await fetch('/api/feedback', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ version: S.version, annotations: S.ann.filter(hasSubstance), ...pending }),
    });
    S.awaiting = true;
    S.sentSig = reviewSignature();
    // Every comment that just went out is now in flight, and says so on itself.
    setWorking(pending.feedback.comments.map(c => c.id));
    toast(T('working')(pending.counts.total));
  } catch { toast(T('sendFail')) }
}
$('#btnSend').onclick = () => (S.working.size ? cancelWork() : openSend());

/* ─────────────── approve: the way out of the loop ───────────────
   Send says "one more round". Approve says the design is done — it closes the
   review, which ends the server and hands Claude back the thread. It sits under
   the same button because it is the same decision, answered the other way. */
const sendMenu = $('#sendMenu');
let approveArmed = null;
function closeSendMenu () {
  sendMenu.classList.remove('on');
  $('#btnSendMore').setAttribute('aria-expanded', 'false');
  clearTimeout(approveArmed); approveArmed = null;
  renderApprove();
}
// Opening the menu is seeing the link — the flag has done its job.
const clearShareFlag = () => $('#btnSendMore').classList.remove('flag');
function renderApprove () {
  const open = S.ann.filter(a => a.status !== 'addressed' && hasSubstance(a)).length + S.carried.length;
  const armed = !!approveArmed;
  $('#btnApprove').classList.toggle('armed', armed);
  $('#btnApprove .t').textContent = armed ? T('approveSure') : T('approve');
  $('#btnApprove .d').innerHTML = esc(T('approveHint')) +
    (open ? `<br><span class="warn">${esc(T('approveOpen')(open))}</span>` : '');
}
$('#btnSendMore').onclick = e => {
  e.stopPropagation();
  const on = !sendMenu.classList.contains('on');
  closeSendMenu();
  if (!on) return;
  sendMenu.classList.add('on');
  $('#btnSendMore').setAttribute('aria-expanded', 'true');
  clearShareFlag();
  renderApprove(); renderShare();
};
// Signing off ends the review for everyone, so it asks once — the same second
// click Clear all asks for.
$('#btnApprove').onclick = () => {
  if (!approveArmed) {
    approveArmed = setTimeout(() => { approveArmed = null; renderApprove() }, 4000);
    renderApprove();
    return;
  }
  clearTimeout(approveArmed); approveArmed = null;
  approve();
};
document.addEventListener('pointerdown', e => {
  if (sendMenu.classList.contains('on') && !e.target.closest('#sendMenu, #btnSendMore')) closeSendMenu();
});

/* ─────────────── the shareable copy ───────────────
   The workspace cannot publish an Artifact — only Claude can. So this asks, the
   same way cancel and approve ask, and the link comes back down the same wire
   the page reloads on. */
function adoptShare (data, announce) {
  const had = S.share.url;
  S.share = {
    url: data.shareUrl || null,
    version: data.shareVersion || null,
    pending: !!data.sharePending,
  };
  const fresh = !!S.share.url && S.share.url !== had;
  if (fresh) $('#btnSendMore').classList.add('flag');
  renderShare();
  // A toast at the bottom of the screen outlives nobody's attention for a wait
  // this long. Announce it the way a new version is announced.
  if (fresh && announce) showShareReady();
}
function showShareReady () {
  $('#shareBannerText').innerHTML = '<span class="tick">✓</span> ' + T('shareBannerReady');
  $('#shareBanner').classList.add('on');
}
const hideShare = () => $('#shareBanner').classList.remove('on');
function renderShare () {
  const b = $('#btnShare');
  if (S.runtime === 'artifact') { b.hidden = true; $('#sendMenu .mrule').hidden = true; return }
  const s = S.share;
  b.disabled = s.pending;
  if (s.pending) { b.querySelector('.t').textContent = T('shareWorking'); b.querySelector('.d').textContent = T('shareWait'); return }
  if (s.url && s.version === S.version) {
    b.querySelector('.t').textContent = T('shareReady');
    b.querySelector('.d').innerHTML = `<span class="url">${esc(s.url)}</span>`;
    return;
  }
  // The label says what the button does; only a stale link needs explaining.
  b.querySelector('.t').textContent = s.url ? T('shareStale') : T('share');
  b.querySelector('.d').textContent = s.url ? T('shareStaleHint')(s.version) : '';
}
async function requestShare () {
  const s = S.share;
  // A link that is already current is a link to copy, not one to ask for again.
  if (s.url && s.version === S.version) { copy(s.url); closeSendMenu(); return }
  S.share.pending = true; renderShare();
  try {
    await fetch('/api/share', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ version: S.version }),
    });
    toast(T('shareAsked'));
  } catch { S.share.pending = false; renderShare(); toast(T('shareFail')) }
  closeSendMenu();
}
$('#btnShare').onclick = requestShare;

async function approve () {
  closeSendMenu();
  const open = S.ann.filter(a => a.status !== 'addressed' && hasSubstance(a));
  if (S.runtime === 'artifact') { showDone(); return }
  try {
    await fetch('/api/approve', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        version: S.version,
        openComments: open.map(a => ({ id: a.id, note: a.note })),
      }),
    });
    showDone();
  } catch { toast(T('approveFail')) }
}
function showDone () {
  clearWorking();
  closeComposer();
  setMode('view');
  hideWork(); hideShare();
  $('#doneTitle').textContent = T('approvedTitle');
  $('#doneBody').textContent = T('approvedBody');
  $('#doneScreen').classList.add('on');
}
async function copy (t) {
  try { await navigator.clipboard.writeText(t); toast(T('copied')) }
  catch {
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove(); toast(T('copied'));
  }
}
let tt = null;
function toast (m) {
  const t = $('#toast'); t.textContent = m; t.classList.add('on');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2200);
}

boot();
</script>
</body>
</html>
