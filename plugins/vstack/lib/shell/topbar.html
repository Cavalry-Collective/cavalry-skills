<div class="vs-topbar" id="top">
  <div class="brand">
    <a class="vslink" href="https://cavalry.sg/visual-stack" target="_blank" rel="noopener"
       title="Visual Stack">
      <svg class="vsmark" viewBox="0 0 64 64" aria-hidden="true">
        <g fill="currentColor"><rect x="6" y="44" width="52" height="16"/><rect x="6" y="24" width="52" height="16"/><rect x="6" y="4" width="40" height="16"/></g>
        <rect x="46" y="4" width="12" height="16" fill="var(--brand)"/>
      </svg>
    </a>
    <!-- The mark is the stack; the word beside it is this tool. Writing
         "Visual Stack" here said what the logo already says, and pushed the
         one thing you can't infer — which tool you are in — further right. -->
    <b id="pageName"></b>
    <span class="wip" id="wip" hidden></span>
    <span class="eyebrow" id="pageEyebrow"></span>
  </div>
  <div class="spacer"></div>
  <!-- The page's own controls: `tools` sits before the shared switches,
       `actions` after them, where the primary action belongs. -->
  <!-- vstack:slot tools -->
  <!-- /vstack:slot tools -->
  <div class="seg" id="themeSwitch">
    <button data-theme-set="auto" aria-pressed="true" title="Match the system">A</button>
    <button data-theme-set="light" aria-pressed="false" title="Light">
      <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="8" cy="8" r="3.1"/><path d="M8 .9v2M8 13.1v2M.9 8h2M13.1 8h2M3 3l1.4 1.4M11.6 11.6 13 13M13 3l-1.4 1.4M4.4 11.6 3 13" stroke-linecap="round"/>
      </svg>
    </button>
    <button data-theme-set="dark" aria-pressed="false" title="Dark">
      <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M13.4 9.6A5.8 5.8 0 0 1 6.4 2.6a5.8 5.8 0 1 0 7 7Z" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
  <div class="seg" id="langSwitch">
    <button data-lang="en" aria-pressed="true">EN</button>
    <button data-lang="zh" aria-pressed="false">中文</button>
  </div>
  <div class="sep"></div>
  <span class="linkdot" id="linkDot" hidden></span>
  <button class="btn primary" id="send" disabled hidden></button>
  <!-- vstack:slot actions -->
  <!-- /vstack:slot actions -->
</div>
